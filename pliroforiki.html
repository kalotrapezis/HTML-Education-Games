    if (ti === tasks.length) complete('🎉 Μπράβο! Τα κατάφερες όλα στην επιφάνεια εργασίας!');
    else say('✅ Σωστά!', 'good');
  }
  function drawTasks() {
    side.innerHTML = '';
    tasks.forEach(([t], i) => side.appendChild(el('div', 'task' + (i < ti ? ' ok' : i === ti ? ' cur' : ''), (i < ti ? '✅ ' : `${i + 1}. `) + t)));
  }
  const closeMenus = () => desk.querySelectorAll('.ctx, .startmenu').forEach(m => m.remove());
  function menuAt(ev, items) {
    closeMenus();
    const [x, y] = deskXY(ev);
    const m = el('div', 'ctx');
    Object.assign(m.style, { left: Math.min(x, DESK_W - 230) + 'px', top: Math.min(y, DESK_H - BAR - items.length * 50 - 10) + 'px' });
    for (const [label, fn] of items) { const b = el('button', '', label); b.onclick = () => { closeMenus(); fn(); }; m.appendChild(b); }
    desk.appendChild(m);
  }

  // ---------- εικονίδια
  function drawIcon(ic) {
    if (!ic.el) { ic.el = el('div', 'dicon'); desk.appendChild(ic.el); }
    const d = ic.el;
    d.innerHTML = `<span>${ic.em}${ic.kind === 'app' ? '<i class="sc">↗</i>' : ''}</span><div class="nm"></div>`;
    d.lastChild.textContent = ic.name;
    d.style.left = ic.x + 'px'; d.style.top = ic.y + 'px';
    let start;
    press(d, {
      onTap: () => { closeMenus(); desk.querySelectorAll('.dicon').forEach(o => o.classList.remove('sel')); d.classList.add('sel'); selIcon = ic; },
      onDouble: () => openWin(ic),
      onLong: e => menuAt(e, [['📂 Άνοιγμα', () => openWin(ic)], ['✏️ Μετονομασία', () => rename(ic)]]),
      onDrag: (dx, dy) => { start = start || [ic.x, ic.y]; ic.x = Math.max(0, Math.min(DESK_W - 130, start[0] + dx)); ic.y = Math.max(0, Math.min(DESK_H - BAR - 110, start[1] + dy)); d.style.left = ic.x + 'px'; d.style.top = ic.y + 'px'; },
      onDragEnd: () => { start = null; event({ t: 'moveicon', id: ic.id }); },
    });
  }
  function rename(ic) {
    const d = ic.el;
    const inp = el('input', 'rn');
    inp.value = ic.name;
    d.lastChild.replaceWith(inp);
    inp.focus(); inp.select();
    let doneRn = false;
    const commit = () => { if (doneRn) return; doneRn = true; ic.name = inp.value.trim() || ic.name; drawIcon(ic); event({ t: 'rename', id: ic.id, name: ic.name }); };
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') commit(); };
    inp.onblur = commit;
    say('⌨️ Γράψε το νέο όνομα και πάτα Enter (στον πίνακα: πληκτρολόγιο οθόνης).');
  }
  function newFolder(ev) {
    const n = icons.length;
    const ic = { id: 'new' + nextNew++, kind: 'folder', em: '📁', name: 'Νέος φάκελος', body: '(Ο φάκελος είναι άδειος)', x: 16 + Math.floor(n / 4) * 140, y: 10 + (n % 4) * 122 };
    icons.push(ic);
    drawIcon(ic);
    event({ t: 'newfolder' });
    rename(ic); // όπως στα Windows: ο νέος φάκελος περιμένει όνομα
  }

  // ---------- παράθυρα
  function geom(w) {
    const H = DESK_H - BAR;
    return w.state === 'max' ? [0, 0, DESK_W, H] : w.state === 'left' ? [0, 0, DESK_W / 2, H] : w.state === 'right' ? [DESK_W / 2, 0, DESK_W / 2, H] : [w.x, w.y, WIN_W, WIN_H];
  }
  function layout(w) {
    const [x, y, ww, hh] = geom(w);
    Object.assign(w.el.style, { left: x + 'px', top: y + 'px', width: ww + 'px', height: hh + 'px', display: w.min ? 'none' : 'flex', zIndex: w.z });
    w.maxBtn.textContent = w.state === 'normal' ? '▢' : '❐';
    drawBar();
  }
  const focus = w => { w.z = ++z; layout(w); };
  function openWin(ic, from) {
    closeMenus();
    let w = wins[ic.id];
    if (w) { w.min = false; focus(w); return event({ t: 'open', id: ic.id, kind: ic.kind, name: ic.name, from }); }
    const n = Object.keys(wins).length;
    w = wins[ic.id] = { ic, state: 'normal', x: 200 + n * 40, y: 30 + n * 30, min: false, z: ++z };
    w.el = el('div', 'win', `<div class="title"><span>${ic.em}</span><span class="tn"></span></div><div class="body">${ic.body}</div>`);
    w.el.querySelector('.tn').textContent = ic.name;
    const title = w.el.firstChild;
    const mk = (cls, txt, fn) => { const b = el('button', 'wb ' + cls, txt); b.onclick = e => { e.stopPropagation(); fn(); }; title.appendChild(b); return b; };
    mk('mn', '—', () => { w.min = true; layout(w); event({ t: 'min', id: ic.id }); });
    w.maxBtn = mk('mx', '▢', () => { const was = w.state; w.state = was === 'normal' ? 'max' : 'normal'; layout(w); event({ t: was === 'normal' ? 'max' : 'unmax', id: ic.id }); });
    mk('x', '✕', () => { w.el.remove(); delete wins[ic.id]; drawBar(); event({ t: 'close', id: ic.id }); });
    w.el.onpointerdown = () => focus(w);
    // σύρσιμο από τη γραμμή τίτλου· στις άκρες: μεγιστοποίηση ή μισή οθόνη
    let base, zone = null, wasSnapped = false;
    const preview = el('div', 'snapprev');
    press(title, {
      onDouble: () => w.maxBtn.onclick({ stopPropagation() {} }),
      onDragStart: ev => {
        focus(w);
        wasSnapped = w.state !== 'normal';
        const [px, py] = deskXY(ev);
        if (wasSnapped) { w.state = 'normal'; w.x = px - WIN_W / 2; w.y = Math.max(0, py - 20); layout(w); }
        base = [w.x, w.y];
      },
      onDrag: (dx, dy, ev) => {
        const [px, py] = deskXY(ev);
        w.x = Math.max(-WIN_W + 80, Math.min(DESK_W - 80, base[0] + dx));
        w.y = Math.max(0, Math.min(DESK_H - BAR - 40, base[1] + dy));
        layout(w);
        zone = py < 12 ? 'max' : px < 12 ? 'left' : px > DESK_W - 12 ? 'right' : null;
        if (zone) {
          const [x, y, ww, hh] = geom({ state: zone });
          Object.assign(preview.style, { left: x + 'px', top: y + 'px', width: ww + 'px', height: hh + 'px' });
          if (!preview.parentNode) desk.appendChild(preview);
        } else preview.remove();
      },
      onDragEnd: () => {
        preview.remove();
        if (zone) { w.state = zone; layout(w); event({ t: 'snap', zone, id: ic.id }); zone = null; }
        else event({ t: 'movewin', id: ic.id, wasSnapped });
      },
    });
    desk.appendChild(w.el);
    layout(w);
    if (ic.id === 'settings') { // ρυθμίσεις εξατομίκευσης: φόντο, φωτεινότητα, ανάλυση (μικρότερη ανάλυση → όλα μεγαλύτερα)
      w.el.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => { desk.style.background = b.dataset.bg; event({ t: 'wallpaper' }); });
      const br = w.el.querySelector('[data-br]');
      br.onpointerdown = e => e.stopPropagation();
      br.oninput = () => { desk.style.filter = `brightness(${br.value}%)`; event({ t: 'brightness', v: +br.value }); };
      w.el.querySelectorAll('[data-res]').forEach(b => b.onclick = () => { desk.querySelectorAll('.dicon').forEach(d => { d.style.transform = `scale(${b.dataset.res})`; d.style.transformOrigin = '0 0'; }); event({ t: 'res', v: +b.dataset.res }); });
    }
    event({ t: 'open', id: ic.id, kind: ic.kind, name: ic.name, from });
  }

  // ---------- γραμμή εργασιών & Έναρξη
  const bar = el('div', 'taskbar');
  desk.appendChild(bar);
  function drawBar() {
    bar.innerHTML = '';
    const st = el('button', 'startbtn', '⊞ Έναρξη');
    st.onclick = e => { e.stopPropagation(); toggleStart(); };
    bar.appendChild(st);
    const top = Object.values(wins).filter(w => !w.min).sort((a, b) => b.z - a.z)[0];
    // πρώτα οι καρφιτσωμένες εφαρμογές (ανοίγουν με ΕΝΑ κλικ), μετά όσα άλλα παράθυρα είναι ανοιχτά
    const ids = [...PINNED, ...Object.keys(wins).filter(id => !PINNED.includes(id))];
    for (const id of ids) {
      const w = wins[id];
      const ic = w ? w.ic : { id, kind: 'app', ...DESK_APPS[id] };
      const b = el('button', 'tbtn' + (w ? ' open' : '') + (w === top ? ' on' : '') + (w && w.min ? ' min' : ''), ic.em);
      b.title = ic.name;
      b.onclick = e => {
        e.stopPropagation();
        if (!w) return openWin(ic, 'bar');
        if (w.min) { w.min = false; focus(w); event({ t: 'restore', id }); }
        else if (w === top) { w.min = true; layout(w); event({ t: 'min', id }); }
        else { focus(w); event({ t: 'focus', id }); }
      };
      bar.appendChild(b);
    }
    const now = new Date();
    bar.appendChild(el('span', 'clock', now.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' })));
  }
  function toggleStart() {
    if (desk.querySelector('.startmenu')) return closeMenus();
    closeMenus();
    const m = el('div', 'startmenu', '<div class="sm-h">Όλες οι εφαρμογές</div>');
    for (const [id, a] of Object.entries(DESK_APPS)) {
      const b = el('button', '', `${a.em} ${a.name}`);
      b.onclick = () => { closeMenus(); openWin({ id, kind: 'app', ...a }, 'start'); };
      m.appendChild(b);
    }
    const off = el('button', 'off', '⏻ Τερματισμός');
    off.onclick = () => {
      closeMenus();
      if (act.boot) { powerScreen(); return event({ t: 'shutdown' }); }
      const dlg = el('div', 'dlg', '⏻ <b>Τερματισμός</b><br>Έτσι κλείνουμε σωστά τον υπολογιστή.<br><small>(Εδώ είναι μόνο εξάσκηση — δεν κλείνει τίποτα!)</small>');
      const ok = el('button', '', 'Εντάξει');
      ok.onclick = () => dlg.remove();
      dlg.appendChild(ok);
      desk.appendChild(dlg);
      event({ t: 'shutdown' });
    };
    m.appendChild(off);
    desk.appendChild(m);
    event({ t: 'start' });
  }
  // άδειο σημείο: πάτημα κλείνει τα μενού · δεξί κλικ / παρατεταμένο πάτημα → μενού επιφάνειας εργασίας
  press(desk, {
    onTap: () => { closeMenus(); desk.querySelectorAll('.dicon').forEach(o => o.classList.remove('sel')); },
    onLong: e => menuAt(e, [['📁 Νέος φάκελος', () => newFolder(e)], ['🔄 Ανανέωση', () => {}]]),
  });
  icons.forEach(drawIcon);
  drawBar();
  drawTasks();
  // Enter ανοίγει το επιλεγμένο εικονίδιο (κλικ + Enter, όπως στο βιβλίο της Α΄)
  const onKey = e => { if (!desk.isConnected) return removeEventListener('keydown', onKey); if (e.key === 'Enter' && selIcon && !desk.querySelector('.rn, .power')) openWin(selIcon); };
  addEventListener('keydown', onKey);
  // act.boot: ο υπολογιστής ξεκινά κλειστός· ο τερματισμός σβήνει την οθόνη
  function powerScreen() {
    Object.values(wins).forEach(w => w.el.remove());
    for (const k in wins) delete wins[k];
    drawBar();
    const scr = el('div', 'power', '<div>Ο υπολογιστής είναι κλειστός.</div>');
    const btn = el('button', '', '⏻');
    btn.onclick = async () => {
      btn.disabled = true;
      scr.firstChild.textContent = 'Ο υπολογιστής «ξυπνά» και ετοιμάζεται… ⏳';
      await sleep(1500);
      scr.remove();
      event({ t: 'boot' });
    };
    scr.appendChild(btn);
    desk.appendChild(scr);
  }
  if (act.boot) powerScreen();
};

// ---- Εκτέλεση αλγορίθμου βήμα-βήμα με πίνακα μεταβλητών (ΣΤ΄): πριν από κάποια βήματα μαντεύουν τη νέα τιμή
const escHTML = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
RENDER.stepper = (act, area) => {
  let si = -1;
  const vars = {};
  const code = el('div', 'algo-code'), side = el('div', 'stepside');
  const varsEl = el('div', 'vars'), note = el('div', 'note'), ask = el('div', 'ask'), btn = el('button', '', '▶ Επόμενο βήμα');
  side.append(varsEl, note, ask, btn);
  area.append(code, side);
  const drawCode = line => { code.innerHTML = act.code.map((c, i) => `<div class="cl-line${i === line ? ' cur' : ''}">${escHTML(c)}</div>`).join(''); };
  const drawVars = changed => {
    varsEl.innerHTML = '<h4>📦 Μεταβλητές</h4>' + (Object.keys(vars).length ? '' : '<div style="opacity:.7;font-size:20px">(καμία ακόμα)</div>');
    for (const [k, v] of Object.entries(vars)) varsEl.appendChild(el('div', 'var' + (changed.includes(k) ? ' ch' : ''), `<span>${k}</span><b>${v}</b>`));
  };
  function apply(st) {
    Object.assign(vars, st.vars || {});
    drawVars(Object.keys(st.vars || {}));
    if (st.after) note.innerHTML = st.after;
    if (si === act.steps.length - 1) { btn.disabled = true; complete(act.doneMsg || '🎉 Μπράβο! Εκτέλεσες τον αλγόριθμο σαν υπολογιστής!'); }
    else btn.disabled = false;
  }
  btn.onclick = () => {
    if (si >= act.steps.length - 1) return;
    const st = act.steps[++si];
    drawCode(st.line);
    note.innerHTML = st.note || '';
    ask.innerHTML = '';
    say('');
    if (!st.ask) return apply(st);
    btn.disabled = true;
    ask.appendChild(el('div', 'q', st.ask.q));
    const opts = el('div', 'opts');
    st.ask.options.forEach((o, i) => {
      const b = el('button', 'secondary', o);
      b.onclick = () => {
        if (btn.disabled === false) return;
        if (i !== st.ask.answer) { b.classList.add('wrong'); return say('Όχι ακόμα — κοίτα τις τιμές των μεταβλητών!', 'bad'); }
        b.style.background = '#2e7d32';
        say('✅ Σωστά!', 'good');
        apply(st);
      };
      opts.appendChild(b);
    });
    ask.appendChild(opts);
  };
  drawCode(-1);
  drawVars([]);
  note.textContent = 'Πατήστε «▶ Επόμενο βήμα» για να ξεκινήσει ο αλγόριθμος.';
};

// ---- Λογικές εκφράσεις: διακόπτες ΑΛΗΘΗΣ/ΨΕΥΔΗΣ → λάμπα, και πίνακας αλήθειας που γεμίζει (ΣΤ΄ έκδ. 8.02 σελ. 14–15)
RENDER.logic = (act, area) => {
  const n = act.inputs.length;
  const vals = Array(n).fill(false);
  const seen = new Set();
  const left = el('div', 'lg-in'), mid = el('div', 'lg-mid'), table = el('table', 'tt');
  const wrap = el('div', 'logic');
  wrap.append(left, mid, table);
  area.appendChild(wrap);
  const combos = [...Array(2 ** n).keys()].map(k => [...Array(n)].map((_, i) => !!(k & (1 << (n - 1 - i)))));
  const mark = b => (b ? '✅' : '❌');
  function draw() {
    const res = !!act.f(vals);
    seen.add(vals.join());
    left.innerHTML = '';
    act.inputs.forEach(([nm, em, label], i) => {
      const b = el('button', 'sw' + (vals[i] ? ' on' : ''), `<span class="em">${em}</span><span><b>${nm}:</b> ${label}</span><span class="v">${vals[i] ? 'ΑΛΗΘΗΣ' : 'ΨΕΥΔΗΣ'}</span>`);
      b.onclick = () => { vals[i] = !vals[i]; draw(); };
      left.appendChild(b);
    });
    mid.innerHTML = `<div class="ex">${act.expr}</div>${lampSVG(res, 120)}<div class="out">${act.out[0]} ${act.out[1]}<br><b>${res ? 'ΑΛΗΘΗΣ ✅' : 'ΨΕΥΔΗΣ ❌'}</b></div>`;
    table.innerHTML = `<tr>${act.inputs.map(x => `<th>${x[0]}</th>`).join('')}<th>${act.expr}</th></tr>` +
      combos.map(c => `<tr class="${c.join() === vals.join() ? 'cur' : ''}">${c.map(v => `<td>${mark(v)}</td>`).join('')}<td>${seen.has(c.join()) ? mark(act.f(c)) : '?'}</td></tr>`).join('');
    if (seen.size === combos.length) complete(act.doneMsg || '🎉 Μπράβο! Δοκίμασες όλους τους συνδυασμούς — συμπλήρωσες τον πίνακα αλήθειας!');
    else say(`Δοκίμασε όλους τους συνδυασμούς: ${seen.size} από ${combos.length}.`);
  }
  draw();
};

// ---- «Μάντεψε τον αριθμό» (ΣΤ΄ έκδ. 8.0 μαθ. 2): ο υπολογιστής διαλέγει, εμείς μαντεύουμε με όριο προσπαθειών
RENDER.guess = (act, area) => {
  const max = act.max || 10, tries = act.tries || 5;
  let secret, attempts, typed, over, hist;
  const wrap = el('div', 'guess'), pad = el('div', 'gpad'), side = el('div', 'gside');
  const disp = el('div', 'gdisp'), talk = el('div', 'gsay'), varsEl = el('div', 'vars'), histEl = el('div', 'ghist');
  side.append(disp, talk, varsEl, histEl);
  wrap.append(pad, side);
  area.appendChild(wrap);
  for (const k of ['7', '8', '9', '4', '5', '6', '1', '2', '3', '⌫', '0', 'OK']) {
    const b = el('button', k === 'OK' ? '' : 'secondary', k === 'OK' ? '✔' : k);
    b.onclick = () => pressKey(k);
    pad.appendChild(b);
  }
  function drawVars() {
    varsEl.innerHTML = `<h4>📦 Μεταβλητές</h4><div class="var"><span>προσπάθειες</span><b>${attempts}</b></div><div class="var"><span>Μυστικός_Αριθμός</span><b>${over ? secret : '?'}</b></div>`;
    histEl.textContent = hist.length ? 'Δοκίμασες: ' + hist.join(' · ') : '';
    disp.textContent = typed || '_';
  }
  function start() {
    secret = 1 + Math.floor(Math.random() * max);
    attempts = 1; typed = ''; over = false; hist = [];
    talk.innerHTML = `🤖 Διάλεξα έναν αριθμό από το 1 μέχρι το ${max}. Μάντεψέ τον! Έχεις <b>${tries}</b> προσπάθειες.`;
    drawVars();
  }
  function pressKey(k) {
    if (over) return;
    if (k === '⌫') typed = typed.slice(0, -1);
    else if (k === 'OK') return check();
    else if (typed.length < String(max).length) typed += k;
    drawVars();
  }
  function check() {
    const g = +typed;
    if (!typed || g < 1 || g > max) { talk.innerHTML = `Δώσε έναν αριθμό από το 1 μέχρι το ${max}.`; return; }
    typed = '';
    if (g === secret) {
      over = true; hist.push(g + ' ✅'); drawVars();
      talk.innerHTML = `🎉 «Μπράβο! Βρήκες τον αριθμό» σε <b>${attempts}</b> ${attempts === 1 ? 'προσπάθεια' : 'προσπάθειες'}.`;
      return finish(true);
    }
    hist.push(g + (g < secret ? ' ⬆' : ' ⬇'));
    talk.innerHTML = g < secret ? '🤖 «Ο μυστικός αριθμός είναι <b>μεγαλύτερος</b> από αυτόν που μου έδωσες»' : '🤖 «Ο μυστικός αριθμός είναι <b>μικρότερος</b> από αυτόν που μου έδωσες»';
    attempts++; // «Αύξησε τις προσπάθειες κατά 1»
    if (attempts > tries) { over = true; drawVars(); talk.innerHTML = `😢 «Έχασες! Δεν μάντεψες τον αριθμό». Ήταν το <b>${secret}</b>.`; return finish(false); }
    drawVars();
  }
  function finish(won) {
    const again = el('button', 'secondary', '🔁 Ξανά');
    again.onclick = () => { again.remove(); start(); };
    talk.appendChild(document.createElement('br'));
    talk.appendChild(again);
    if (won) complete(act.doneMsg || '🎉 Μπράβο! Ο αλγόριθμος σταμάτησε γιατί η συνθήκη έγινε αληθής.');
    else say('Η επανάληψη σταμάτησε γιατί έγινε αληθής το «προσπάθειες > ' + tries + '». Δοκίμασε ξανά!', 'bad');
  }
  start();
};

// ---- Τσαμπιά με ξυλάκια (8, 4, 2, 1) που σέρνονται στο καλάθι (RAM) για να βγει ένας αριθμός
const STICK_NAMES = { 1: 'μονάδα', 2: 'δυάδα', 4: 'τετράδα', 8: 'οκτάδα', 16: 'δεκαεξάδα' };
function sticksSVG(n) {
  const w = n * 14 + 10;
  let s = '';
  for (let i = 0; i < n; i++) s += `<rect x="${5 + i * 14}" y="4" width="9" height="86" rx="4" fill="#d7a35b" stroke="#8d5a2b" stroke-width="2"/>`;
  if (n > 1) s += `<rect x="2" y="41" width="${w - 4}" height="12" rx="5" fill="#e53935"/>`; // το λαστιχάκι του τσαμπιού
  return `<svg width="${w}" height="94" viewBox="0 0 ${w} 94">${s}</svg>`;
}
RENDER.sticks = (act, area) => {
  const vals = act.values || [8, 4, 2, 1];
  const inBasket = new Set();
  let ti = 0, locked = false;
  const wrap = el('div', 'sticks');
  const target = el('div', 'target');
  const row = el('div', 'sticks-row');
  const src = el('div', 'stick-src', '<h3>Τα ξυλάκια</h3>'), srcB = el('div', 'bundles');
  const basket = el('div', 'basket', '<h3>🧺 Καλάθι (RAM)</h3>'), inB = el('div', 'bundles');
  src.appendChild(srcB); basket.appendChild(inB);
  row.append(src, basket);
  const sumEl = el('div', 'sum'), binEl = el('div', 'binrow'), help = el('div', 'help');
  const helpBtn = el('button', 'secondary', '💡 Βοήθεια');
  const bottom = el('div', 'sticks-bottom'), helpRow = el('div', 'sticks-help');
  bottom.append(binEl, sumEl);
  helpRow.append(helpBtn, help);
  wrap.append(target, row, bottom, helpRow);
  area.appendChild(wrap);
  const total = () => vals.reduce((t, v) => t + (inBasket.has(v) ? v : 0), 0);

  // ο διάλογος του δασκάλου: από το μεγαλύτερο τσαμπί, «χωράει;»
  helpBtn.onclick = () => {
    let rest = targets()[ti];
    help.innerHTML = vals.map(v => v <= rest
      ? (rest -= v, `Χωράει η ${STICK_NAMES[v]} (${v}); <b>Ναι!</b> → μένουν ${rest}.`)
      : `Χωράει η ${STICK_NAMES[v]} (${v}); Όχι.`).join(' · ');
  };
  const targets = () => act.targets;

  function draw() {
    target.innerHTML = `Θέλω τον αριθμό: <b>${targets()[ti]}</b>`;
    srcB.innerHTML = ''; inB.innerHTML = '';
    for (const v of vals) {
      const b = el('div', 'bundle', sticksSVG(v) + `<div class="lbl"><b>${v}</b> ${STICK_NAMES[v]}</div>`);
      if (inBasket.has(v)) {
        inB.appendChild(b);
        const gap = el('div', 'bundle gone', b.innerHTML); // κρατάει τη θέση του στα αριστερά
        srcB.appendChild(gap);
      } else srcB.appendChild(b);
      drag(b, v);
    }
    const parts = vals.filter(v => inBasket.has(v));
    sumEl.textContent = parts.length ? `${parts.join(' + ')} = ${total()}` : 'Το καλάθι είναι άδειο';
    binEl.innerHTML = vals.map(v => `<div class="bc"><small>${STICK_NAMES[v]}</small><b>${inBasket.has(v) ? 1 : 0}</b></div>`).join('');
  }
  // σύρσιμο με το δάχτυλο/ποντίκι· ένα απλό πάτημα βάζει ή βγάζει το τσαμπί
  function drag(b, v) {
    b.onpointerdown = e => {
      if (locked) return;
      e.preventDefault();
      b.setPointerCapture(e.pointerId);
      const scale = $('stage').getBoundingClientRect().width / 1600;
      const sx = e.clientX, sy = e.clientY;
      let moved = false;
      b.classList.add('dragging');
      b.onpointermove = ev => {
        const dx = (ev.clientX - sx) / scale, dy = (ev.clientY - sy) / scale;
        if (Math.abs(dx) + Math.abs(dy) > 10) moved = true;
        b.style.transform = `translate(${dx}px, ${dy}px)`;
      };
      b.onpointerup = b.onpointercancel = ev => {
        b.onpointermove = b.onpointerup = b.onpointercancel = null;
        const r = basket.getBoundingClientRect();
        const over = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
        if (!moved) inBasket.has(v) ? inBasket.delete(v) : inBasket.add(v);
        else if (over) inBasket.add(v);
        else inBasket.delete(v);
        draw();
        check();
      };
    };
  }
  function check() {
    const sum = total(), t = targets()[ti];
    if (sum > t) return say('Πολλά ξυλάκια! Βγάλε κάποιο τσαμπί από το καλάθι.', 'bad');
    if (sum !== t) return say('');
    const code = vals.map(v => (inBasket.has(v) ? 1 : 0)).join('');
    const names = vals.filter(v => inBasket.has(v)).map(v => STICK_NAMES[v]).join(' και ');
    if (ti === targets().length - 1) return complete(`🎉 Μπράβο! ${names} = ${sum} → στο δυαδικό <b>${code}</b>`);
    say(`✅ Σωστά! ${names} = ${sum} → στο δυαδικό <b>${code}</b>`, 'good');
    locked = true;
    const my = runId;
    setTimeout(() => { if (my !== runId) return; ti++; inBasket.clear(); help.innerHTML = ''; locked = false; draw(); }, 2200);
  }
  draw();
};

// ---- Δύο μετρητές (δεκαδικός & δυαδικός) με +1: «μετά το 9 → 10», «μετά το 1 → 10»
RENDER.counter = (act, area) => {
  const max = act.max || 10;
  const decW = String(max).length, binW = max.toString(2).length;
  let n = 0;
  const meters = el('div', 'meters');
  const dec = el('div', 'meter', '<h4>Δεκαδικό σύστημα <small>(ψηφία 0–9)</small></h4>');
  const bin = el('div', 'meter', '<h4>Δυαδικό σύστημα <small>(ψηφία 0 και 1)</small></h4>');
  const decD = el('div', 'digits'), binD = el('div', 'digits');
  dec.appendChild(decD); bin.appendChild(binD);
  const plus = el('button', 'plus', '+1');
  const explain = el('div', 'explain', 'Ξεκινάμε από το 0. Πάτα <b>+1</b>!');
  const meterRow = el('div', 'meter-row');
  meterRow.append(dec, bin);
  meters.append(meterRow, plus, explain);
  const table = el('table', 'numtable', '<tr><th>Δεκαδικό</th><th>Δυαδικό</th></tr>');
  area.append(meters, table);

  // ψηφία με «σβησμένα» μηδενικά μπροστά, και αναλαμπή σε όσα άλλαξαν
  function show(box, str, width, prev, base) {
    const padded = str.padStart(width, '0'), old = prev == null ? padded : prev.padStart(width, '0');
    box.innerHTML = '';
    [...padded].forEach((d, i) => {
      const col = el('div', 'dcol');
      col.appendChild(el('div', 'digit' + (i < width - str.length ? ' lead' : '') + (d !== old[i] ? ' flash' : ''), d));
      col.appendChild(el('span', '', PLACE_NAMES[base ** (width - 1 - i)]));
      box.appendChild(col);
    });
  }
  function row() {
    for (const r of table.querySelectorAll('tr.new')) r.classList.remove('new');
    table.appendChild(el('tr', 'new', `<td>${n}</td><td>${n.toString(2)}</td>`));
  }
  show(decD, '0', decW, null, 10); show(binD, '0', binW, null, 2); row();
  plus.onclick = () => {
    if (n >= max) return;
    const pd = String(n), pb = n.toString(2);
    n++;
    show(decD, String(n), decW, pd, 10);
    show(binD, n.toString(2), binW, pb, 2);
    row();
    const lines = [];
    lines.push(n % 10 === 0 ? `Δεκαδικό: μετά το <b>9</b> τελείωσαν τα ψηφία! 0 μονάδες και 1 δεκάδα → <b>${n}</b>.`
                            : `Δεκαδικό: απλώς ${n - 1} + 1 = <b>${n}</b>.`);
    lines.push(n % 2 === 0 ? `Δυαδικό: μετά το <b>1</b> τελείωσαν τα ψηφία! Γράφουμε 0 και περνάμε 1 στην επόμενη θέση αριστερά → <b>${n.toString(2)}</b>.`
                           : `Δυαδικό: το 0 γίνεται 1 → <b>${n.toString(2)}</b>.`);
    explain.innerHTML = lines.join('<br>');
    if (n === max) complete('🎉 Μπράβο! Μέτρησες ως το ' + max + ' και στα δύο συστήματα!');
  };
};

// ---- Λάμπες με αξίες θέσεων 16 8 4 2 1: ανάβουν για να φτιάξουν έναν αριθμό
RENDER.bits = (act, area) => {
  const n = act.bits || 5;
  const vals = [...Array(n)].map((_, i) => 2 ** (n - 1 - i));
  const on = Array(n).fill(false);
  const targets = act.targets || [];
  let ti = 0, locked = false;
  const wrap = el('div', 'bits');
  const target = el('div', 'target');
  const lamps = el('div', 'lamps');
  const binEl = el('div', 'bin'), sumEl = el('div', 'sum');
  wrap.append(target, lamps, binEl, sumEl);
  area.appendChild(wrap);
  const size = n === 1 ? 200 : 120;
  function draw() {
    target.innerHTML = targets.length ? `Φτιάξε τον αριθμό: <b>${targets[ti]}</b>` : '';
    lamps.innerHTML = '';
    vals.forEach((v, i) => {
      const b = el('button', 'lamp', (act.values === false ? '' : `<span class="val">${v}</span><small>${PLACE_NAMES[v]}</small>`) + lampSVG(on[i], size) + `<span class="bit">${on[i] ? 1 : 0}</span>`);
      b.onclick = () => { if (locked) return; on[i] = !on[i]; draw(); check(); };
      lamps.appendChild(b);
    });
    const sum = vals.reduce((t, v, i) => t + (on[i] ? v : 0), 0);
    if (act.values === false) {
      binEl.textContent = '';
      sumEl.textContent = on[0] ? '💡 Περνάει ρεύμα → 1' : '⚫ Δεν περνάει ρεύμα → 0';
    } else {
      binEl.textContent = on.map(x => (x ? 1 : 0)).join('');
      const parts = vals.filter((_, i) => on[i]);
      sumEl.textContent = parts.length ? `${parts.join(' + ')} = ${sum}` : '0';
    }
    return sum;
  }
  function check() {
    if (act.free) return complete('👍 Μπράβο! Τώρα ξέρεις τι σημαίνει 1 και τι 0.');
    const sum = vals.reduce((t, v, i) => t + (on[i] ? v : 0), 0);
    if (sum !== targets[ti]) return say(sum > targets[ti] ? 'Πέρασες τον αριθμό! Σβήσε κάποια λάμπα.' : '', sum > targets[ti] ? 'bad' : '');
    if (ti === targets.length - 1) return complete(`🎉 Μπράβο! Το ${sum} στο δυαδικό είναι ${sum.toString(2)}!`);
    say(`✅ Σωστά! Το ${sum} στο δυαδικό είναι <b>${sum.toString(2)}</b>.`, 'good');
    locked = true;
    const my = runId;
    setTimeout(() => { if (my !== runId) return; ti++; on.fill(false); locked = false; draw(); }, 1600);
  }
  draw();
};

// ---- Ψηφιακή εικόνα: rows = γραμμές με κωδικούς, palette = [[κωδικός, χρώμα, όνομα]]
// decode: διαβάζω τον κώδικα και χρωματίζω · encode: βλέπω την εικόνα και γράφω τον κώδικα (πατήματα αλλάζουν τον κωδικό)
RENDER.pixels = (act, area) => {
  const pal = act.palette, w = pal[0][0].length;
  const cells = act.rows.map(r => r.replace(/\s/g, '').match(new RegExp(`.{${w}}`, 'g')));
  const R = cells.length, C = cells[0].length;
  const color = Object.fromEntries(pal.map(([c, col]) => [c, col]));
  const dark = col => parseInt(col.slice(1, 3), 16) * 0.3 + parseInt(col.slice(3, 5), 16) * 0.59 + parseInt(col.slice(5, 7), 16) * 0.11 < 130;
  const cs = Math.floor(Math.min(620 / C, 600 / R, 64));
  const mk = () => { const g = el('div', 'pix'); g.style.gridTemplateColumns = `repeat(${C}, ${cs}px)`; g.style.gridAutoRows = cs + 'px'; return g; };
  const encode = act.mode === 'encode', rle = !!act.rle;
  const start = pal.length === 2 ? pal[0][0] : null; // ασπρόμαυρη: όλα ξεκινούν «άσπρα» (0)
  const state = cells.map(r => r.map(() => start));
  const grid = mk(), side = el('div', 'pixside');
  let cur = pal[pal.length - 1][0];
  const paintEl = (d, code, shown) => {
    d.style.background = encode ? '#fff' : code ? color[code] : '#cfd8dc';
    d.classList.toggle('dark', !encode && !!code && dark(color[code]));
    d.textContent = shown;
  };
  const cellEls = cells.map((r, y) => r.map((code, x) => {
    const d = el('div');
    d.dataset.xy = x + ',' + y;
    paintEl(d, state[y][x], encode ? state[y][x] || '' : (rle ? '' : code));
    grid.appendChild(d);
    return d;
  }));
  const set = (x, y, code) => { state[y][x] = code; cellEls[y][x].classList.remove('wrong'); paintEl(cellEls[y][x], code, encode ? code || '' : (rle ? '' : cells[y][x])); };
  if (encode) {
    const pic = mk();
    cells.forEach(r => r.forEach(code => { const d = el('div'); d.style.background = color[code]; pic.appendChild(d); }));
    area.appendChild(pic);
    grid.onclick = e => {
      const xy = e.target.dataset.xy;
      if (!xy || done.has(key(chapterIdx, lessonIdx, actIdx))) return;
      const [x, y] = xy.split(',').map(Number);
      const i = pal.findIndex(([c]) => c === state[y][x]);
      set(x, y, pal[(i + 1) % pal.length][0]);
    };
  } else {
    // ζωγραφίζω με κλικ ή σύροντας το δάχτυλο/ποντίκι
    let down = false;
    const paintAt = (cx, cy) => {
      const d = document.elementFromPoint(cx, cy);
      if (!d || !d.dataset.xy || d.parentNode !== grid) return;
      const [x, y] = d.dataset.xy.split(',').map(Number);
      if (state[y][x] !== cur) set(x, y, cur);
    };
    grid.onpointerdown = e => { if (done.has(key(chapterIdx, lessonIdx, actIdx))) return; down = true; paintAt(e.clientX, e.clientY); };
    grid.onpointermove = e => { if (down) paintAt(e.clientX, e.clientY); };
    grid.onpointerup = grid.onpointerleave = grid.onpointercancel = () => { down = false; };
    const p = el('div', 'pal');
    pal.forEach(([c, col, name]) => {
      const b = el('button', c === cur ? 'on' : '', rle ? name : `${c} <small>${name}</small>`);
      b.style.background = col; b.style.color = dark(col) ? '#fff' : '#263238';
      b.onclick = () => { cur = c; p.querySelectorAll('button').forEach(o => o.classList.toggle('on', o === b)); };
      p.appendChild(b);
    });
    side.appendChild(el('div', '', 'Διάλεξε χρώμα:'));
    side.appendChild(p);
  }
  const bits = Math.log2(pal.length);
  const B = R * C * bits / 8;
  if (!rle) side.appendChild(el('div', '', `📐 ${R} γραμμές × ${C} στήλες = <b>${R * C}</b> εικονοστοιχεία<br>🎨 ${pal.length} χρώματα → <b>${bits} bit</b> για κάθε εικονοστοιχείο<br>💾 ${R * C} × ${bits} = <b>${R * C * bits} bit</b> ${Number.isInteger(B) ? '=' : '≈'} <b>${Math.ceil(B)} Byte</b>`));
  const btn = el('button', '', '✔ Έλεγχος');
  btn.onclick = () => {
    let bad = 0;
    cells.forEach((r, y) => r.forEach((code, x) => { const wrong = state[y][x] !== code; cellEls[y][x].classList.toggle('wrong', wrong); bad += wrong; }));
    if (!bad) complete(act.doneMsg || (encode ? '🎉 Μπράβο! Κωδικοποίησες την εικόνα σαν υπολογιστής!' : `🎉 Μπράβο! Εμφανίστηκε η εικόνα${act.reveal ? ': ' + act.reveal : ''}!`));
    else say(`Σχεδόν! ${bad} εικονοστοιχεία δεν ταιριάζουν — τα βλέπεις με κόκκινο πλαίσιο.`, 'bad');
  };
  side.appendChild(btn);
  if (rle) { // κάθε γραμμή: πόσα συνεχόμενα εικονοστοιχεία έχουν το ίδιο χρώμα
    const lab = el('div', 'rle');
    cells.forEach(r => {
      const runs = [];
      r.forEach(c => (runs.length && runs.at(-1)[0] === c ? runs.at(-1)[1]++ : runs.push([c, 1])));
      const row = el('div', '', runs.map(([c, n]) => `<span>${n}<i style="background:${color[c]}"></i></span>`).join(''));
      row.style.height = cs + 'px';
      lab.appendChild(row);
    });
    const wrapG = el('div', 'rlewrap');
    wrapG.append(lab, grid);
    return area.append(wrapG, side);
  }
  area.append(grid, side);
};

// ---- Γράμματα σε δυαδικό: gr5 = Α 00001 … Ω 11000 (Δ΄ έκδ. 6.0 σελ. 46) · ascii = A 01000001 …
const CODE_TABLES = {
  gr5: [...GR].map((c, i) => [c, (i + 1).toString(2).padStart(5, '0')]),
  ascii: [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map((c, i) => [c, (65 + i).toString(2).padStart(8, '0')]),
};
// decode: διαβάζω τους κωδικούς και πατάω τα γράμματα · encode: γράφω τον κωδικό κάθε γράμματος με διακόπτες 0/1
RENDER.binword = (act, area) => {
  const table = CODE_TABLES[act.table || 'gr5'], code = Object.fromEntries(table), n = table[0][1].length;
  const letters = [...act.word], enc = act.mode === 'encode';
  let i = 0;
  const box = el('div', 'bw'), word = el('div', 'bwword');
  box.appendChild(word);
  const drawWord = () => {
    word.innerHTML = '';
    letters.forEach((ch, k) => word.appendChild(el('span', k === i ? 'cur' : '', enc ? `<b>${ch}</b>${k < i ? code[ch] : '?'.repeat(n)}` : `${code[ch]}<b>${k < i ? ch : ''}</b>`)));
  };
  const finish = () => complete(enc ? `🎉 Μπράβο! Η λέξη ${act.word} έγινε ${letters.length * n} bit!` : `🎉 Μπράβο! Η λέξη είναι: ${act.word}`);
  const grid = el('div', 'bwtable');
  grid.style.gridTemplateColumns = `repeat(${n > 5 ? 7 : 8}, auto)`;
  table.forEach(([ch, c]) => {
    const b = el('button', '', `${ch}<small>${c}</small>`);
    if (!enc) b.onclick = () => {
      if (i >= letters.length) return;
      if (ch !== letters[i]) return say(`Όχι. Ψάξε στον πίνακα τον κωδικό <b>${code[letters[i]]}</b>.`, 'bad');
      b.classList.add('hit');
      i++; drawWord();
      if (i === letters.length) finish(); else say('✅ Σωστά!', 'good');
    };
    grid.appendChild(b);
  });
  if (enc) {
    const on = Array(n).fill(0), bits = el('div', 'bwbits'), ok = el('button', '', '✔ Έλεγχος');
    const drawBits = () => { bits.innerHTML = ''; on.forEach((v, k) => { const b = el('button', v ? '' : 'secondary', v); b.onclick = () => { on[k] ^= 1; drawBits(); }; bits.appendChild(b); }); };
    ok.onclick = () => {
      if (i >= letters.length) return;
      if (on.join('') !== code[letters[i]]) return say(`Όχι ακόμα. Βρες το «${letters[i]}» στον πίνακα και αντέγραψε τον κωδικό του.`, 'bad');
      i++; on.fill(0); drawWord(); drawBits();
      if (i === letters.length) finish(); else say('✅ Σωστά!', 'good');
    };
    drawBits();
    const row = el('div', 'controls'); row.append(bits, ok);
    box.append(row);
    if (act.hideTable) grid.style.display = 'none';
  }
  box.appendChild(grid);
  drawWord();
  area.appendChild(box);
};

// ---- Ισχυρό συνθηματικό: κανόνες που ελέγχονται καθώς γράφουμε (μόνο τοπικά, τίποτα δεν αποθηκεύεται)
const PW_WEAK = ['123', 'abc', 'qwerty', 'password', 'kodikos', 'κωδικος', '000', '111'];
RENDER.password = (act, area) => {
  const avoid = [...PW_WEAK, ...(act.avoid || [])];
  const rules = [
    ['Τουλάχιστον 8 χαρακτήρες', p => p.length >= 8],
    ['Πεζά γράμματα (α, b…)', p => /\p{Ll}/u.test(p)],
    ['Κεφαλαία γράμματα (Α, B…)', p => /\p{Lu}/u.test(p)],
    ['Αριθμοί (0–9)', p => /\d/.test(p)],
    ['Σύμβολα (! @ # …)', p => /[^\p{L}\d\s]/u.test(p)],
    ['Χωρίς όνομα ή εύκολες σειρές (123, abc…)', p => p && !avoid.some(w => norm(p).includes(norm(w)))],
  ];
  const box = el('div', 'pw');
  const inp = el('input');
  inp.placeholder = 'Γράψε ένα συνθηματικό για εξάσκηση…';
  inp.autocomplete = 'off'; inp.spellcheck = false;
  const meter = el('div', 'meter', '<div></div>'), list = el('ul'), time = el('div');
  box.append(el('div', '', '⚠️ Μόνο για εξάσκηση: <b>μη γράψεις</b> τον πραγματικό σου κωδικό!'), inp, meter, list, time);
  area.appendChild(box);
  const crackTime = p => { // εκτίμηση: ένας υπολογιστής δοκιμάζει 10 δισεκατομμύρια συνδυασμούς το δευτερόλεπτο
    const pool = (/\p{Ll}/u.test(p) ? 26 : 0) + (/\p{Lu}/u.test(p) ? 26 : 0) + (/\d/.test(p) ? 10 : 0) + (/[^\p{L}\d\s]/u.test(p) ? 30 : 0);
    const s = pool ** p.length / 1e10;
    return s < 1 ? 'αμέσως! 😱' : s < 3600 ? `${Math.ceil(s / 60)} λεπτά` : s < 86400 * 365 ? `${Math.ceil(s / 86400)} μέρες` : s < 1e6 * 86400 * 365 ? `${Math.round(s / 86400 / 365).toLocaleString('el-GR')} χρόνια` : 'εκατομμύρια χρόνια 💪';
  };
  const upd = () => {
    const p = inp.value, ok = rules.map(([, f]) => f(p)), n = ok.filter(Boolean).length;
    list.innerHTML = '';
    rules.forEach(([t], i) => list.appendChild(el('li', ok[i] ? 'ok' : '', (ok[i] ? '✅ ' : '⬜ ') + t)));
    Object.assign(meter.firstChild.style, { width: (n / rules.length * 100) + '%', background: n < 3 ? '#e53935' : n < 6 ? '#fb8c00' : '#43a047' });
    time.innerHTML = p ? `⏱️ Ένας γρήγορος υπολογιστής θα το μάντευε σε: <b>${ok[5] ? crackTime(p) : 'αμέσως! 😱'}</b>` : '';
    if (n === rules.length) complete('🎉 Ισχυρό συνθηματικό! Πολύ δύσκολο για τους άλλους — θυμήσου όμως να το θυμάσαι εσύ!');
  };
  inp.oninput = upd;
  inp.onkeydown = e => e.stopPropagation();
  upd();
  inp.focus();
};

// ---- Βραχιόλι γενεθλίων: μέρα/μήνας σε δυαδικό, με χάντρες (0, 1 και διαχωριστικό)
RENDER.bracelet = (act, area) => {
  const BEAD = { 0: '#fafafa', 1: '#1e88e5', '/': '#e53935' };
  let day = 12, month = 7;
  const wrap = el('div', 'bracelet');
  const steppers = el('div', 'steppers');
  const conv = el('div', 'conv'), beads = el('div', 'beads');
  const legend = el('div', 'legend', Object.entries({ 0: '= 0', 1: '= 1', '/': '= ανάμεσα σε μέρα και μήνα' })
    .map(([k, t]) => `<span><span class="bead" style="background:${BEAD[k]}"></span>${t}</span>`).join(''));
  wrap.append(steppers, conv, beads, legend);

// ---- «Βρες ποιος είναι»: κάρτες με χαρακτηριστικά. Γύρος { clue, answer } = πάτα την κάρτα · { card, clue, tf } = αλήθεια ή ψέμα;
RENDER.whois = (act, area) => {
  let ri = 0, busy = false;
  const wrap = el('div', 'whois'), clue = el('div', 'clue'), grid = el('div', 'wcards'), ctr = el('div', 'controls');
  wrap.append(clue, grid, ctr);
  area.appendChild(wrap);
  const cards = act.cards.map(([em, name, traits], i) => {
    const c = el('button', 'wcard', `<div class="wem">${em}</div><div class="wname">${name}</div>` + traits.map(t => `<div class="wt">${t}</div>`).join(''));
    c.onclick = () => pick(i);
    grid.appendChild(c);
    return c;
  });
  function show() {
    busy = false;
    const r = act.rounds[ri];
    cards.forEach(c => c.classList.remove('sel', 'no', 'ok'));
    clue.innerHTML = `<span class="count">${ri + 1} / ${act.rounds.length}</span> ` + (r.tf !== undefined ? `<b>${act.cards[r.card][1]}:</b> «${r.clue}»` : `🔎 ${r.clue}`);
    ctr.innerHTML = '';

      const b = el('button', '', label);
      b.onclick = () => { if (busy) return; if (v !== r.tf) return say(r.why || 'Κοίτα ξανά την κάρτα!', 'bad'); next(r); };
      ctr.appendChild(b);
    }
  }
  function pick(i) {
    const r = act.rounds[ri];
    if (busy || r.tf !== undefined) return;
    if (i !== r.answer) { cards[i].classList.add('no'); return say('Δεν ταιριάζει — ξαναδιάβασε την περιγραφή!', 'bad'); }
    cards[i].classList.add('ok');
    next(r);
  }
  function next(r) {
    busy = true;
    if (++ri >= act.rounds.length) return complete(act.doneMsg || '🎉 Μπράβο! Τα βρήκες όλα!');
    say('✅ Σωστά! ' + (r.why && r.tf !== undefined ? '' : r.why || ''), 'good');
    setTimeout(() => { if (busy) show(); }, 1100);
  }
  show();
};

// ---- Ο υπολογιστής εφαρμόζει τους κανόνες: ο ήρωας μαζεύει φρούτα, αποφεύγει τα φαντασματάκια
RENDER.rulesgame = (act, area) => {
  const g = { cols: 7, rows: 5, start: [0, 2], actor: '🟡', ...act.grid };
  const grid = buildGrid({ ...g, decor: [...g.fruits, ...g.ghosts.map(([x, y]) => [x, y, '👻'])] }, 760, 520);
  const ghosts = new Set(g.ghosts.map(([x, y]) => x + ',' + y));
  let x, y, score, lives, fruits, busy = false;
  const side = el('div', 'side'), stats = el('div', 'rg-stats');
  const rules = [el('div', 'rule', '🍓 <b>Αν</b> ο ήρωας άγγιξε <b>φρούτο</b>, <b>τότε</b> πρόσθεσε 1 πόντο.'),
    el('div', 'rule', '👻 <b>Αν</b> ο ήρωας άγγιξε <b>φαντασματάκι</b>, <b>τότε</b> αφαίρεσε 1 ζωή.')];
  const pad = el('div', 'palette');
  for (const d of ['U', 'D', 'L', 'R']) { const b = el('button', '', `<span class="g">${GLYPH[d]}</span>`); b.onclick = () => move(d); pad.appendChild(b); }
  side.append(stats, ...rules, pad);
  area.append(grid.el, side);
  const my = runId;
  const onKey = e => {
    if (my !== runId) return removeEventListener('keydown', onKey);
    const d = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R' }[e.key];
    if (d) { e.preventDefault(); move(d); }
  };
  addEventListener('keydown', onKey);
  function reset() {
    [x, y] = g.start; score = 0; lives = 3;
    fruits = new Set(g.fruits.map(([a, b]) => a + ',' + b));
    for (const [a, b, em] of g.fruits) grid.cells[a + ',' + b].innerHTML = itemHTML(em, grid.cs);
    grid.put({ x, y, h: 0 }); draw();
  }
  const draw = () => { stats.innerHTML = `⭐ Πόντοι: <b>${score}</b> &nbsp; ${'❤️'.repeat(lives)}${'🤍'.repeat(3 - lives)}`; };
  async function move(d) {
    if (busy) return;
    const nx = x + MOVES[d][0], ny = y + MOVES[d][1];
    if (nx < 0 || ny < 0 || nx >= g.cols || ny >= g.rows) return say('Εκεί είναι ο τοίχος του παιχνιδιού.', 'bad');
    x = nx; y = ny;
    grid.put({ x, y, h: 0 });
    const k = x + ',' + y, fruit = fruits.has(k), ghost = ghosts.has(k);
    rules[0].classList.toggle('hit', fruit); rules[1].classList.toggle('hit', ghost);
    if (fruit) { fruits.delete(k); grid.cells[k].innerHTML = ''; score++; }
    if (ghost) lives--;
    draw();
    say(`Ο υπολογιστής ελέγχει: Άγγιξε φρούτο; <b>${fruit ? 'ΝΑΙ → +1 πόντος' : 'ΟΧΙ'}</b> · Άγγιξε φαντασματάκι; <b>${ghost ? 'ΝΑΙ → −1 ζωή' : 'ΟΧΙ'}</b> → Συνέχισε το παιχνίδι`, fruit ? 'good' : ghost ? 'bad' : '');
    if (!fruits.size) return complete(act.doneMsg || `🎉 Τα μάζεψες όλα με ${lives} ${lives === 1 ? 'ζωή' : 'ζωές'}! Ο υπολογιστής εφάρμοσε τους κανόνες σε κάθε σου κίνηση.`);
    if (ghost) {
      busy = true;
      grid.crash();
      await sleep(600);
      busy = false;
      if (my !== runId) return;
      if (!lives) { say('Τέλος οι ζωές! Ξεκινάμε από την αρχή.', 'bad'); return reset(); }
      [x, y] = g.start; grid.put({ x, y, h: 0 });
    }
  }
  reset();
};

// ---- Ρομπότ εδάφους με αισθητήρα εμποδίων: πατάς ένα τετράγωνο για να βάλεις «χέρι» μπροστά του
function edisonSVG(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><rect x="14" y="8" width="72" height="84" rx="14" fill="#eceff1" stroke="#37474f" stroke-width="5"/>
    <rect x="2" y="24" width="12" height="30" rx="4" fill="#37474f"/><rect x="86" y="24" width="12" height="30" rx="4" fill="#37474f"/>
    <circle cx="36" cy="22" r="6" fill="#e53935"/><circle cx="64" cy="22" r="6" fill="#e53935"/><path d="M50 40 L66 66 L34 66 Z" fill="#ff9800"/></svg>`;
}
RENDER.edison = (act, area) => {
  const g = { cols: 7, rows: 4, start: [0, 1], heading: 1, svg: edisonSVG, ...act.grid };
  const grid = buildGrid(g, 760, 500);
  const hands = new Set();
  let x, y, h, rot, running = false, avoided = 0;
  for (const [k, c] of Object.entries(grid.cells)) {
    c.classList.add('tap');
    c.onclick = () => {
      if (k === x + ',' + y) return;
      if (hands.has(k)) { hands.delete(k); c.innerHTML = ''; } else { hands.add(k); c.innerHTML = itemHTML('✋', grid.cs); }
    };
  }
  const side = el('div', 'side');
  side.appendChild(el('div', '', act.program));
  const ctr = el('div', 'controls'), go = el('button', '', '▶ Εκτέλεση'), stop = el('button', 'secondary', '⏹ Σταμάτα');
  ctr.append(go, stop);
  side.appendChild(ctr);
  area.append(grid.el, side);
  const place = () => { [x, y] = g.start; h = g.heading; rot = h * 90; grid.put({ x, y, rotation: rot }); };
  const ahead = (d = h) => [x + HEAD[d][0], y + HEAD[d][1]];
  const blocked = ([a, b]) => a < 0 || b < 0 || a >= g.cols || b >= g.rows || hands.has(a + ',' + b);
  stop.onclick = () => { running = false; };
  go.onclick = async () => {
    if (running) return;
    const my = runId;
    running = true; place(); say('');
    while (running && my === runId) {
      await sleep(450);
      if (!running || my !== runId) break;
      const [ax, ay] = ahead();
      if (!blocked([ax, ay])) { x = ax; y = ay; grid.put({ x, y, rotation: rot }); continue; }
      const hand = hands.has(ax + ',' + ay);
      if (act.mode === 'stop') {
        running = false;
        if (hand) complete('🎉 Ο αισθητήρας «είδε» το χέρι και το ρομπότ σταμάτησε!');
        else say('Σταμάτησε μπροστά στον τοίχο! Τώρα βάλε ένα ✋ στον δρόμο του και ξαναδοκίμασε.', 'good');
        break;
      }
      // αποφυγή: πίσω 1, στρίψε δεξιά, συνέχισε
      const [bx, by] = ahead((h + 2) % 4);
      if (!blocked([bx, by])) { x = bx; y = by; grid.put({ x, y, rotation: rot }); await sleep(350); }
      h = (h + 1) % 4; rot += 90; grid.put({ x, y, rotation: rot });
      if (hand && ++avoided === 3) complete('🎉 Το ρομπότ απέφυγε 3 εμπόδια! Η επιλογή μέσα στην επανάληψη το κάνει να «αποφασίζει» μόνο του.');
      else if (hand) say(`Απέφυγε εμπόδιο: ${avoided} / 3`, 'good');
    }
    running = false;
  };
  place();
};

// ---- Εξαγωγή για το Scratch 3: αρχείο .sb3 (zip με project.json, εικόνες SVG και ήχους WAV)
const CRC_T = [...Array(256)].map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });

  const enc = new TextEncoder(), parts = [], dir = [];

    const n = enc.encode(name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x800, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, n.length, true);
    parts.push(new Uint8Array(h.buffer), n, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x800, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, n.length, true); c.setUint32(42, off, true);
    dir.push(new Uint8Array(c.buffer), n);
    off += 30 + n.length + data.length;
  }
  const size = dir.reduce((s, d) => s + d.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...dir, new Uint8Array(e.buffer)], { type });
}

  const svgCostume = (name, svg, cx, cy) => { const a = asset(enc.encode(svg), 'svg', svg); return { name, dataFormat: 'svg', assetId: a, md5ext: a + '.svg', rotationCenterX: cx, rotationCenterY: cy }; };
  const emojiCostume = (name, em) => svgCostume(name, `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><text x="32" y="52" font-size="50" text-anchor="middle">${em}</text></svg>`, 32, 32);
  const color = css => (String(css || '').match(/#[0-9a-f]{6}|#[0-9a-f]{3}\b/i) || ['#ffffff'])[0];
  const backdrop = (name, css, text = '') => svgCostume(name, `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360"><rect width="480" height="360" fill="${color(css)}"/>` +
    (text ? `<text x="240" y="195" font-size="52" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="#fff">${xml(text)}</text>` : '') + '</svg>', 240, 180);
  // σύντομο «μπιπ» ως ήχος για κάθε «παίξε ήχο»
  const beep = name => {
    const rate = 22050, len = 5500, buf = new DataView(new ArrayBuffer(44 + len * 2));
    [[0, 'RIFF'], [8, 'WAVE'], [12, 'fmt '], [36, 'data']].forEach(([o, t]) => [...t].forEach((ch, i) => buf.setUint8(o + i, ch.charCodeAt(0))));

        case 'changevar': st.vars[raw(b[1])] += +val(b[2]); break;
        case 'pointto': { const t = raw(b[1]) === 'mouse' ? st.mouse : st.sp[raw(b[1])]; s.dir = Math.atan2(t.x - s.x, t.y - s.y) * 180 / Math.PI; break; }
        case 'hide': s.hidden = true; break;
        case 'show': s.hidden = false; break;
        case 'gotorandom': s.x = Math.round(Math.random() * 400 - 200); s.y = Math.round(Math.random() * 280 - 140); break;
        case 'glide': {
          const t = st.sp[raw(b[2])], x0 = s.x, y0 = s.y, tx = t.x, ty = t.y, n = Math.max(1, Math.round(val(b[1]) * 20));
          const e2 = els[id];
          e2.style.transition = 'none';
          for (let i = 1; i <= n && my === gen && runIdAt === runId; i++) { s.x = x0 + (tx - x0) * i / n; s.y = y0 + (ty - y0) * i / n; draw(id); await sleep(50); }
          e2.style.transition = '';
          break;
        }
        case 'stopall': st.log.push('stopall'); gen++; break;
        case 'backdrop': {
          const bd = (act.backdrops || {})[raw(b[1])] || {};
          stage.style.background = bd.bg || act.backdrop || '#fff';
          bdText.textContent = bd.text || '';
          st.log.push('backdrop:' + raw(b[1]));
          break;
        }
        case 'broadcast': st.log.push('broadcast:' + raw(b[1])); fire('receive:' + raw(b[1])); break;
        case 'call': {
          st.log.push('call:' + b[1]);
          const def = act.scripts.find(x => x.when === 'define:' + b[1]);
          (def.params || []).forEach((p, i) => { st.vars[p] = num(val(b[i + 2])); });
          e.classList.remove('run');
          await run(def.blocks, id, my);
          break;
        }
        case 'ask': st.answer = await askBox(String(val(b[1])), s); break;
        case 'wait': await sleep(val(b[1]) * 1000); break;
      }
      if (s.pen && (s.x !== px || s.y !== py)) {
        pen.beginPath(); pen.moveTo((px + 240) * K, (180 - py) * K); pen.lineTo((s.x + 240) * K, (180 - s.y) * K); pen.stroke(); st.lines++;
      }
      draw(id);
      if (touching(id, 'edge') && !st.log.includes('edge:' + id)) st.log.push('edge:' + id);
      check();
      await sleep(b[0] === 'say' && b[2] ? Math.min(2, val(b[2])) * 1000 : b[0] === 'sound' ? 900 : act.fast ? 40 : 160);
      if ((b[0] === 'say' && b[2]) || b[0] === 'sound') { s.said = ''; draw(id); }
      e.classList.remove('run');
      if (b[0] === 'if') {
        const ok = cond(b[1], id);
        st.log.push('if:' + condKey(b[1]) + ':' + ok); // π.χ. if:touching:edge:true · if:eq:answer:ΑΘΗΝΑ:false
        check();
        await run(ok ? b[2] : b[3] || [], id, my);
      }
      const alive = () => my === gen && runIdAt === runId;
      if (b[0] === 'repeat') for (let i = 0; i < +val(b[1]) && alive(); i++) await run(b[2], id, my);
      if (b[0] === 'until') {
        while (alive() && !cond(b[1], id)) { await run(b[2], id, my); if (!b[2].length) await sleep(100); }
        if (alive()) { st.log.push('until:' + condKey(b[1])); check(); }
      }
      if (b[0] === 'forever') while (alive()) { await run(b[1], id, my); await sleep(30); }
    }
  }
  let runIdAt = runId;
  function askBox(q, s) {
    s.said = q; draw(Object.keys(st.sp).find(k => st.sp[k] === s));
    return new Promise(res => {
      const box = el('div', 'askbox'), inp = el('input'), ok = el('button', '', '✔');
      inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') ok.onclick(); };
      ok.onclick = () => { box.remove(); s.said = ''; res(inp.value.trim()); };
      box.append(inp, ok);
      stage.appendChild(box);
      inp.focus();
    });
  }
  async function fire(when, only) {
    if (runIdAt !== runId) return;
    st.log.push(when);
    const my = gen;
    st.running++;
    await Promise.all(act.scripts.filter(s => s.when === when && (!only || s.sprite === only)).map(s => run(s.blocks, s.sprite, my)));
    st.running--;
    check();
  }
  stopB.onclick = () => { gen++; st.running = 0; stage.querySelector('.askbox')?.remove(); document.querySelectorAll('.sb.run').forEach(e => e.classList.remove('run')); };
  resetB.onclick = () => { stopB.onclick(); resetAll(); };
  const onKey = e => {
    if (runIdAt !== runId) return removeEventListener('keydown', onKey);
    if (WHEN_KEY[e.key] && used.has(WHEN_KEY[e.key])) { e.preventDefault(); fire(WHEN_KEY[e.key]); }
  };
  addEventListener('keydown', onKey);
  resetAll();
};

// ============================================================================
// ΠΛΟΗΓΗΣΗ & ΣΚΗΝΗ
// ============================================================================
$('homeBtn').onclick = () => { runId++; renderHome(); showScreen('homeScreen'); };
$('prevBtn').onclick = () => { if (actIdx > 0) { actIdx--; renderAct(); } };
$('nextBtn').onclick = () => {
  const les = book()[chapterIdx].lessons[lessonIdx];
  if (actIdx < les.acts.length) { actIdx++; renderAct(); } // μετά την τελευταία: οθόνη «Τέλος μαθήματος»
  else { runId++; renderHome(); showScreen('homeScreen'); }
};

function fitStage() { $('stage').style.setProperty('--s', Math.min(innerWidth / 1600, innerHeight / 900)); }
addEventListener('resize', fitStage);
// χωρίς κύλιση/ζουμ της σελίδας — εκτός από τον χώρο σεναρίων του Scratch, που κυλάει μόνος του
addEventListener('wheel', e => { if (!e.target.closest?.('.scripts')) e.preventDefault(); }, { passive: false });
addEventListener('touchmove', e => { if (!e.target.closest?.('.scripts')) e.preventDefault(); }, { passive: false });
addEventListener('gesturestart', e => e.preventDefault());
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });

// έλεγχος δεδομένων: κάθε άσκηση του βιβλίου πρέπει να λύνεται
for (const ch of BOOKS.flatMap(b => b.chapters)) for (const les of ch.lessons) for (const a of les.acts) {
  if (a.type === 'order') console.assert(firstMistake(orderRules(a), a.steps.map((_, i) => i)) === null, 'σειρά: ' + a.title);
  if (a.type === 'pick') console.assert(a.options.some(o => expand(o).join() === expand(a.path).join()), 'pick: ' + a.text);
  if (a.type === 'trace') console.assert(!simulate(a.grid, a.program).crash, 'trace: ' + a.text);
  if (a.type === 'sticks') console.assert(a.targets.every(t => t > 0 && t < 16), 'sticks: ' + a.text);
  if (a.type === 'pixels') { const r = a.rows.map(x => x.replace(/\s/g, '')); console.assert(r.every(x => x.length === r[0].length && x.length % a.palette[0][0].length === 0 && x.match(new RegExp(`.{${a.palette[0][0].length}}`, 'g')).every(c => a.palette.some(([p]) => p === c))), 'pixels: ' + a.text); }
  if (a.type === 'binword') console.assert([...a.word].every(c => CODE_TABLES[a.table || 'gr5'].some(([l]) => l === c)), 'binword: ' + a.word);
  if (a.type === 'net' && a.mode === 'path') console.assert([a.from, a.to, ...a.edges.flat()].every(n => a.nodes.some(([m]) => m === n)), 'net path: ' + a.text);
  else if (a.type === 'net') console.assert(a.links.flat().every(n => a.nodes.some(([m]) => m === n)), 'net: ' + a.text);
  if (a.type === 'bits') console.assert((a.targets || []).every(t => t < 2 ** a.bits), 'bits: ' + a.text);
}

renderHome();
fitStage();
</script>
</body>
