RENDER.desktop = (act, area) => {
  const tasks = DESK_TASKS[act.tasks || 'basic'];
  let ti = 0, z = 10, nextNew = 1;
  const desk = el('div', 'desk'), side = el('div', 'tasks');
  area.append(desk, side);
  const icons = [
    { id: 'paint', kind: 'app', ...DESK_APPS.paint }, { id: 'folder', kind: 'folder', em: '📁', name: 'Οι εργασίες μου', body: '📄 Ιστορία &nbsp; 🖼️ Ζωγραφιά &nbsp; 🎵 Τραγούδι' },
    { id: 'file', kind: 'file', em: '📄', name: 'Ιστορία', body: 'Μια φορά κι έναν καιρό…' }, { id: 'calc', kind: 'app', ...DESK_APPS.calc },
  ];
  icons.forEach((ic, i) => { ic.x = 16; ic.y = 10 + i * 122; });
  const wins = {};
  const deskXY = ev => { const r = desk.getBoundingClientRect(), sc = r.width / DESK_W; return [(ev.clientX - r.left) / sc, (ev.clientY - r.top) / sc]; };

  function event(e) {
    if (ti >= tasks.length || !tasks[ti][1](e)) return;
    ti++;
    drawTasks();
    if (ti === tasks.length) complete('🎉 Μπράβο! Τα κατάφερες όλα στην επιφάνεια εργασίας!');
    else say('✅ Σωστά!', 'good');
  }
  function drawTasks() {
    side.innerHTML = '';
    tasks.forEach(([t], i) => side.appendChild(el('div', 'task' + (i < ti ? ' ok' : i === ti ? ' cur' : ''), (i < ti ? '✅ ' : `${i + 1}. `) + t)));
  }
  const closeMenus = () => desk.querySelectorAll('.ctx, .startmenu').forEach(m => m.remove());
  function menuAt(ev, items) {
    closeMenus();
    const [x, y] = deskXY(ev);
    const m = el('div', 'ctx');
    Object.assign(m.style, { left: Math.min(x, DESK_W - 230) + 'px', top: Math.min(y, DESK_H - BAR - items.length * 50 - 10) + 'px' });
    for (const [label, fn] of items) { const b = el('button', '', label); b.onclick = () => { closeMenus(); fn(); }; m.appendChild(b); }
    desk.appendChild(m);
  }

  // ---------- εικονίδια
  function drawIcon(ic) {
    if (!ic.el) { ic.el = el('div', 'dicon'); desk.appendChild(ic.el); }
    const d = ic.el;
    d.innerHTML = `<span>${ic.em}${ic.kind === 'app' ? '<i class="sc">↗</i>' : ''}</span><div class="nm"></div>`;
    d.lastChild.textContent = ic.name;
    d.style.left = ic.x + 'px'; d.style.top = ic.y + 'px';
    let start;
    press(d, {
      onTap: () => { closeMenus(); desk.querySelectorAll('.dicon').forEach(o => o.classList.remove('sel')); d.classList.add('sel'); },
      onDouble: () => openWin(ic),
      onLong: e => menuAt(e, [['📂 Άνοιγμα', () => openWin(ic)], ['✏️ Μετονομασία', () => rename(ic)]]),
      onDrag: (dx, dy) => { start = start || [ic.x, ic.y]; ic.x = Math.max(0, Math.min(DESK_W - 130, start[0] + dx)); ic.y = Math.max(0, Math.min(DESK_H - BAR - 110, start[1] + dy)); d.style.left = ic.x + 'px'; d.style.top = ic.y + 'px'; },
      onDragEnd: () => { start = null; event({ t: 'moveicon', id: ic.id }); },
    });
  }
  function rename(ic) {
    const d = ic.el;
    const inp = el('input', 'rn');
    inp.value = ic.name;
    d.lastChild.replaceWith(inp);
    inp.focus(); inp.select();
    let doneRn = false;
    const commit = () => { if (doneRn) return; doneRn = true; ic.name = inp.value.trim() || ic.name; drawIcon(ic); event({ t: 'rename', id: ic.id, name: ic.name }); };
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') commit(); };
    inp.onblur = commit;
    say('⌨️ Γράψε το νέο όνομα και πάτα Enter (στον πίνακα: πληκτρολόγιο οθόνης).');
  }
  function newFolder(ev) {
    const n = icons.length;
    const ic = { id: 'new' + nextNew++, kind: 'folder', em: '📁', name: 'Νέος φάκελος', body: '(Ο φάκελος είναι άδειος)', x: 16 + Math.floor(n / 4) * 140, y: 10 + (n % 4) * 122 };
    icons.push(ic);
    drawIcon(ic);
    event({ t: 'newfolder' });
    rename(ic); // όπως στα Windows: ο νέος φάκελος περιμένει όνομα
  }

  // ---------- παράθυρα
  function geom(w) {
    const H = DESK_H - BAR;
    return w.state === 'max' ? [0, 0, DESK_W, H] : w.state === 'left' ? [0, 0, DESK_W / 2, H] : w.state === 'right' ? [DESK_W / 2, 0, DESK_W / 2, H] : [w.x, w.y, WIN_W, WIN_H];
  }
  function layout(w) {
    const [x, y, ww, hh] = geom(w);
    Object.assign(w.el.style, { left: x + 'px', top: y + 'px', width: ww + 'px', height: hh + 'px', display: w.min ? 'none' : 'flex', zIndex: w.z });
    w.maxBtn.textContent = w.state === 'normal' ? '▢' : '❐';
    drawBar();
  }
  const focus = w => { w.z = ++z; layout(w); };
  function openWin(ic, from) {
    closeMenus();
    let w = wins[ic.id];
    if (w) { w.min = false; focus(w); return event({ t: 'open', id: ic.id, kind: ic.kind, name: ic.name, from }); }
    const n = Object.keys(wins).length;
    w = wins[ic.id] = { ic, state: 'normal', x: 200 + n * 40, y: 30 + n * 30, min: false, z: ++z };
    w.el = el('div', 'win', `<div class="title"><span>${ic.em}</span><span class="tn"></span></div><div class="body">${ic.body}</div>`);
    w.el.querySelector('.tn').textContent = ic.name;
    const title = w.el.firstChild;
    const mk = (cls, txt, fn) => { const b = el('button', 'wb ' + cls, txt); b.onclick = e => { e.stopPropagation(); fn(); }; title.appendChild(b); return b; };
    mk('mn', '—', () => { w.min = true; layout(w); event({ t: 'min', id: ic.id }); });
    w.maxBtn = mk('mx', '▢', () => { const was = w.state; w.state = was === 'normal' ? 'max' : 'normal'; layout(w); event({ t: was === 'normal' ? 'max' : 'unmax', id: ic.id }); });
    mk('x', '✕', () => { w.el.remove(); delete wins[ic.id]; drawBar(); event({ t: 'close', id: ic.id }); });
    w.el.onpointerdown = () => focus(w);
    // σύρσιμο από τη γραμμή τίτλου· στις άκρες: μεγιστοποίηση ή μισή οθόνη
    let base, zone = null, wasSnapped = false;
    const preview = el('div', 'snapprev');
    press(title, {
      onDouble: () => w.maxBtn.onclick({ stopPropagation() {} }),
      onDragStart: ev => {
        focus(w);
        wasSnapped = w.state !== 'normal';
        const [px, py] = deskXY(ev);
        if (wasSnapped) { w.state = 'normal'; w.x = px - WIN_W / 2; w.y = Math.max(0, py - 20); layout(w); }
        base = [w.x, w.y];
      },
      onDrag: (dx, dy, ev) => {
        const [px, py] = deskXY(ev);
        w.x = Math.max(-WIN_W + 80, Math.min(DESK_W - 80, base[0] + dx));
        w.y = Math.max(0, Math.min(DESK_H - BAR - 40, base[1] + dy));
        layout(w);
        zone = py < 12 ? 'max' : px < 12 ? 'left' : px > DESK_W - 12 ? 'right' : null;
        if (zone) {
          const [x, y, ww, hh] = geom({ state: zone });
          Object.assign(preview.style, { left: x + 'px', top: y + 'px', width: ww + 'px', height: hh + 'px' });
          if (!preview.parentNode) desk.appendChild(preview);
        } else preview.remove();
      },
      onDragEnd: () => {
        preview.remove();
        if (zone) { w.state = zone; layout(w); event({ t: 'snap', zone, id: ic.id }); zone = null; }
        else event({ t: 'movewin', id: ic.id, wasSnapped });
      },
    });
    desk.appendChild(w.el);
    layout(w);
    event({ t: 'open', id: ic.id, kind: ic.kind, name: ic.name, from });
  }

  // ---------- γραμμή εργασιών & Έναρξη
  const bar = el('div', 'taskbar');
  desk.appendChild(bar);
  function drawBar() {
    bar.innerHTML = '';
    const st = el('button', 'startbtn', '⊞ Έναρξη');
    st.onclick = e => { e.stopPropagation(); toggleStart(); };
    bar.appendChild(st);
    const top = Object.values(wins).filter(w => !w.min).sort((a, b) => b.z - a.z)[0];
    // πρώτα οι καρφιτσωμένες εφαρμογές (ανοίγουν με ΕΝΑ κλικ), μετά όσα άλλα παράθυρα είναι ανοιχτά
    const ids = [...PINNED, ...Object.keys(wins).filter(id => !PINNED.includes(id))];
    for (const id of ids) {
      const w = wins[id];
      const ic = w ? w.ic : { id, kind: 'app', ...DESK_APPS[id] };
      const b = el('button', 'tbtn' + (w ? ' open' : '') + (w === top ? ' on' : '') + (w && w.min ? ' min' : ''), ic.em);
      b.title = ic.name;
      b.onclick = e => {
        e.stopPropagation();
        if (!w) return openWin(ic, 'bar');
        if (w.min) { w.min = false; focus(w); event({ t: 'restore', id }); }
        else if (w === top) { w.min = true; layout(w); event({ t: 'min', id }); }
        else { focus(w); event({ t: 'focus', id }); }
      };
      bar.appendChild(b);
    }
    const now = new Date();
    bar.appendChild(el('span', 'clock', now.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' })));
  }
  function toggleStart() {
    if (desk.querySelector('.startmenu')) return closeMenus();
    closeMenus();
    const m = el('div', 'startmenu', '<div class="sm-h">Όλες οι εφαρμογές</div>');
    for (const [id, a] of Object.entries(DESK_APPS)) {
      const b = el('button', '', `${a.em} ${a.name}`);
      b.onclick = () => { closeMenus(); openWin({ id, kind: 'app', ...a }, 'start'); };
      m.appendChild(b);
    }
    const off = el('button', 'off', '⏻ Τερματισμός');
    off.onclick = () => {
      closeMenus();
      const dlg = el('div', 'dlg', '⏻ <b>Τερματισμός</b><br>Έτσι κλείνουμε σωστά τον υπολογιστή.<br><small>(Εδώ είναι μόνο εξάσκηση — δεν κλείνει τίποτα!)</small>');
      const ok = el('button', '', 'Εντάξει');
      ok.onclick = () => dlg.remove();
      dlg.appendChild(ok);
      desk.appendChild(dlg);
      event({ t: 'shutdown' });
    };
    m.appendChild(off);
    desk.appendChild(m);
    event({ t: 'start' });
  }
  // άδειο σημείο: πάτημα κλείνει τα μενού · δεξί κλικ / παρατεταμένο πάτημα → μενού επιφάνειας εργασίας
  press(desk, {
    onTap: () => { closeMenus(); desk.querySelectorAll('.dicon').forEach(o => o.classList.remove('sel')); },
    onLong: e => menuAt(e, [['📁 Νέος φάκελος', () => newFolder(e)], ['🔄 Ανανέωση', () => {}]]),
  });
  icons.forEach(drawIcon);
  drawBar();
  drawTasks();
};

// ---- Εκτέλεση αλγορίθμου βήμα-βήμα με πίνακα μεταβλητών (ΣΤ΄): πριν από κάποια βήματα μαντεύουν τη νέα τιμή
const escHTML = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
RENDER.stepper = (act, area) => {
  let si = -1;
  const vars = {};
  const code = el('div', 'algo-code'), side = el('div', 'stepside');
  const varsEl = el('div', 'vars'), note = el('div', 'note'), ask = el('div', 'ask'), btn = el('button', '', '▶ Επόμενο βήμα');
  side.append(varsEl, note, ask, btn);
  area.append(code, side);
  const drawCode = line => { code.innerHTML = act.code.map((c, i) => `<div class="cl-line${i === line ? ' cur' : ''}">${escHTML(c)}</div>`).join(''); };
  const drawVars = changed => {
    varsEl.innerHTML = '<h4>📦 Μεταβλητές</h4>' + (Object.keys(vars).length ? '' : '<div style="opacity:.7;font-size:20px">(καμία ακόμα)</div>');
    for (const [k, v] of Object.entries(vars)) varsEl.appendChild(el('div', 'var' + (changed.includes(k) ? ' ch' : ''), `<span>${k}</span><b>${v}</b>`));
  };
  function apply(st) {
    Object.assign(vars, st.vars || {});
    drawVars(Object.keys(st.vars || {}));
    if (st.after) note.innerHTML = st.after;
    if (si === act.steps.length - 1) { btn.disabled = true; complete(act.doneMsg || '🎉 Μπράβο! Εκτέλεσες τον αλγόριθμο σαν υπολογιστής!'); }
    else btn.disabled = false;
  }
  btn.onclick = () => {
    if (si >= act.steps.length - 1) return;
    const st = act.steps[++si];
    drawCode(st.line);
    note.innerHTML = st.note || '';
    ask.innerHTML = '';
    say('');
    if (!st.ask) return apply(st);
    btn.disabled = true;
    ask.appendChild(el('div', 'q', st.ask.q));
    const opts = el('div', 'opts');
    st.ask.options.forEach((o, i) => {
      const b = el('button', 'secondary', o);
      b.onclick = () => {
        if (btn.disabled === false) return;
        if (i !== st.ask.answer) { b.classList.add('wrong'); return say('Όχι ακόμα — κοίτα τις τιμές των μεταβλητών!', 'bad'); }
        b.style.background = '#2e7d32';
        say('✅ Σωστά!', 'good');
        apply(st);
      };
      opts.appendChild(b);
    });
    ask.appendChild(opts);
  };
  drawCode(-1);
  drawVars([]);
  note.textContent = 'Πατήστε «▶ Επόμενο βήμα» για να ξεκινήσει ο αλγόριθμος.';
};

// ---- Λογικές εκφράσεις: διακόπτες ΑΛΗΘΗΣ/ΨΕΥΔΗΣ → λάμπα, και πίνακας αλήθειας που γεμίζει (ΣΤ΄ έκδ. 8.02 σελ. 14–15)
RENDER.logic = (act, area) => {
  const n = act.inputs.length;
  const vals = Array(n).fill(false);
  const seen = new Set();
  const left = el('div', 'lg-in'), mid = el('div', 'lg-mid'), table = el('table', 'tt');
  const wrap = el('div', 'logic');
  wrap.append(left, mid, table);
  area.appendChild(wrap);
  const combos = [...Array(2 ** n).keys()].map(k => [...Array(n)].map((_, i) => !!(k & (1 << (n - 1 - i)))));
  const mark = b => (b ? '✅' : '❌');
  function draw() {
    const res = !!act.f(vals);
    seen.add(vals.join());
    left.innerHTML = '';
    act.inputs.forEach(([nm, em, label], i) => {
      const b = el('button', 'sw' + (vals[i] ? ' on' : ''), `<span class="em">${em}</span><span><b>${nm}:</b> ${label}</span><span class="v">${vals[i] ? 'ΑΛΗΘΗΣ' : 'ΨΕΥΔΗΣ'}</span>`);
      b.onclick = () => { vals[i] = !vals[i]; draw(); };
      left.appendChild(b);
    });
    mid.innerHTML = `<div class="ex">${act.expr}</div>${lampSVG(res, 120)}<div class="out">${act.out[0]} ${act.out[1]}<br><b>${res ? 'ΑΛΗΘΗΣ ✅' : 'ΨΕΥΔΗΣ ❌'}</b></div>`;
    table.innerHTML = `<tr>${act.inputs.map(x => `<th>${x[0]}</th>`).join('')}<th>${act.expr}</th></tr>` +
      combos.map(c => `<tr class="${c.join() === vals.join() ? 'cur' : ''}">${c.map(v => `<td>${mark(v)}</td>`).join('')}<td>${seen.has(c.join()) ? mark(act.f(c)) : '?'}</td></tr>`).join('');
    if (seen.size === combos.length) complete(act.doneMsg || '🎉 Μπράβο! Δοκίμασες όλους τους συνδυασμούς — συμπλήρωσες τον πίνακα αλήθειας!');
    else say(`Δοκίμασε όλους τους συνδυασμούς: ${seen.size} από ${combos.length}.`);
  }
  draw();
};

// ---- «Μάντεψε τον αριθμό» (ΣΤ΄ έκδ. 8.0 μαθ. 2): ο υπολογιστής διαλέγει, εμείς μαντεύουμε με όριο προσπαθειών
RENDER.guess = (act, area) => {
  const max = act.max || 10, tries = act.tries || 5;
  let secret, attempts, typed, over, hist;
  const wrap = el('div', 'guess'), pad = el('div', 'gpad'), side = el('div', 'gside');
  const disp = el('div', 'gdisp'), talk = el('div', 'gsay'), varsEl = el('div', 'vars'), histEl = el('div', 'ghist');
  side.append(disp, talk, varsEl, histEl);
  wrap.append(pad, side);
  area.appendChild(wrap);
  for (const k of ['7', '8', '9', '4', '5', '6', '1', '2', '3', '⌫', '0', 'OK']) {
    const b = el('button', k === 'OK' ? '' : 'secondary', k === 'OK' ? '✔' : k);
    b.onclick = () => pressKey(k);
    pad.appendChild(b);
  }
  function drawVars() {
    varsEl.innerHTML = `<h4>📦 Μεταβλητές</h4><div class="var"><span>προσπάθειες</span><b>${attempts}</b></div><div class="var"><span>Μυστικός_Αριθμός</span><b>${over ? secret : '?'}</b></div>`;
    histEl.textContent = hist.length ? 'Δοκίμασες: ' + hist.join(' · ') : '';
    disp.textContent = typed || '_';
  }
  function start() {
    secret = 1 + Math.floor(Math.random() * max);
    attempts = 1; typed = ''; over = false; hist = [];
    talk.innerHTML = `🤖 Διάλεξα έναν αριθμό από το 1 μέχρι το ${max}. Μάντεψέ τον! Έχεις <b>${tries}</b> προσπάθειες.`;
    drawVars();
  }
  function pressKey(k) {
    if (over) return;
    if (k === '⌫') typed = typed.slice(0, -1);
    else if (k === 'OK') return check();
    else if (typed.length < String(max).length) typed += k;
    drawVars();
  }
  function check() {
    const g = +typed;
    if (!typed || g < 1 || g > max) { talk.innerHTML = `Δώσε έναν αριθμό από το 1 μέχρι το ${max}.`; return; }
    typed = '';
    if (g === secret) {
      over = true; hist.push(g + ' ✅'); drawVars();
      talk.innerHTML = `🎉 «Μπράβο! Βρήκες τον αριθμό» σε <b>${attempts}</b> ${attempts === 1 ? 'προσπάθεια' : 'προσπάθειες'}.`;
      return finish(true);
    }
    hist.push(g + (g < secret ? ' ⬆' : ' ⬇'));
    talk.innerHTML = g < secret ? '🤖 «Ο μυστικός αριθμός είναι <b>μεγαλύτερος</b> από αυτόν που μου έδωσες»' : '🤖 «Ο μυστικός αριθμός είναι <b>μικρότερος</b> από αυτόν που μου έδωσες»';
    attempts++; // «Αύξησε τις προσπάθειες κατά 1»
    if (attempts > tries) { over = true; drawVars(); talk.innerHTML = `😢 «Έχασες! Δεν μάντεψες τον αριθμό». Ήταν το <b>${secret}</b>.`; return finish(false); }
    drawVars();
  }
  function finish(won) {
    const again = el('button', 'secondary', '🔁 Ξανά');
    again.onclick = () => { again.remove(); start(); };
    talk.appendChild(document.createElement('br'));
    talk.appendChild(again);
    if (won) complete(act.doneMsg || '🎉 Μπράβο! Ο αλγόριθμος σταμάτησε γιατί η συνθήκη έγινε αληθής.');
    else say('Η επανάληψη σταμάτησε γιατί έγινε αληθής το «προσπάθειες > ' + tries + '». Δοκίμασε ξανά!', 'bad');
  }
  start();
};

// ---- Τσαμπιά με ξυλάκια (8, 4, 2, 1) που σέρνονται στο καλάθι (RAM) για να βγει ένας αριθμός
const STICK_NAMES = { 1: 'μονάδα', 2: 'δυάδα', 4: 'τετράδα', 8: 'οκτάδα', 16: 'δεκαεξάδα' };
function sticksSVG(n) {
  const w = n * 14 + 10;
  let s = '';
  for (let i = 0; i < n; i++) s += `<rect x="${5 + i * 14}" y="4" width="9" height="86" rx="4" fill="#d7a35b" stroke="#8d5a2b" stroke-width="2"/>`;
  if (n > 1) s += `<rect x="2" y="41" width="${w - 4}" height="12" rx="5" fill="#e53935"/>`; // το λαστιχάκι του τσαμπιού
  return `<svg width="${w}" height="94" viewBox="0 0 ${w} 94">${s}</svg>`;
}
RENDER.sticks = (act, area) => {
  const vals = act.values || [8, 4, 2, 1];
  const inBasket = new Set();
  let ti = 0, locked = false;
  const wrap = el('div', 'sticks');
  const target = el('div', 'target');
  const row = el('div', 'sticks-row');
  const src = el('div', 'stick-src', '<h3>Τα ξυλάκια</h3>'), srcB = el('div', 'bundles');
  const basket = el('div', 'basket', '<h3>🧺 Καλάθι (RAM)</h3>'), inB = el('div', 'bundles');
  src.appendChild(srcB); basket.appendChild(inB);
  row.append(src, basket);
  const sumEl = el('div', 'sum'), binEl = el('div', 'binrow'), help = el('div', 'help');
  const helpBtn = el('button', 'secondary', '💡 Βοήθεια');
  const bottom = el('div', 'sticks-bottom'), helpRow = el('div', 'sticks-help');
  bottom.append(binEl, sumEl);
  helpRow.append(helpBtn, help);
  wrap.append(target, row, bottom, helpRow);
  area.appendChild(wrap);
  const total = () => vals.reduce((t, v) => t + (inBasket.has(v) ? v : 0), 0);

  // ο διάλογος του δασκάλου: από το μεγαλύτερο τσαμπί, «χωράει;»
  helpBtn.onclick = () => {
    let rest = targets()[ti];
    help.innerHTML = vals.map(v => v <= rest
      ? (rest -= v, `Χωράει η ${STICK_NAMES[v]} (${v}); <b>Ναι!</b> → μένουν ${rest}.`)
      : `Χωράει η ${STICK_NAMES[v]} (${v}); Όχι.`).join(' · ');
  };
  const targets = () => act.targets;

  function draw() {
    target.innerHTML = `Θέλω τον αριθμό: <b>${targets()[ti]}</b>`;
    srcB.innerHTML = ''; inB.innerHTML = '';
    for (const v of vals) {
      const b = el('div', 'bundle', sticksSVG(v) + `<div class="lbl"><b>${v}</b> ${STICK_NAMES[v]}</div>`);
      if (inBasket.has(v)) {
        inB.appendChild(b);
        const gap = el('div', 'bundle gone', b.innerHTML); // κρατάει τη θέση του στα αριστερά
        srcB.appendChild(gap);
      } else srcB.appendChild(b);
      drag(b, v);
    }
    const parts = vals.filter(v => inBasket.has(v));
    sumEl.textContent = parts.length ? `${parts.join(' + ')} = ${total()}` : 'Το καλάθι είναι άδειο';
    binEl.innerHTML = vals.map(v => `<div class="bc"><small>${STICK_NAMES[v]}</small><b>${inBasket.has(v) ? 1 : 0}</b></div>`).join('');
  }
  // σύρσιμο με το δάχτυλο/ποντίκι· ένα απλό πάτημα βάζει ή βγάζει το τσαμπί
  function drag(b, v) {
    b.onpointerdown = e => {
      if (locked) return;
      e.preventDefault();
      b.setPointerCapture(e.pointerId);
      const scale = $('stage').getBoundingClientRect().width / 1600;
      const sx = e.clientX, sy = e.clientY;
      let moved = false;
      b.classList.add('dragging');
      b.onpointermove = ev => {
        const dx = (ev.clientX - sx) / scale, dy = (ev.clientY - sy) / scale;
        if (Math.abs(dx) + Math.abs(dy) > 10) moved = true;
        b.style.transform = `translate(${dx}px, ${dy}px)`;
      };
      b.onpointerup = b.onpointercancel = ev => {
        b.onpointermove = b.onpointerup = b.onpointercancel = null;
        const r = basket.getBoundingClientRect();
        const over = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
        if (!moved) inBasket.has(v) ? inBasket.delete(v) : inBasket.add(v);
        else if (over) inBasket.add(v);
        else inBasket.delete(v);
        draw();
        check();
      };
    };
  }
  function check() {
    const sum = total(), t = targets()[ti];
    if (sum > t) return say('Πολλά ξυλάκια! Βγάλε κάποιο τσαμπί από το καλάθι.', 'bad');
    if (sum !== t) return say('');
    const code = vals.map(v => (inBasket.has(v) ? 1 : 0)).join('');
    const names = vals.filter(v => inBasket.has(v)).map(v => STICK_NAMES[v]).join(' και ');
    if (ti === targets().length - 1) return complete(`🎉 Μπράβο! ${names} = ${sum} → στο δυαδικό <b>${code}</b>`);
    say(`✅ Σωστά! ${names} = ${sum} → στο δυαδικό <b>${code}</b>`, 'good');
    locked = true;
    const my = runId;
    setTimeout(() => { if (my !== runId) return; ti++; inBasket.clear(); help.innerHTML = ''; locked = false; draw(); }, 2200);
  }
  draw();
};

// ---- Δύο μετρητές (δεκαδικός & δυαδικός) με +1: «μετά το 9 → 10», «μετά το 1 → 10»
RENDER.counter = (act, area) => {
  const max = act.max || 10;
  const decW = String(max).length, binW = max.toString(2).length;
  let n = 0;
  const meters = el('div', 'meters');
  const dec = el('div', 'meter', '<h4>Δεκαδικό σύστημα <small>(ψηφία 0–9)</small></h4>');
  const bin = el('div', 'meter', '<h4>Δυαδικό σύστημα <small>(ψηφία 0 και 1)</small></h4>');
  const decD = el('div', 'digits'), binD = el('div', 'digits');
  dec.appendChild(decD); bin.appendChild(binD);
  const plus = el('button', 'plus', '+1');
  const explain = el('div', 'explain', 'Ξεκινάμε από το 0. Πάτα <b>+1</b>!');
  const meterRow = el('div', 'meter-row');
  meterRow.append(dec, bin);
  meters.append(meterRow, plus, explain);
  const table = el('table', 'numtable', '<tr><th>Δεκαδικό</th><th>Δυαδικό</th></tr>');
  area.append(meters, table);

  // ψηφία με «σβησμένα» μηδενικά μπροστά, και αναλαμπή σε όσα άλλαξαν
  function show(box, str, width, prev, base) {
    const padded = str.padStart(width, '0'), old = prev == null ? padded : prev.padStart(width, '0');
    box.innerHTML = '';
    [...padded].forEach((d, i) => {
      const col = el('div', 'dcol');
      col.appendChild(el('div', 'digit' + (i < width - str.length ? ' lead' : '') + (d !== old[i] ? ' flash' : ''), d));
      col.appendChild(el('span', '', PLACE_NAMES[base ** (width - 1 - i)]));
      box.appendChild(col);
    });
  }
  function row() {
    for (const r of table.querySelectorAll('tr.new')) r.classList.remove('new');
    table.appendChild(el('tr', 'new', `<td>${n}</td><td>${n.toString(2)}</td>`));
  }
  show(decD, '0', decW, null, 10); show(binD, '0', binW, null, 2); row();
  plus.onclick = () => {
    if (n >= max) return;
    const pd = String(n), pb = n.toString(2);
    n++;
    show(decD, String(n), decW, pd, 10);
    show(binD, n.toString(2), binW, pb, 2);
    row();
    const lines = [];
    lines.push(n % 10 === 0 ? `Δεκαδικό: μετά το <b>9</b> τελείωσαν τα ψηφία! 0 μονάδες και 1 δεκάδα → <b>${n}</b>.`
                            : `Δεκαδικό: απλώς ${n - 1} + 1 = <b>${n}</b>.`);
    lines.push(n % 2 === 0 ? `Δυαδικό: μετά το <b>1</b> τελείωσαν τα ψηφία! Γράφουμε 0 και περνάμε 1 στην επόμενη θέση αριστερά → <b>${n.toString(2)}</b>.`
                           : `Δυαδικό: το 0 γίνεται 1 → <b>${n.toString(2)}</b>.`);
    explain.innerHTML = lines.join('<br>');
    if (n === max) complete('🎉 Μπράβο! Μέτρησες ως το ' + max + ' και στα δύο συστήματα!');
  };
};

// ---- Λάμπες με αξίες θέσεων 16 8 4 2 1: ανάβουν για να φτιάξουν έναν αριθμό
RENDER.bits = (act, area) => {
  const n = act.bits || 5;
  const vals = [...Array(n)].map((_, i) => 2 ** (n - 1 - i));
  const on = Array(n).fill(false);
  const targets = act.targets || [];
  let ti = 0, locked = false;
  const wrap = el('div', 'bits');
  const target = el('div', 'target');
  const lamps = el('div', 'lamps');
  const binEl = el('div', 'bin'), sumEl = el('div', 'sum');
  wrap.append(target, lamps, binEl, sumEl);
  area.appendChild(wrap);
  const size = n === 1 ? 200 : 120;
  function draw() {
    target.innerHTML = targets.length ? `Φτιάξε τον αριθμό: <b>${targets[ti]}</b>` : '';
    lamps.innerHTML = '';
    vals.forEach((v, i) => {
      const b = el('button', 'lamp', (act.values === false ? '' : `<span class="val">${v}</span><small>${PLACE_NAMES[v]}</small>`) + lampSVG(on[i], size) + `<span class="bit">${on[i] ? 1 : 0}</span>`);
      b.onclick = () => { if (locked) return; on[i] = !on[i]; draw(); check(); };
      lamps.appendChild(b);
    });
    const sum = vals.reduce((t, v, i) => t + (on[i] ? v : 0), 0);
    if (act.values === false) {
      binEl.textContent = '';
      sumEl.textContent = on[0] ? '💡 Περνάει ρεύμα → 1' : '⚫ Δεν περνάει ρεύμα → 0';
    } else {
      binEl.textContent = on.map(x => (x ? 1 : 0)).join('');
      const parts = vals.filter((_, i) => on[i]);
      sumEl.textContent = parts.length ? `${parts.join(' + ')} = ${sum}` : '0';
    }
    return sum;
  }
  function check() {
    if (act.free) return complete('👍 Μπράβο! Τώρα ξέρεις τι σημαίνει 1 και τι 0.');
    const sum = vals.reduce((t, v, i) => t + (on[i] ? v : 0), 0);
    if (sum !== targets[ti]) return say(sum > targets[ti] ? 'Πέρασες τον αριθμό! Σβήσε κάποια λάμπα.' : '', sum > targets[ti] ? 'bad' : '');
    if (ti === targets.length - 1) return complete(`🎉 Μπράβο! Το ${sum} στο δυαδικό είναι ${sum.toString(2)}!`);
    say(`✅ Σωστά! Το ${sum} στο δυαδικό είναι <b>${sum.toString(2)}</b>.`, 'good');
    locked = true;
    const my = runId;
    setTimeout(() => { if (my !== runId) return; ti++; on.fill(false); locked = false; draw(); }, 1600);
  }
  draw();
};

// ---- Βραχιόλι γενεθλίων: μέρα/μήνας σε δυαδικό, με χάντρες (0, 1 και διαχωριστικό)
RENDER.bracelet = (act, area) => {
  const BEAD = { 0: '#fafafa', 1: '#1e88e5', '/': '#e53935' };
  let day = 12, month = 7;
  const wrap = el('div', 'bracelet');
  const steppers = el('div', 'steppers');
  const conv = el('div', 'conv'), beads = el('div', 'beads');
  const legend = el('div', 'legend', Object.entries({ 0: '= 0', 1: '= 1', '/': '= ανάμεσα σε μέρα και μήνα' })
    .map(([k, t]) => `<span><span class="bead" style="background:${BEAD[k]}"></span>${t}</span>`).join(''));
  wrap.append(steppers, conv, beads, legend);
  area.appendChild(wrap);
  const stepper = (label, get, set, max) => {
    const s = el('div', 'stepper', `${label}`);
    const minus = el('button', 'secondary', '−'), val = el('b'), plus = el('button', 'secondary', '+');
    minus.onclick = () => { set(get() === 1 ? max : get() - 1); draw(); };
    plus.onclick = () => { set(get() === max ? 1 : get() + 1); draw(); };
    s.append(minus, val, plus);
    s.val = val;
    return s;
  };
  const dS = stepper('Μέρα', () => day, v => { day = v; }, 31), mS = stepper('Μήνας', () => month, v => { month = v; }, 12);
  steppers.append(dS, mS);
  function draw() {
    dS.val.textContent = day; mS.val.textContent = month;
    const code = day.toString(2) + '/' + month.toString(2);
    conv.innerHTML = `${day}/${month} → <span>${code}</span>`;
    beads.innerHTML = '';
    for (const c of code) beads.appendChild(el('span', 'bead')).style.background = BEAD[c];
  }
  draw();
  complete('📿 Φτιάξτε το βραχιόλι σας με χάντρες στην τάξη!');
};

// ============================================================================
// ΠΛΟΗΓΗΣΗ & ΣΚΗΝΗ
// ============================================================================
$('homeBtn').onclick = () => { runId++; renderHome(); showScreen('homeScreen'); };
$('prevBtn').onclick = () => { if (actIdx > 0) { actIdx--; renderAct(); } };
$('nextBtn').onclick = () => {
  const les = book()[chapterIdx].lessons[lessonIdx];
  if (actIdx < les.acts.length) { actIdx++; renderAct(); } // μετά την τελευταία: οθόνη «Τέλος μαθήματος»
  else { runId++; renderHome(); showScreen('homeScreen'); }
};

function fitStage() { $('stage').style.setProperty('--s', Math.min(innerWidth / 1600, innerHeight / 900)); }
addEventListener('resize', fitStage);
addEventListener('wheel', e => e.preventDefault(), { passive: false });
addEventListener('touchmove', e => e.preventDefault(), { passive: false });
addEventListener('gesturestart', e => e.preventDefault());
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });

// έλεγχος δεδομένων: κάθε άσκηση του βιβλίου πρέπει να λύνεται
for (const ch of BOOKS.flatMap(b => b.chapters)) for (const les of ch.lessons) for (const a of les.acts) {
  if (a.type === 'order') console.assert(firstMistake(orderRules(a), a.steps.map((_, i) => i)) === null, 'σειρά: ' + a.title);
  if (a.type === 'pick') console.assert(a.options.some(o => expand(o).join() === expand(a.path).join()), 'pick: ' + a.text);
  if (a.type === 'trace') console.assert(!simulate(a.grid, a.program).crash, 'trace: ' + a.text);
  if (a.type === 'sticks') console.assert(a.targets.every(t => t > 0 && t < 16), 'sticks: ' + a.text);
  if (a.type === 'bits') console.assert((a.targets || []).every(t => t < 2 ** a.bits), 'bits: ' + a.text);
}

renderHome();
fitStage();
</script>
