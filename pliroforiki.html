<!DOCTYPE html>
<html lang="el">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Πληροφορική Δημοτικού — Διαδραστικό βιβλίο</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298 50%, #41a0d8);
    color: #fff;
    touch-action: none; user-select: none;
  }
  /* σταθερή «σκηνή» 1600×900 που μικραίνει ώστε να χωράει πάντα, χωρίς scroll/zoom */
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: 1600px; height: 900px;
    transform: translate(-50%, -50%) scale(var(--s, 1));
    padding: 24px 40px;
    display: flex; flex-direction: column;
  }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.active { display: flex; }

  button {
    font-family: inherit; border: none; border-radius: 14px; cursor: pointer;
    font-weight: bold; color: #fff;
    background: #ff9500; box-shadow: 0 5px 0 #c46c00;
    padding: 14px 30px; font-size: 26px;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c46c00; }
  button.secondary { background: #5a6890; box-shadow: 0 5px 0 #3a4670; }
  button:disabled { opacity: 0.35; cursor: default; }
  .back {
    color: #fff; text-decoration: none; background: rgba(0,0,0,0.55);
    padding: 10px 18px; border-radius: 10px; font-size: 20px; font-weight: bold;
  }

  /* ΑΡΧΙΚΗ */
  .home-head { display: flex; align-items: center; gap: 24px; }
  .home-head h1 { flex: 1; text-align: center; font-size: 46px; margin-right: 120px; }
  .tabs { display: flex; gap: 12px; justify-content: center; margin: 18px 0 20px; }
  .tab { background: rgba(0,0,0,0.3); box-shadow: none; font-size: 22px; padding: 12px 22px; border: 3px solid transparent; }
  .tab.on { border-color: #ffb347; background: rgba(255,179,71,0.18); }
  .tab.soon { opacity: 0.5; }
  .grades { margin: 14px 0 0; }
  .grades .tab { font-size: 28px; padding: 12px 34px; }
  .home-head + .grades + .tabs { margin-top: 12px; }
  .algo { background: #fff; color: #1e3c72; border: 3px dashed #90a4ae; border-radius: 16px; padding: 14px 22px; font-size: 28px; line-height: 1.45; text-align: left; }
  .algo .loop-title { color: #e65100; font-weight: bold; }
  .algo .loop { border-left: 8px solid #ff9500; margin-left: 10px; padding-left: 22px; }
  .chapter-title { text-align: center; font-size: 28px; color: #ffb347; margin-bottom: 18px; }
  .lessons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .lesson {
    background: rgba(0,0,0,0.35); box-shadow: none; border: 3px solid transparent; border-radius: 18px;
    padding: 18px 22px; display: flex; align-items: center; gap: 18px; text-align: left; min-height: 150px;
  }
  .lesson:hover { border-color: #ffb347; }
  .lesson .ico { font-size: 64px; }
  .lesson .ttl { font-size: 25px; color: #ffb347; }
  .lesson .sub { font-size: 17px; font-weight: normal; opacity: 0.8; margin-top: 6px; }
  .lesson .prog { font-size: 18px; margin-top: 6px; color: #b9f6ca; }
  .soon-box { text-align: center; font-size: 30px; opacity: 0.85; margin-top: 120px; line-height: 1.6; }

  /* ΔΡΑΣΤΗΡΙΟΤΗΤΑ */
  .topbar { display: flex; align-items: center; gap: 20px; }
  .topbar .lesson-title { flex: 1; font-size: 30px; font-weight: bold; text-align: center; }
  .pips { display: flex; gap: 8px; }
  .pip { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.25); }
  .pip.done { background: #66bb6a; }
  .pip.cur { outline: 3px solid #ffb347; }
  .instr {
    margin-top: 14px; background: rgba(0,0,0,0.3); border-radius: 14px; padding: 14px 22px;
    font-size: 27px; line-height: 1.35; display: flex; gap: 16px; align-items: center;
  }
  .instr .kind { background: #ffb347; color: #3a2400; border-radius: 10px; padding: 4px 12px; font-size: 18px; font-weight: bold; white-space: nowrap; }
  .instr .ref { margin-left: auto; font-size: 17px; opacity: 0.75; white-space: nowrap; }
  .instr .texts { display: flex; flex-direction: column; gap: 4px; }
  .instr .guide { font-size: 19px; opacity: 0.8; }
  .why-box { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); max-width: 1250px; width: max-content; background: #fff8e1; color: #3e2723; border-radius: 16px; padding: 14px 20px 14px 24px; font-size: 25px; line-height: 1.4; box-shadow: 0 8px 30px rgba(0,0,0,0.45); z-index: 30; display: flex; gap: 16px; align-items: center; }
  .why-box button { font-size: 20px; padding: 6px 14px; }
  .q-explain { background: #fff8e1; color: #3e2723; border-radius: 14px; padding: 12px 20px; font-size: 25px; max-width: 1200px; }
  .finish { display: flex; flex-direction: column; align-items: center; gap: 18px; font-size: 30px; text-align: center; }
  .finish .big { font-size: 120px; } .finish .t { font-size: 40px; font-weight: bold; color: #ffb347; }
  .area { flex: 1; min-height: 0; margin-top: 16px; display: flex; gap: 40px; align-items: center; justify-content: center; position: relative; }
  .bottombar { display: flex; align-items: center; gap: 20px; margin-top: 12px; min-height: 76px; }
  .msg { flex: 1; text-align: center; font-size: 27px; }
  .msg.good { color: #b9f6ca; }
  .msg.bad { color: #ffcdd2; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  #nextBtn.pulse { animation: pulse 1s infinite; background: #43a047; box-shadow: 0 5px 0 #1b5e20; }

  /* INFO */
  .info { max-width: 1250px; display: flex; flex-direction: column; gap: 18px; }
  .info .card { background: #fff; color: #1e3c72; border-radius: 18px; padding: 22px 30px; font-size: 32px; line-height: 1.4; display: flex; gap: 22px; align-items: center; }
  .info .card .em { font-size: 64px; }
  .info .card b { color: #e65100; }

  /* ΣΕΙΡΑ */
  .order { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: 100%; height: 100%; }
  .col { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .col h3 { font-size: 22px; opacity: 0.85; text-align: center; }
  .list { flex: 1; display: flex; flex-direction: column; gap: var(--gap, 12px); }
  .slot { flex: 1; max-height: 110px; display: flex; align-items: center; gap: 14px; border: 3px dashed rgba(255,255,255,0.35); border-radius: 16px; padding: 0 12px; }
  .num { width: 50px; height: 50px; flex: none; border-radius: 50%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: #ffb347; }
  .step { flex: 1; max-height: 110px; display: flex; align-items: center; gap: 14px; background: #fff; color: #1e3c72; border-radius: 14px; padding: 6px 16px; font-size: var(--fs, 28px); font-weight: bold; box-shadow: 0 5px 0 rgba(0,0,0,0.3); cursor: pointer; }
  .slot .step { align-self: stretch; margin: 6px 0; }
  .step .em { font-size: 1.5em; flex: none; }
  .step.wrong { background: #ffcdd2; outline: 5px solid #e53935; }
  .step.right { background: #c8e6c9; }
  .step.hidden { visibility: hidden; }

  /* ΠΛΕΓΜΑ */
  .grid { position: relative; background: #fff8e1; border: 4px solid #ef8a2c; border-radius: 6px; flex: none; }
  .grid.garden { background: #7cb342; border-color: #558b2f; }
  .cell { position: absolute; border: 2px solid #f0b37a; display: flex; align-items: center; justify-content: center; }
  .garden .cell { border: 3px solid #689f38; background: #8bc34a; }
  .cell.obstacle { background: #e8f5e9; }
  .cell.pond { background: radial-gradient(ellipse at center, #4fc3f7 0 55%, #fff8e1 56%); }
  .cell.tap { cursor: pointer; }
  .cell.tap:hover { background: #ffe0b2; }
  .cell.hit { background: #c8e6c9 !important; }
  .cell.miss { background: #ffcdd2 !important; }
  .cell .it { line-height: 1; }
  .sprite { position: absolute; display: flex; align-items: center; justify-content: center; transition: left 0.35s, top 0.35s, transform 0.35s; pointer-events: none; z-index: 3; }
  .sprite.crash { animation: shake 0.4s; }
  .trail { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  @keyframes shake { 0%,100% { margin-left: 0; } 25% { margin-left: -10px; } 75% { margin-left: 10px; } }

  /* ΕΝΤΟΛΕΣ (μπλε πλακίδια σαν του ScratchJr) */
  .blk { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; height: 70px; border-radius: 12px; background: #29a3e8; box-shadow: 0 4px 0 #1a6fa0; color: #fff; font-size: 44px; font-weight: bold; line-height: 1; position: relative; }
  .blk.robot { background: #43a047; box-shadow: 0 4px 0 #1b5e20; }
  .blk .n { position: absolute; bottom: -6px; background: #fff; color: #1a6fa0; border-radius: 8px; font-size: 18px; padding: 0 8px; }
  .strip { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .rep { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #ef6c00; border-radius: 14px; padding: 8px 8px 8px 14px; box-shadow: 0 4px 0 #a84300; }
  .rep-end { color: #fff; font-size: 40px; font-weight: bold; position: relative; padding: 0 10px 10px; }
  .rep-end .n { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: #fff; color: #a84300; border-radius: 8px; font-size: 18px; padding: 0 8px; }
  .info .card .strip { margin-top: 8px; }
  .beadrow { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; background: rgba(255,255,255,0.92); border-radius: 30px; vertical-align: middle; }
  .bd { border-radius: 50%; border: 2px solid #263238; display: inline-block; }
  .q-html { display: flex; justify-content: center; }
  .choice .beadrow { padding: 4px 8px; }
  /* micro:bit */
  .mb-wrap { display: flex; gap: 50px; align-items: center; }
  .mb { width: 420px; height: 330px; background: #263238; border-radius: 30px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .mb .leds { position: absolute; left: 110px; top: 60px; display: grid; grid-template-columns: repeat(5, 30px); gap: 10px; }
  .mb .led { width: 30px; height: 30px; border-radius: 6px; background: #455a64; }
  .mb .led.on { background: #ff1744; box-shadow: 0 0 14px #ff1744; }
  .mb .btn { position: absolute; top: 135px; width: 64px; height: 64px; border-radius: 50%; background: #1e88e5; font-size: 26px; padding: 0; box-shadow: 0 5px 0 #0d47a1; }
  .mb .btn.a { left: 18px; } .mb .btn.b { right: 18px; }
  .mb .logo { position: absolute; left: 175px; top: 12px; width: 70px; height: 34px; border-radius: 17px; background: #ffd600; color: #263238; font-size: 15px; padding: 0; box-shadow: 0 4px 0 #c7a500; }
  .mb-prog { display: flex; flex-direction: column; gap: 12px; width: 600px; }
  .mb-card { background: #e91e63; border-radius: 14px; padding: 12px 18px; font-size: 26px; }
  .mb-card.blue { background: #1565c0; } .mb-card.hit { outline: 5px solid #ffd600; }
  .mb-card button { font-size: 24px; padding: 6px 14px; margin-left: 8px; }
  .side { display: flex; flex-direction: column; gap: 20px; width: 640px; }
  .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .palette button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; font-size: 18px; background: #29a3e8; box-shadow: 0 5px 0 #1a6fa0; }
  .palette.robot button { background: #43a047; box-shadow: 0 5px 0 #1b5e20; }
  .palette button .g { font-size: 52px; line-height: 1; }
  .prog-box { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 16px; min-height: 120px; }
  .prog-box h4 { font-size: 20px; opacity: 0.85; margin-bottom: 10px; }
  .prog-box .slotbox { width: 70px; height: 70px; border: 3px dashed rgba(255,255,255,0.45); border-radius: 12px; }
  .prog-box .blk { cursor: pointer; }
  .controls { display: flex; gap: 14px; }
  .loopctl { margin-top: 12px; align-items: center; } .loopctl .found { font-size: 26px; color: #ffcc80; }
  .found { font-size: 22px; color: #b9f6ca; }

  /* ΕΠΙΛΟΓΗ ΠΡΟΓΡΑΜΜΑΤΟΣ / ΕΡΩΤΗΣΕΙΣ */
  .choices { display: flex; flex-direction: column; gap: 18px; width: 640px; }
  .choice { display: flex; align-items: center; gap: 18px; background: rgba(255,255,255,0.14); box-shadow: 0 5px 0 rgba(0,0,0,0.3); padding: 14px 20px; text-align: left; font-size: 30px; }
  .choice .letter { width: 56px; height: 56px; flex: none; border-radius: 50%; background: #fff; color: #1e3c72; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .choice.right { background: #2e7d32; box-shadow: 0 5px 0 #1b5e20; }
  .choice.wrong { background: #c62828; box-shadow: 0 5px 0 #7f0000; }
  .q-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 1250px; }
  .q-wrap .q { font-size: 36px; font-weight: bold; text-align: center; }
  .q-wrap .choices { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
  .q-wrap .count { font-size: 22px; opacity: 0.8; }

  /* ΤΑΙΡΙΑΣΜΑ */
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 120px; width: 1250px; }
  .match .col { gap: 16px; }
  .pair { background: #fff; color: #1e3c72; box-shadow: 0 5px 0 rgba(0,0,0,0.3); font-size: 28px; padding: 16px 20px; text-align: left; min-height: 84px; }
  .pair.sel { outline: 6px solid #ffb347; }
  .pair.ok { background: #c8e6c9; cursor: default; }
  .pair.no { animation: shake 0.4s; background: #ffcdd2; }

  /* ΤΑΞΙΝΟΜΗΣΗ */
  .sort { display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .sort .item { background: #fff; color: #1e3c72; border-radius: 22px; padding: 26px 50px; font-size: 44px; font-weight: bold; display: flex; gap: 24px; align-items: center; box-shadow: 0 8px 0 rgba(0,0,0,0.3); }
  .sort .item .em { font-size: 90px; }
  .sort .bins { display: flex; gap: 40px; }
  .sort .bins { flex-wrap: wrap; justify-content: center; max-width: 1400px; }
  .sort .bins button { font-size: 32px; padding: 22px 34px; min-width: 300px; box-shadow: 0 6px 0 rgba(0,0,0,0.35); }
  .sort .item:empty, .sort .item span:empty { display: none; }
  .sort .count { font-size: 22px; opacity: 0.8; }

  /* ΔΥΑΔΙΚΟ: μετρητές, λάμπες, βραχιόλι */
  .meters { display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .meter-row { display: flex; gap: 20px; align-items: flex-start; }
  .meter { background: rgba(0,0,0,0.3); border-radius: 18px; padding: 16px 24px; text-align: center; }
  .meter h4 { font-size: 24px; margin-bottom: 10px; }
  .meter h4 small { font-weight: normal; opacity: 0.8; }
  .digits { display: flex; gap: 10px; justify-content: center; }
  .digit { width: 76px; height: 96px; background: #fff; color: #1e3c72; border-radius: 12px; font: bold 70px Consolas, monospace; display: flex; align-items: center; justify-content: center; }
  .digit.lead { opacity: 0.3; }
  .dcol { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 18px; opacity: 0.9; }
  .lamp small { font-size: 20px; opacity: 0.85; }
  .digit.flash { animation: flash 0.6s; }
  @keyframes flash { 0% { background: #ffb347; transform: scale(1.12); } 100% { background: #fff; transform: scale(1); } }
  .plus { font-size: 46px; padding: 16px 60px; }
  .explain { font-size: 24px; line-height: 1.4; max-width: 900px; min-height: 70px; text-align: center; }
  .explain b { color: #ffb347; }
  .numtable { border-collapse: collapse; font: bold 30px Consolas, monospace; background: rgba(0,0,0,0.3); border-radius: 14px; overflow: hidden; }
  .numtable th { font: bold 22px 'Segoe UI', sans-serif; padding: 8px 30px; background: rgba(0,0,0,0.3); }
  .numtable td { padding: 3px 30px; text-align: center; border-top: 1px solid rgba(255,255,255,0.12); }
  .numtable td:first-child { border-right: 3px solid rgba(255,255,255,0.5); }
  .numtable tr.new td { background: rgba(255,179,71,0.3); }
  .bits { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .bits .target { font-size: 40px; font-weight: bold; }
  .bits .target b { color: #ffb347; font-size: 60px; }
  .lamps { display: flex; gap: 26px; }
  .lamp { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; box-shadow: none; padding: 0; }
  .lamp .val { font-size: 34px; color: #ffb347; }
  .lamp .bit { font: bold 52px Consolas, monospace; }
  .bits .sum { font-size: 36px; min-height: 50px; }
  .bits .bin { font: bold 44px Consolas, monospace; letter-spacing: 6px; }
  .bracelet { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .steppers { display: flex; gap: 60px; }
  .stepper { display: flex; align-items: center; gap: 14px; font-size: 30px; }
  .stepper b { font-size: 54px; min-width: 80px; text-align: center; }
  .stepper button { font-size: 40px; padding: 4px 22px; }
  .conv { font: bold 48px Consolas, monospace; }
  .conv span { color: #ffb347; }
  .beads { position: relative; display: flex; gap: 10px; padding: 20px 30px; }
  .beads::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 6px; background: #8d6e63; border-radius: 3px; }
  .bead { width: 64px; height: 64px; border-radius: 50%; position: relative; border: 3px solid rgba(0,0,0,0.35); box-shadow: inset -8px -8px 0 rgba(0,0,0,0.15); }
  .legend { display: flex; gap: 34px; font-size: 26px; align-items: center; }
  .legend .bead { width: 40px; height: 40px; display: inline-block; vertical-align: middle; margin-right: 8px; }

  /* ΞΥΛΑΚΙΑ & ΚΑΛΑΘΙ */
  .sticks { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  .sticks .sum { font-size: 34px; font-weight: bold; min-width: 260px; }
  .sticks-bottom, .sticks-help { display: flex; gap: 30px; align-items: center; }
  .sticks .target { font-size: 40px; font-weight: bold; }
  .sticks .target b { color: #ffb347; font-size: 60px; }
  .sticks-row { display: flex; gap: 40px; align-items: stretch; }
  .stick-src, .basket { border-radius: 24px; padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
  .stick-src { background: rgba(0,0,0,0.25); }
  .basket { width: 620px; border: 5px dashed #ffb347; background: rgba(255,179,71,0.12); }
  .stick-src h3, .basket h3 { font-size: 24px; }
  .bundles { display: flex; gap: 20px; align-items: flex-end; min-height: 150px; }
  .bundle { display: flex; flex-direction: column; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); border-radius: 14px; padding: 10px 12px; cursor: grab; touch-action: none; position: relative; }
  .bundle .lbl { font-size: 22px; } .bundle .lbl b { color: #ffb347; font-size: 28px; }
  .bundle.dragging { z-index: 20; opacity: 0.9; cursor: grabbing; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .bundle.gone { visibility: hidden; }
  .binrow { display: flex; gap: 18px; }
  .binrow .bc { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 4px 18px; }
  .binrow .bc small { font-size: 20px; opacity: 0.85; } .binrow .bc b { font: bold 44px Consolas, monospace; }
  .sticks .help { font-size: 22px; max-width: 1150px; }

  /* ΝΤΥΣΕ ΤΟΝ ΗΡΩΝΑ */
  .dress-left { width: 520px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .dress-left .weather { font-size: 110px; line-height: 1.1; }
  .dress-left .today { font-size: 34px; font-weight: bold; }
  .dress-left .heron { font-size: 90px; background: rgba(0,0,0,0.25); border-radius: 20px; padding: 8px 26px; min-height: 120px; }
  .dress-right { width: 820px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .clothes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
  .cloth { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.14); box-shadow: 0 5px 0 rgba(0,0,0,0.3); font-size: 26px; padding: 10px 16px; }
  .cloth span { font-size: 50px; } .cloth.on { background: #43a047; box-shadow: 0 5px 0 #1b5e20; outline: 4px solid #b9f6ca; }
  .rules { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .rule { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 8px 14px; font-size: 21px; }
  .rule.hit { background: #fff8e1; color: #3e2723; }
  .count { font-size: 22px; opacity: 0.8; }

function caesarStep(ch, shift, dec) {
  const p = GR.indexOf(ch) + 1;
  const raw = dec ? p - shift : p + shift;
  const q = raw > 24 ? raw - 24 : raw < 1 ? raw + 24 : raw;
  const note = raw > 24 ? ` > 24 → ${raw} − 24 = ${q}` : raw < 1 ? ` < 1 → ${raw} + 24 = ${q}` : '';
  return { p, raw, q, out: GR[q - 1], note };
}

const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

let gradeIdx = Math.max(0, BOOKS.findIndex(b => b.hash === location.hash));
let chapterIdx = 0, lessonIdx = 0, actIdx = 0;
const book = () => BOOKS[gradeIdx].chapters;
let runId = 0; // αλλάζει σε κάθε νέα δραστηριότητα ώστε να σταματούν τα παλιά animations
const done = new Set(); // 'κεφ-μάθημα-δραστηριότητα' που ολοκληρώθηκαν (μόνο για αυτή τη χρήση)
const key = (c, l, a) => `${gradeIdx}-${c}-${l}-${a}`;

function say(text, kind = '') { const m = $('msg'); m.innerHTML = text; m.className = 'msg ' + kind; }
function complete(text) {
  done.add(key(chapterIdx, lessonIdx, actIdx));
  const act = book()[chapterIdx].lessons[lessonIdx].acts[actIdx];
  if (act && act.explain && !$('area').querySelector('.why-box')) {
    const w = el('div', 'why-box', `<span>💡 ${act.explain}</span>`);
    const x = el('button', 'secondary', '✕');
    x.onclick = () => w.remove();
    w.appendChild(x);
    $('area').appendChild(w);
  }
  say(text || '🎉 Μπράβο!', 'good');
  $('nextBtn').classList.add('pulse');
  renderPips();
}

// ============================================================================
// ΑΡΧΙΚΗ
// ============================================================================
function renderHome() {
  const grades = $('grades');
  grades.innerHTML = '';
  BOOKS.forEach((b, i) => {
    const t = el('button', 'tab' + (i === gradeIdx ? ' on' : ''), b.grade);
    t.onclick = () => { gradeIdx = i; chapterIdx = 0; history.replaceState(null, '', b.hash); renderHome(); };
    grades.appendChild(t);
  });
  const tabs = $('tabs');
  tabs.innerHTML = '';
  book().forEach((ch, i) => {
    const b = el('button', 'tab' + (i === chapterIdx ? ' on' : '') + (ch.lessons.length ? '' : ' soon'), ch.tab);
    b.onclick = () => { chapterIdx = i; renderHome(); };
    tabs.appendChild(b);
  });
  const ch = book()[chapterIdx];
  $('chapterTitle').textContent = ch.title;
  const box = $('lessons');
  box.innerHTML = '';
  if (!ch.lessons.length) {
    box.appendChild(el('div', 'soon-box', '🚧 Σύντομα!<br>Αυτό το κεφάλαιο ετοιμάζεται.'));
    box.style.display = 'block';
    return;
  }
  box.style.display = '';
  ch.lessons.forEach((les, i) => {
    const n = les.acts.filter((_, a) => done.has(key(chapterIdx, i, a))).length;
    const b = el('button', 'lesson',
      `<div class="ico">${les.icon}</div><div><div class="ttl">${i + 1}. ${les.title}</div><div class="sub">${les.sub}</div>` +
      `<div class="prog">${n ? '✔ ' + n + ' / ' + les.acts.length : les.acts.length + ' δραστηριότητες'}</div></div>`);
    b.onclick = () => openLesson(i);
    box.appendChild(b);
  });
}

function showScreen(id) {
  for (const s of document.querySelectorAll('.screen')) s.classList.remove('active');
  $(id).classList.add('active');
}

function openLesson(i) {
  lessonIdx = i;
  actIdx = 0;
  showScreen('actScreen');
  renderAct();
}

function renderPips() {
  const les = book()[chapterIdx].lessons[lessonIdx];
  const pips = $('pips');
  pips.innerHTML = '';
  les.acts.forEach((_, a) => {
    const p = el('div', 'pip' + (done.has(key(chapterIdx, lessonIdx, a)) ? ' done' : '') + (a === actIdx ? ' cur' : ''));
    pips.appendChild(p);
  });
}

function renderFinish(les) {
  const n = les.acts.filter((_, a) => done.has(key(chapterIdx, lessonIdx, a))).length;
  $('kind').textContent = '🏁 Τέλος';
  $('instr').textContent = 'Τελειώσαμε το μάθημα!';
  $('guide').textContent = '';
  $('ref').textContent = '';
  $('prevBtn').disabled = false;
  $('nextBtn').textContent = '← Μαθήματα';
  $('nextBtn').classList.remove('pulse');
  say('');
  const area = $('area');
  area.innerHTML = '';
  const box = el('div', 'finish', `<div class="big">🏁</div><div class="t">Τέλος μαθήματος: ${les.title}</div><div>Ολοκληρώσατε <b>${n}</b> από <b>${les.acts.length}</b> δραστηριότητες.</div>`);
  const row = el('div', 'controls');
  const again = el('button', 'secondary', '🔁 Από την αρχή');
  again.onclick = () => { actIdx = 0; renderAct(); };
  row.appendChild(again);
  const lessons = book()[chapterIdx].lessons;
  if (lessonIdx < lessons.length - 1) {
    const nx = el('button', '', 'Επόμενο μάθημα ▶');
    nx.onclick = () => openLesson(lessonIdx + 1);
    row.appendChild(nx);
  }
  box.appendChild(row);
  area.appendChild(box);
  renderPips();
}

function renderAct() {
  runId++;
  const les = book()[chapterIdx].lessons[lessonIdx];
  $('lessonTitle').textContent = `${les.icon} ${lessonIdx + 1}. ${les.title}`;
  if (actIdx >= les.acts.length) return renderFinish(les);
  const act = les.acts[actIdx];
  $('lessonTitle').textContent = `${les.icon} ${lessonIdx + 1}. ${les.title}`;
  $('kind').textContent = KIND_NAMES[act.type];
  $('instr').textContent = act.text;
  $('guide').textContent = '❔ ' + (act.guide || GUIDE[act.type]);
  $('ref').textContent = act.ref ? '📖 ' + act.ref : '';
  $('prevBtn').disabled = actIdx === 0;
  $('nextBtn').textContent = actIdx === les.acts.length - 1 ? 'Τέλος 🏁' : 'Επόμενο ▶';
  $('nextBtn').classList.remove('pulse');
  say('');
  const area = $('area');
  area.innerHTML = '';
  RENDER[act.type](act, area);
  renderPips();
}

// ΠΛΕΓΜΑ: προσομοίωση & σχεδίαση
// ============================================================================
const MOVES = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
const HEAD = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // 0=πάνω 1=δεξιά 2=κάτω 3=αριστερά
const GLYPH = { U: '↑', D: '↓', L: '←', R: '→', F: '⬆', B: '⬇', l: '↶', r: '↷' };
const CMD_NAME = { U: 'Κινήσου πάνω', D: 'Κινήσου κάτω', L: 'Κινήσου αριστερά', R: 'Κινήσου δεξιά',
  F: '1 βήμα μπροστά', B: '1 βήμα πίσω', l: 'Στρίψε αριστερά', r: 'Στρίψε δεξιά' };

// 'R6' → ['R','R','R','R','R','R']
const expand = prog => prog.flatMap(t => (typeof t === 'object' ? Array.from({ length: t.rep }, () => expand(t.body)).flat() : Array(+(t.slice(1) || 1)).fill(t[0])));

// εκτελεί το πρόγραμμα: επιστρέφει όλες τις θέσεις (και την αρχή) και πού «τράκαρε», αν τράκαρε
function simulate(g, prog) {
  let [x, y] = g.start, h = g.heading || 0;
  const path = [{ x, y, h }];
  const blocked = new Set((g.obstacles || []).map(([a, b]) => a + ',' + b));
  for (const c of expand(prog)) {
    if (c === 'l') h = (h + 3) % 4;
    else if (c === 'r') h = (h + 1) % 4;
    else {
      const [dx, dy] = MOVES[c] || (c === 'F' ? HEAD[h] : HEAD[(h + 2) % 4]);
      x += dx; y += dy;
      if (x < 0 || y < 0 || x >= g.cols || y >= g.rows) return { path, crash: 'wall' };
      if (blocked.has(x + ',' + y)) { path.push({ x, y, h }); return { path, crash: 'obstacle' }; }
    }
    path.push({ x, y, h });
  }
  return { path, crash: null };
}

function blockEl(token, robot) {
  if (typeof token === 'object') {
    const r = el('span', 'rep');
    token.body.forEach(t => r.appendChild(blockEl(t, robot)));
    r.appendChild(el('span', 'rep-end', `↻<span class="n">${token.rep}</span>`));
    return r;
  }
  const n = token.slice(1);
  return el('span', 'blk' + (robot ? ' robot' : ''), GLYPH[token[0]] + (n ? `<span class="n">${n}</span>` : ''));
}
function stripEl(prog, robot) {
  const s = el('div', 'strip');
  prog.forEach(t => s.appendChild(blockEl(t, robot)));
  return s;
}

// σχέδια χωρίς αρχεία εικόνας: λουλούδι με χρώμα και πασχαλίτσα που κοιτάει πάνω
function flowerSVG(color, size) {
  const petals = [0, 60, 120, 180, 240, 300].map(a => `<ellipse cx="50" cy="24" rx="15" ry="24" fill="${color}" stroke="#90a4ae" stroke-width="2" transform="rotate(${a} 50 50)"/>`).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">${petals}<circle cx="50" cy="50" r="14" fill="#fdd835"/></svg>`;
}
function ladybugSVG(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><circle cx="50" cy="22" r="16" fill="#212121"/>
    <ellipse cx="50" cy="58" rx="34" ry="36" fill="#e53935" stroke="#212121" stroke-width="4"/><line x1="50" y1="24" x2="50" y2="94" stroke="#212121" stroke-width="4"/>
    <circle cx="34" cy="50" r="7" fill="#212121"/><circle cx="66" cy="50" r="7" fill="#212121"/><circle cx="36" cy="74" r="6" fill="#212121"/><circle cx="64" cy="74" r="6" fill="#212121"/>
    <circle cx="44" cy="17" r="4" fill="#fff"/><circle cx="56" cy="17" r="4" fill="#fff"/></svg>`;
}
const itemHTML = (it, cs) => it.startsWith('flower:') ? flowerSVG(it.slice(7), cs * 0.8) : `<span class="it" style="font-size:${cs * 0.62}px">${it}</span>`;

function buildGrid(g, maxW, maxH, opts = {}) {
  const cs = Math.floor(Math.min(maxW / g.cols, maxH / g.rows, 150));
  const wrap = el('div', 'grid' + (g.garden ? ' garden' : ''));
  wrap.style.width = g.cols * cs + 8 + 'px';
  wrap.style.height = g.rows * cs + 8 + 'px';
  const cells = {};
  for (let y = 0; y < g.rows; y++) for (let x = 0; x < g.cols; x++) {
    const c = el('div', 'cell');
    Object.assign(c.style, { left: x * cs + 'px', top: y * cs + 'px', width: cs + 'px', height: cs + 'px' });
    cells[x + ',' + y] = c;
    wrap.appendChild(c);
  }
  for (const [x, y, it] of g.decor || []) cells[x + ',' + y].innerHTML = itemHTML(it, cs);
  for (const [x, y] of g.obstacles || []) { cells[x + ',' + y].classList.add('obstacle'); cells[x + ',' + y].innerHTML = itemHTML(g.wall || REED, cs); }
  for (const [x, y, it, cls] of g.goals || []) { if (cls) cells[x + ',' + y].classList.add(cls); if (it) cells[x + ',' + y].innerHTML = itemHTML(it, cs); }

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'trail');
  svg.setAttribute('width', g.cols * cs);
  svg.setAttribute('height', g.rows * cs);
  wrap.appendChild(svg);

  const sprite = el('div', 'sprite');
  Object.assign(sprite.style, { width: cs + 'px', height: cs + 'px' });
  sprite.innerHTML = g.actor ? `<span style="font-size:${cs * 0.7}px;line-height:1">${g.actor}</span>` : ladybugSVG(cs * 0.85);
  wrap.appendChild(sprite);

  const api = {
    el: wrap, cells, cs,
    put(p) {
      sprite.style.left = p.x * cs + 'px';
      sprite.style.top = p.y * cs + 'px';
      if (!g.actor) sprite.style.transform = `rotate(${(p.rotation ?? p.h * 90)}deg)`;
    },
    // κόκκινη διακεκομμένη γραμμή όπως στο βιβλίο, με βελάκι στο τέλος
    trail(points) {
      const c = p => `${p.x * cs + cs / 2},${p.y * cs + cs / 2}`;
      const pts = points.filter((p, i) => i === 0 || p.x !== points[i - 1].x || p.y !== points[i - 1].y);
      svg.innerHTML = pts.length < 2 ? '' :
        `<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c62828"/></marker></defs>
         <polyline points="${pts.map(c).join(' ')}" fill="none" stroke="#c62828" stroke-width="${cs / 16}" stroke-dasharray="${cs / 14} ${cs / 10}" stroke-linecap="round" marker-end="url(#ah)"/>`;
    },
    crash() { sprite.classList.remove('crash'); void sprite.offsetWidth; sprite.classList.add('crash'); },
  };
  let rot = (g.heading || 0) * 90;
  api.reset = () => { rot = (g.heading || 0) * 90; api.put({ x: g.start[0], y: g.start[1], rotation: rot }); svg.innerHTML = ''; };
  // κινεί βήμα-βήμα και ζωγραφίζει το μονοπάτι (η περιστροφή μετριέται συνεχόμενα για να μη «γυρίζει ανάποδα»)
  api.animate = async (path, my) => {
    for (let i = 1; i < path.length; i++) {
      if (my !== runId) return false;
      const d = ((path[i].h - path[i - 1].h) + 4) % 4;
      rot += d === 1 ? 90 : d === 3 ? -90 : 0;
      api.put({ ...path[i], rotation: rot });
      api.trail(path.slice(0, i + 1));
      await sleep(450);
    }
    return my === runId;
  };
  api.reset();
  return api;
}

const RENDER = {};

RENDER.info = (act, area) => {
  const box = el('div', 'info');
  for (const [em, html, prog] of act.cards) {
    const c = el('div', 'card', `<span class="em">${em}</span><span>${html}</span>`);

    box.appendChild(c);

};

// ---- Σειρά βημάτων: `before` = ζευγάρια [α, β] όπου το α πρέπει να γίνει πριν από το β
function orderRules(act) {
  return act.before === 'chain' ? act.steps.slice(1).map((_, i) => [i, i + 1]) : act.before;
}
function firstMistake(rules, order) {
  const pos = [];
  order.forEach((s, i) => { pos[s] = i; });
  return rules.find(([a, b]) => pos[a] > pos[b]) || null;
}
RENDER.order = (act, area) => {
  const rules = orderRules(act);
  const n = act.steps.length;
  let pool;
  do { pool = shuffle([...Array(n).keys()]); } while (firstMistake(rules, pool) === null);
  const placed = Array(n).fill(null);
  let solved = false;
  area.style.setProperty('--fs', n > 5 ? '24px' : '28px');
  area.style.setProperty('--gap', n > 5 ? '8px' : '14px');
  const wrap = el('div', 'order');
  const left = el('div', 'col', '<h3>Η σειρά μου</h3>');
  const right = el('div', 'col', '<h3>Πάτησε ένα βήμα για να το βάλεις στη σειρά</h3>');
  const slots = el('div', 'list'), poolEl = el('div', 'list');
  left.appendChild(slots); right.appendChild(poolEl);
  wrap.append(left, right);
  area.appendChild(wrap);
  const stepEl = s => { const c = el('div', 'step', `<span class="em">${act.steps[s][0]}</span><span></span>`); c.lastChild.textContent = act.steps[s][1]; return c; };

  function draw(wrong) {
    slots.innerHTML = '';
    poolEl.innerHTML = '';
    placed.forEach((s, i) => {
      const slot = el('div', 'slot', `<div class="num">${i + 1}</div>`);
      if (s !== null) {
        const c = stepEl(s);
        if (wrong && wrong.includes(s)) c.classList.add('wrong');
        if (solved) c.classList.add('right');
        c.onclick = () => { if (solved) return; placed[i] = null; say(''); draw(); };
        slot.appendChild(c);
      }
      slots.appendChild(slot);
    });
    for (const s of pool) {
      const c = stepEl(s);
      if (placed.includes(s)) c.classList.add('hidden');
      else c.onclick = () => { placed[placed.indexOf(null)] = s; say(''); draw(); check(); };
      poolEl.appendChild(c);
    }
  }
  function check() {
    if (placed.includes(null)) return;
    const m = firstMistake(rules, placed);
    if (m) {
      const t = i => act.steps[i][1].replace(/\.$/, '');
      say(`Όχι ακόμα! Το «${t(m[0])}» πρέπει να γίνει <b>πριν</b> από το «${t(m[1])}». Πάτησε ένα βήμα για να το βγάλεις.`, 'bad');
      draw(m);
    } else {
      solved = true;
      draw();
      complete('🎉 Μπράβο! Τα βήματα είναι στη σωστή σειρά!');
    }
  }
  draw();
};

// ---- Πού θα φτάσει; (πατάνε το τετράγωνο)
RENDER.trace = (act, area) => {
  const my = runId;
  const grid = buildGrid(act.grid, 640, 560);
  const robot = act.mode === 'robot';
  const side = el('div', 'side');
  const box = el('div', 'prog-box', '<h4>Το πρόγραμμα:</h4>');
  box.appendChild(stripEl(act.program, robot));
  const show = el('button', 'secondary', '👀 Δείξε μου');
  side.append(box, show);
  area.append(grid.el, side);
  const { path } = simulate(act.grid, act.program);
  const end = path[path.length - 1];
  let busy = false;
  const play = async () => { busy = true; grid.reset(); await grid.animate(path, my); busy = false; };
  show.onclick = async () => { if (busy) return; await play(); if (my === runId) grid.cells[end.x + ',' + end.y].classList.add('hit'); };
  for (const [k, c] of Object.entries(grid.cells)) {
    c.classList.add('tap');
    c.onclick = async () => {
      if (busy || done.has(key(chapterIdx, lessonIdx, actIdx))) return;
      if (k === end.x + ',' + end.y) {
        c.classList.add('hit');
        await play();
        if (my === runId) complete('🎉 Σωστά! Εκεί θα φτάσει!');
      } else {
        c.classList.add('miss');
        setTimeout(() => c.classList.remove('miss'), 700);
        say('Όχι εκεί! Ακολούθησε τα βελάκια ένα-ένα με το δάχτυλο.', 'bad');
      }
    };
  }
};

// ---- Ποιο πρόγραμμα ταιριάζει με το μονοπάτι;
const svgClear = grid => { grid.el.querySelector('.trail').innerHTML = ''; };
RENDER.pick = (act, area) => {
  const grid = buildGrid(act.grid, 640, 560);
  const { path } = simulate(act.grid, act.path);
  grid.trail(path);
  const list = el('div', 'choices');
  const answer = act.options.findIndex(o => expand(o).join() === expand(act.path).join());
  if (act.crumbs) { svgClear(grid); for (const q of path.slice(1, -1)) grid.cells[q.x + ',' + q.y].innerHTML = itemHTML(act.crumbs, grid.cs * 0.6); }
  act.options.forEach((o, i) => {
    const b = el('button', 'choice', `<span class="letter">${'ΑΒΓΔ'[i]}</span>`);
    b.appendChild(stripEl(o));
    b.onclick = () => {
      if (done.has(key(chapterIdx, lessonIdx, actIdx))) return;
      if (i === answer) { b.classList.add('right'); complete('🎉 Σωστά! Αυτό το πρόγραμμα ταιριάζει με το μονοπάτι!'); }
      else { b.classList.add('wrong'); say('Όχι αυτό. Ακολούθησε τα βελάκια πάνω στο πλέγμα.', 'bad'); }
    };
    list.appendChild(b);
  });
  area.append(grid.el, list);
};

// ---- Φτιάχνω πρόγραμμα (βέλη ή ρομπότ με στροφές)
RENDER.program = (act, area) => {
  const g = act.grid;
  const robot = act.mode === 'robot';
  const grid = buildGrid(g, 760, 560);
  const prog = [];
  let loopN = 2; // μόνο όταν act.loop: όλο το πρόγραμμα μπαίνει σε «Επανάλαβε loopN φορές»
  const full = () => (act.loop ? [{ rep: loopN, body: prog }] : prog);
  const found = new Set();
  const need = act.paths || 1;
  const max = act.slots || 10;
  let busy = false;

  const side = el('div', 'side');
  const pal = el('div', 'palette' + (robot ? ' robot' : ''));
  for (const c of robot ? ['F', 'B', 'l', 'r'] : ['U', 'D', 'L', 'R']) {
    const b = el('button', '', `<span class="g">${GLYPH[c]}</span>${CMD_NAME[c]}`);
    b.onclick = () => { if (busy || prog.length >= max) return; prog.push(c); grid.reset(); say(''); draw(); };
    pal.appendChild(b);
  }
  const box = el('div', 'prog-box', `<h4>Το πρόγραμμά μου${act.slots ? ` (${act.slots} κουτάκια)` : ''} — πάτησε μια εντολή για να τη σβήσεις</h4>`);
  const strip = el('div', 'strip');
  box.appendChild(strip);
  const ctrls = el('div', 'controls');
  const run = el('button', '', '▶ Εκτέλεση');
  const clear = el('button', 'secondary', '🗑 Από την αρχή');
  ctrls.append(run, clear);
  if (act.loop) {
    const minus = el('button', 'secondary', '−'), plus = el('button', 'secondary', '+');
    const lbl = el('span', 'found', '');
    const upd = () => { lbl.textContent = `↻ Επανάλαβε ${loopN} φορές`; };
    minus.onclick = () => { if (busy || loopN <= 1) return; loopN--; upd(); grid.reset(); draw(); };
    plus.onclick = () => { if (busy || loopN >= 9) return; loopN++; upd(); grid.reset(); draw(); };
    upd();
    const row = el('div', 'controls loopctl');
    row.append(minus, lbl, plus);
    box.appendChild(row);
  }
  const foundEl = el('div', 'found');
  side.append(pal, box, ctrls, foundEl);
  area.append(grid.el, side);

  function draw() {
    strip.innerHTML = '';
    const into = act.loop ? el('span', 'rep') : strip;
    prog.forEach((c, i) => {
      const b = blockEl(c, robot);
      b.onclick = () => { if (busy) return; prog.splice(i, 1); grid.reset(); draw(); };
      into.appendChild(b);
    });
    for (let i = prog.length; i < (act.slots || 0); i++) into.appendChild(el('span', 'slotbox'));
    if (act.loop) { into.appendChild(el('span', 'rep-end', `↻<span class="n">${loopN}</span>`)); strip.appendChild(into); }
    foundEl.textContent = need > 1 ? `Μονοπάτια που βρήκες: ${found.size} / ${need}` : '';
  }
  clear.onclick = () => { if (busy) return; prog.length = 0; grid.reset(); say(''); draw(); };
  run.onclick = async () => {
    if (busy || !prog.length) return;
    const my = runId;
    busy = true;
    grid.reset();
    const res = simulate(g, full());
    await grid.animate(res.path, my);
    busy = false;
    if (my !== runId) return;
    if (res.crash) {
      grid.crash();
      return say(res.crash === 'wall' ? 'Ωχ! Βγήκε έξω από το πλέγμα. Διόρθωσε το πρόγραμμα!' : `Ωχ! ${g.hit || 'Πέρασε από τα καλάμια'}! Βρες άλλο μονοπάτι.`, 'bad');
    }
    // οι στόχοι πρέπει να επισκεφθούν με τη σειρά, και το πρόγραμμα να τελειώνει στον τελευταίο
    let gi = 0;
    for (const p of res.path) if (gi < g.goals.length && p.x === g.goals[gi][0] && p.y === g.goals[gi][1]) gi++;
    const last = res.path[res.path.length - 1], goal = g.goals[g.goals.length - 1];
    if (gi < g.goals.length || last.x !== goal[0] || last.y !== goal[1]) {
      return say(g.goals.length > 1 && gi === 0 ? 'Πρώτα πρέπει να περάσεις από την κίτρινη μαργαρίτα!' : 'Δεν έφτασε ακόμα στον στόχο. Πρόσθεσε ή άλλαξε εντολές!', 'bad');
    }
    const k = expand(full()).join('');
    if (act.differentFrom && k === expand(act.differentFrom).join('')) return say('Αυτή είναι η διαδρομή του βιβλίου! Βρείτε μια <b>άλλη</b> διαδρομή.', 'bad');
    if (found.has(k)) return say('Αυτό το μονοπάτι το βρήκες ήδη! Βρες ένα <b>άλλο</b>.', 'bad');
    found.add(k);
    draw();
    if (found.size >= need) complete(need > 1 ? '🎉 Μπράβο! Βρήκες ' + need + ' διαφορετικά μονοπάτια!' : '🎉 Μπράβο! Το πρόγραμμά σου δουλεύει!');
    else say('👏 Σωστά! Τώρα βρες κι άλλο μονοπάτι (με διαφορετικό πρόγραμμα).', 'good');
  };
  draw();
};

// ---- Ερωτήσεις (π.χ. «ίδιο αποτέλεσμα, λιγότερες εντολές»)

      };

// ---- Ταίριασμα: πατάς αριστερά, μετά δεξιά
RENDER.match = (act, area) => {
  const wrap = el('div', 'match');
  const L = el('div', 'col'), R = el('div', 'col');
  wrap.append(L, R);
  area.appendChild(wrap);
  let sel = null, left = act.pairs.length;
  const fill = (b, v) => (Array.isArray(v) ? b.appendChild(stripEl(v)) : (b.textContent = v));
  const lefts = act.pairs.map((p, i) => { const b = el('button', 'pair'); fill(b, p[0]); b.dataset.i = i; L.appendChild(b); return b; });
  shuffle(act.pairs.map((p, i) => i)).forEach(i => {
    const b = el('button', 'pair');
    fill(b, act.pairs[i][1]);
    b.onclick = () => {
      if (b.classList.contains('ok')) return;
      if (!sel) return say('Πάτησε πρώτα κάτι από την αριστερή στήλη.', 'bad');
      if (+sel.dataset.i === i) {
        sel.classList.replace('sel', 'ok'); b.classList.add('ok'); sel = null;
        if (--left === 0) complete('🎉 Μπράβο! Τα ταίριαξες όλα!'); else say('✅ Σωστό ζευγάρι!', 'good');
      } else {
        b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
        say('Δεν ταιριάζουν. Δοκίμασε άλλο!', 'bad');
      }
    };
    R.appendChild(b);
  });
  lefts.forEach(b => b.onclick = () => {
    if (b.classList.contains('ok')) return;
    if (sel) sel.classList.remove('sel');
    sel = b; b.classList.add('sel'); say('');
  });
};

// ---- Ταξινόμηση σε 2 ομάδες, ένα-ένα
RENDER.sort = (act, area) => {
  const items = shuffle([...act.items]);
  let i = 0;
  const wrap = el('div', 'sort');
  area.appendChild(wrap);
  function show() {
    const [em, text, bin] = items[i];
    wrap.innerHTML = '';
    wrap.appendChild(el('div', 'count', `${i + 1} από ${items.length}`));
    const card = el('div', 'item', `<span class="em">${em}</span><span></span>`);
    card.lastChild.textContent = text;
    wrap.appendChild(card);
    const bins = el('div', 'bins');
    act.bins.forEach((label, b) => {
      const btn = el('button', '', label);
      const color = (act.colors || ['#1565c0', '#6a1b9a', '#00838f', '#ef6c00'])[b];
      btn.style.background = color;
      // σκούρα γράμματα πάνω σε ανοιχτό χρώμα (π.χ. κίτρινη ομάδα)
      if (parseInt(color.slice(1, 3), 16) * 0.3 + parseInt(color.slice(3, 5), 16) * 0.59 + parseInt(color.slice(5, 7), 16) * 0.11 > 170) btn.style.color = '#3a2400';
      btn.onclick = () => {
        if (b !== bin) return say('Σκέψου ξανά! 🤔', 'bad');
        const why = items[i][3] ? ' ' + items[i][3] : '';
        if (++i < items.length) { say('✅ Σωστά!' + why, 'good'); show(); }
        else { complete(act.doneMsg || '🎉 Μπράβο! Τα ταξινόμησες όλα!'); if (act.result) wrap.innerHTML = act.result; }
      };
      bins.appendChild(btn);
    });
    wrap.appendChild(bins);
  }
  show();
};

// ---- Ενώνω τις τελείες με τη σειρά
RENDER.dots = (act, area) => {
  const NS = 'http://www.w3.org/2000/svg';
  const box = el('div', 'dots');
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  box.appendChild(svg);
  const reveal = el('div', 'reveal', '<div style="opacity:.8">Ξεκίνα από το 1!</div>');
  area.append(box, reveal);
  const lines = document.createElementNS(NS, 'g');
  svg.appendChild(lines);
  let next = 0;
  const line = (a, b) => {
    const l = document.createElementNS(NS, 'line');
    Object.entries({ x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: '#1976d2', 'stroke-width': 1.4, 'stroke-linecap': 'round' }).forEach(([k, v]) => l.setAttribute(k, v));
    lines.appendChild(l);
  };
  act.points.forEach((p, i) => {
    const g = document.createElementNS(NS, 'g');
    g.style.cursor = 'pointer';
    g.innerHTML = `<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="transparent"/><circle cx="${p[0]}" cy="${p[1]}" r="1.8" fill="#212121"/>
      <text x="${p[0] + 2.6}" y="${p[1] - 2.6}" font-size="5" fill="#212121" font-family="Segoe UI, sans-serif">${i + 1}</text>`;
    g.onclick = () => {
      if (next >= act.points.length) return;
      if (i !== next) return say(`Όχι! Μετά το ${next} έρχεται το ${next + 1}.`, 'bad');
      if (i > 0) line(act.points[i - 1], p);
      g.querySelectorAll('circle')[1].setAttribute('fill', '#1976d2');
      next++;
      say('');
      if (next === act.points.length) {
        if (act.close) line(p, act.points[0]);
        const [em, title, q] = act.reveal;
        reveal.innerHTML = `<div class="big">${em}</div><div><b>${title}</b></div><div style="opacity:.9">${q}</div>`;
        complete('🎉 Μπράβο! Ακολούθησες τη σωστή σειρά!');
      }
    };
    svg.appendChild(g);
  });
};

// ---- Ντύσε τον Ήρωνα: κανόνες «Αν [καιρός], τότε [ρούχα]» (Γ΄ έκδ. 7.0 σελ. 11)
const WEATHER = { rain: ['🌧️', 'βρέχει'], cold: ['🥶', 'κάνει κρύο'], wind: ['🌬️', 'έχει αέρα'], sun: ['☀️', 'έχει ήλιο'] };
const CLOTHES = { umbrella: ['☂️', 'Ομπρέλα'], raincoat: ['🥼', 'Αδιάβροχο'], scarf: ['🧣', 'Κασκόλ'], hat: ['🧶', 'Σκούφος'], windbreaker: ['🧥', 'Αντιανεμικό'], glasses: ['🕶️', 'Γυαλιά ηλίου'] };
const DRESS_RULES = {
  rain: { any: ['umbrella', 'raincoat'], text: 'Αν <b>βρέχει</b>, τότε πάρε ομπρέλα ή αδιάβροχο.' },
  cold: { all: ['scarf', 'hat'], text: 'Αν <b>κάνει κρύο</b>, τότε φόρεσε κασκόλ και σκούφο.' },
  wind: { all: ['windbreaker'], text: 'Αν <b>έχει αέρα</b>, τότε φόρεσε αντιανεμικό.' },
  sun: { all: ['glasses'], text: 'Αν <b>έχει ήλιο</b>, τότε βάλε γυαλιά ηλίου.' },
};
RENDER.dress = (act, area) => {
  let ri = 0, solved = false;
  const chosen = new Set();
  const left = el('div', 'dress-left'), right = el('div', 'dress-right');
  area.append(left, right);
  function draw() {
    const w = act.rounds[ri];
    left.innerHTML = `<div class="count">Καιρός ${ri + 1} από ${act.rounds.length}</div><div class="weather">${w.map(k => WEATHER[k][0]).join(' ')}</div>` +
      `<div class="today">Σήμερα ${w.map(k => WEATHER[k][1]).join(' και ')}!</div><div class="heron">🧒${[...chosen].map(c => CLOTHES[c][0]).join('')}</div>`;
    right.innerHTML = '';
    const grid = el('div', 'clothes');
    for (const [k, [em, name]] of Object.entries(CLOTHES)) {
      const b = el('button', 'cloth' + (chosen.has(k) ? ' on' : ''), `<span>${em}</span>${name}`);
      b.onclick = () => { if (solved) return; chosen.has(k) ? chosen.delete(k) : chosen.add(k); say(''); draw(); };
      grid.appendChild(b);
    }
    const rules = el('div', 'rules');
    for (const [k, r] of Object.entries(DRESS_RULES)) rules.appendChild(el('div', 'rule' + (solved && w.includes(k) ? ' hit' : ''), r.text));
    right.append(grid, rules);
    if (!solved) { const b = el('button', '', '✔ Έλεγχος'); b.onclick = check; right.appendChild(b); }
    else if (ri < act.rounds.length - 1) { const b = el('button', '', 'Επόμενος καιρός ▶'); b.onclick = () => { ri++; chosen.clear(); solved = false; say(''); draw(); }; right.appendChild(b); }
  }
  function check() {
    const w = act.rounds[ri];
    for (const k of w) {
      const r = DRESS_RULES[k];
      if (!(r.any ? r.any.some(c => chosen.has(c)) : r.all.every(c => chosen.has(c)))) return say('Κάτι ξέχασες! ' + r.text, 'bad');
    }
    const needed = new Set(w.flatMap(k => DRESS_RULES[k].any || DRESS_RULES[k].all));
    const extra = [...chosen].find(c => !needed.has(c));
    if (extra) return say(`Γιατί «${CLOTHES[extra][1]}»; Η συνθήκη του κανόνα του δεν ισχύει σήμερα!`, 'bad');
    solved = true;
    draw();
    if (ri === act.rounds.length - 1) complete('🎉 Μπράβο! Ο Ήρωνας είναι έτοιμος για κάθε καιρό!');
    else say('✅ Σωστά! Έλεγξες τις συνθήκες και πήρες τη σωστή απόφαση.', 'good');
  }
  draw();
};

// ---- Σχεδιάγραμμα απόφασης: λογική έκφραση στον ρόμβο, λύση για «Αληθής» και «Ψευδής» (Γ΄ έκδ. v09 σελ. 16–18)
RENDER.decision = (act, area) => {
  let pi = 0;
  const wrap = el('div', 'decision');
  area.appendChild(wrap);
  function show() {
    const p = act.problems[pi];
    const slots = { yes: null, no: null };
    let sel = null;
    wrap.innerHTML = `<div class="count">Πρόβλημα ${pi + 1} από ${act.problems.length}</div><div class="dbox">Πρόβλημα: «${p.problem}»</div>` +
      `<div class="arrow">⬇</div><div class="diamond"><span>${p.expr};</span></div>`;
    const branches = el('div', 'branches');
    const slotEl = {};
    for (const [k, label] of [['yes', '⬅ Αληθής ✅'], ['no', '❌ Ψευδής ➡']]) {
      const col = el('div', 'branch', `<div class="blabel ${k}">${label}</div>`);
      const sl = el('button', 'dslot', '…');
      sl.onclick = () => place(k);
      col.appendChild(sl);
      branches.appendChild(col);
      slotEl[k] = sl;
    }
    const cards = el('div', 'dcards');
    const cardEl = {};
    for (const k of shuffle(['yes', 'no'])) {
      const c = el('button', 'dcard');
      c.textContent = p[k];
      c.onclick = () => { if (c.classList.contains('used')) return; sel = k; for (const x of Object.values(cardEl)) x.classList.remove('sel'); c.classList.add('sel'); say(''); };
      cards.appendChild(c);
      cardEl[k] = c;
    }
    wrap.append(branches, cards);
    function place(slot) {
      if (slots[slot]) { cardEl[slots[slot]].classList.remove('used'); slots[slot] = null; return redraw(); }
      if (!sel) return say('Πάτησε πρώτα μια κάρτα λύσης.', 'bad');
      slots[slot] = sel;
      cardEl[sel].classList.replace('sel', 'used');
      sel = null;
      redraw();
      if (!slots.yes || !slots.no) return;
      if (slots.yes !== 'yes') {
        slotEl.yes.classList.add('bad'); slotEl.no.classList.add('bad');
        return say(`Όχι ακόμα! Αν «${p.expr}» είναι <b>αληθής</b>, τι κάνουμε; Πάτησε ένα κουτί για να βγει η κάρτα.`, 'bad');
      }
      slotEl.yes.classList.add('ok'); slotEl.no.classList.add('ok');
      const msg = `Αν «${p.expr}» είναι αληθής → ${p.yes.toLowerCase()}· αλλιώς → ${p.no.toLowerCase()}.`;
      if (pi === act.problems.length - 1) return complete('🎉 ' + msg);
      say('✅ ' + msg, 'good');
      const nb = el('button', '', 'Επόμενο πρόβλημα ▶');
      nb.onclick = () => { pi++; say(''); show(); };
      wrap.appendChild(nb);
    }
    function redraw() {
      for (const k of ['yes', 'no']) { slotEl[k].textContent = slots[k] ? p[slots[k]] : '…'; slotEl[k].className = 'dslot'; }
    }
  }
  show();
};

// ---- Επιτραπέζιο με κανόνες-συνθήκες, 2 ομάδες (Γ΄ έκδ. 7.0 σελ. 13)
RENDER.board = (act, area) => {
  const COLS = 10, CS = 100, END = 29;
  const COLORS = ['#e53935', '#43a047', '#fdd835', '#1e88e5', '#8e24aa', '#fb8c00'];
  const YELLOW = '#fdd835', BLUE = '#1e88e5';
  const color = i => COLORS[(i - 1) % 6];
  const LADDERS = { 2: 17, 6: 13 }; // κάθετες σκάλες ανάμεσα σε σειρές
  const RULES = {
    ladder: 'Αν είσαι σε <b>σκάλα</b>, τότε πήγαινε εκεί που οδηγεί.',
    three: 'Αν <b>έριξες 3</b>, τότε ξαναπαίζεις.',
    yellow: 'Αν είσαι στο <b>κίτρινο</b>, τότε χάνεις τη σειρά σου.',
    blue: 'Αν είσαι στο <b>μπλε</b>, τότε πήγαινε 2 πίσω!',
  };
  const DIE = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
  let players, turn, over, busy;
  // φιδωτή διαδρομή: ξεκινά κάτω αριστερά και ανεβαίνει
  const xy = i => { const r = Math.floor(i / COLS), c = i % COLS; return [(r % 2 ? COLS - 1 - c : c) * CS, (2 - r) * CS]; };
  const board = el('div', 'boardwrap');
  board.style.width = COLS * CS + 'px'; board.style.height = 3 * CS + 'px';
  for (let i = 0; i <= END; i++) {
    const [x, y] = xy(i);
    const c = el('div', 'bcell' + (i === 0 ? ' start' : i === END ? ' end' : ''), i === 0 ? 'ΑΡΧΗ' : i === END ? 'ΤΕΛΟΣ' : String(i));
    Object.assign(c.style, { left: x + 2 + 'px', top: y + 2 + 'px', width: CS - 4 + 'px', height: CS - 4 + 'px' });
    if (i > 0 && i < END) c.style.background = color(i);
    board.appendChild(c);
  }
  const ctr = i => xy(i).map(v => v + CS / 2);
  board.insertAdjacentHTML('beforeend', `<svg width="${COLS * CS}" height="${3 * CS}" style="position:absolute;inset:0;pointer-events:none;z-index:2">` +
    Object.entries(LADDERS).map(([a, b]) => { const [x1, y1] = ctr(+a), [x2, y2] = ctr(b);
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#6d4c41" stroke-width="22" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d7ccc8" stroke-width="12" stroke-dasharray="5 14"/>`; }).join('') + '</svg>');
  const tokens = [el('div', 'token', '👧'), el('div', 'token', '👦')];
  board.append(...tokens);
  const side = el('div', 'bside');
  area.append(board, side);
  function place() {
    players.forEach((p, i) => { const [x, y] = xy(p.pos); tokens[i].style.left = x + 4 + i * 46 + 'px'; tokens[i].style.top = y + 34 + 'px'; });
  }
  function drawSide(die, hits = []) {
    const p = players[turn];
    side.innerHTML = `<div class="turn">${over ? '🏆 Τέλος παιχνιδιού!' : `Σειρά: ${p.em} ${p.name}`}</div><div class="die">${die || '🎲'}</div>`;
    const btn = el('button', '', over ? '🔁 Νέο παιχνίδι' : '🎲 Ρίξε το ζάρι');
    btn.onclick = over ? start : roll;
    side.appendChild(btn);
    const rl = el('div', 'brules');
    for (const [k, t] of Object.entries(RULES)) rl.appendChild(el('div', 'rule' + (hits.includes(k) ? ' hit' : ''), t));
    side.appendChild(rl);
  }
  async function roll() {
    if (busy || over) return;
    const my = runId;
    const p = players[turn];
    if (p.skip) {
      p.skip = false;
      say(`${p.em} ${p.name}: χάνει αυτή τη σειρά (ήταν στο κίτρινο).`);
      turn = 1 - turn;
      return drawSide('', ['yellow']);
    }
    busy = true;
    const d = 1 + Math.floor(Math.random() * 6);
    p.pos = Math.min(END, p.pos + d);
    place();
    drawSide(DIE[d - 1]);
    await sleep(650);
    if (my !== runId) return;
    const hits = [];
    let msg = `${p.em} ${p.name} έφερε <b>${d}</b>. `;
    if (p.pos === END) {
      over = true; busy = false;
      drawSide(DIE[d - 1]);
      return complete(`🏆 ${p.name} έφτασε στο ΤΕΛΟΣ! Οι κανόνες με «Αν… τότε» έκαναν το παιχνίδι!`);
    }
    if (LADDERS[p.pos]) { hits.push('ladder'); p.pos = LADDERS[p.pos]; msg += 'Σκάλα! Ανεβαίνεις. '; }
    else if (color(p.pos) === YELLOW) { hits.push('yellow'); p.skip = true; msg += 'Κίτρινο: χάνεις την επόμενη σειρά. '; }
    else if (color(p.pos) === BLUE) { hits.push('blue'); p.pos -= 2; msg += 'Μπλε: 2 πίσω! '; }
    if (d === 3) { hits.push('three'); msg += 'Έφερες 3: ξαναπαίζεις!'; }
    else turn = 1 - turn;
    place();
    drawSide(DIE[d - 1], hits);
    say(msg, hits.length ? 'good' : '');
    busy = false;
  }
  function start() {
    players = [{ name: 'Υπατία', em: '👧', pos: 0, skip: false }, { name: 'Ήρωνας', em: '👦', pos: 0, skip: false }];
    turn = 0; over = false; busy = false;
    place(); drawSide(); say('');
  }
  start();
};

// ---- Ο γρίφος του βαρκάρη: λύκος, κατσίκα, λάχανο (Δ΄ έκδ. 6.0 σελ. 14)
RENDER.river = (act, area) => {
  const ITEMS = { wolf: ['🐺', 'Λύκος', 'τον λύκο'], goat: ['🐐', 'Κατσίκα', 'την κατσίκα'], cabbage: ['🥬', 'Λάχανο', 'το λάχανο'] };
  let side, boat, cargo, steps, lost;
  const wrap = el('div', 'river');
  area.appendChild(wrap);
  const won = () => Object.values(side).every(v => v === 'B');
  function draw() {
    wrap.innerHTML = '';
    const scene = el('div', 'scene');
    const bank = b => {
      const col = el('div', 'bank', `<h3>Όχθη ${b === 'A' ? 'Α' : 'Β'}</h3>`);
      for (const [k, [em, name]] of Object.entries(ITEMS)) if (side[k] === b && cargo !== k) {
        const c = el('button', 'critter', `<span>${em}</span>${name}`);
        c.onclick = () => load(k);
        col.appendChild(c);
      }
      return col;
    };
    const water = el('div', 'water');
    const boatEl = el('div', 'boat ' + (boat === 'A' ? 'left' : 'right'), '🚣');
    if (cargo) { const c = el('button', 'critter small', ITEMS[cargo][0]); c.onclick = () => { cargo = null; draw(); }; boatEl.appendChild(c); }
    water.appendChild(boatEl);
    scene.append(bank('A'), water, bank('B'));
    const ctrls = el('div', 'controls');
    const go = el('button', '', '⛵ Πέρνα απέναντι');
    go.disabled = lost || won();
    go.onclick = cross;
    const again = el('button', 'secondary', '🔁 Από την αρχή');
    again.onclick = reset;
    ctrls.append(go, again);
    const log = el('div', 'steps', steps.length ? steps.map((t, i) => `<div>Βήμα ${i + 1}. ${t}</div>`).join('') : '<div style="opacity:.7">Τα βήματά σου γράφονται εδώ — αυτός θα είναι ο αλγόριθμός σου!</div>');
    wrap.append(scene, ctrls, log);
  }
  function load(k) {
    if (lost || won()) return;
    if (side[k] !== boat) return say('Η βάρκα είναι στην άλλη όχθη!', 'bad');
    cargo = k; say(''); draw();
  }
  function cross() {
    if (lost || won()) return;
    const from = boat, to = boat === 'A' ? 'B' : 'A', toName = to === 'A' ? 'Α' : 'Β';
    steps.push(cargo ? (to === 'B' ? `Μετάφερε ${ITEMS[cargo][2]} στην όχθη Β` : `Γύρνα πίσω με ${ITEMS[cargo][2]} στην όχθη Α`)
                     : (to === 'B' ? 'Πήγαινε με άδεια βάρκα στην όχθη Β' : 'Γύρνα πίσω με άδεια βάρκα στην όχθη Α'));
    boat = to;
    if (cargo) { side[cargo] = to; cargo = null; }
    // ελέγχουμε την όχθη που έμεινε χωρίς τον βαρκάρη
    const alone = k => side[k] === from;
    if (alone('wolf') && alone('goat')) { lost = true; draw(); return say('😱 Ο λύκος έμεινε μόνος με την κατσίκα και την έφαγε! Πατήστε «Από την αρχή».', 'bad'); }
    if (alone('goat') && alone('cabbage')) { lost = true; draw(); return say('😱 Η κατσίκα έμεινε μόνη με το λάχανο και το έφαγε! Πατήστε «Από την αρχή».', 'bad'); }
    draw();
    if (won()) complete(`🎉 Μπράβο! Τους περάσατε όλους ασφαλείς σε ${steps.length} βήματα — φτιάξατε αλγόριθμο!`);
    else say(`Η βάρκα είναι στην όχθη ${toName}.`);
  }
  function reset() { side = { wolf: 'A', goat: 'A', cabbage: 'A' }; boat = 'A'; cargo = null; steps = []; lost = false; say(''); draw(); }
  reset();
};

// ---- Κρυπτογράφηση του Καίσαρα με τη μεταβλητή «θέση» (Ε΄ έκδ. 6.0 σελ. 9–13)
RENDER.caesar = (act, area) => {
  const shift = act.shift || 3, dec = act.mode === 'decode', sign = dec ? '−' : '+';
  const letters = [...act.word];
  const steps = letters.map(ch => caesarStep(ch, shift, dec));
  let idx = 0, misses = 0;
  const wrap = el('div', 'caesar');
  area.appendChild(wrap);
  const table = el('table', 'ctable');
  table.innerHTML = '<tr><th>θέση</th>' + [...GR].map((_, i) => `<td class="pos">${i + 1}</td>`).join('') + '</tr>';
  const plainTr = el('tr', '', '<th>Απλό</th>'), codeTr = el('tr', '', `<th>Κρυπτ. (+${shift})</th>`);
  const plainBtn = [], codeBtn = [];
  [...GR].forEach((ch, i) => {
    const a = el('button', 'cl', ch), b = el('button', 'cl code', GR[(i + shift) % 24]);
    plainTr.appendChild(el('td')).appendChild(a);
    codeTr.appendChild(el('td')).appendChild(b);
    plainBtn.push(a); codeBtn.push(b);
    // κρυπτογράφηση: πατάμε στην κάτω γραμμή · αποκρυπτογράφηση: στην πάνω
    (dec ? a : b).onclick = () => pick(i);
    (dec ? b : a).disabled = true;
  });
  table.append(plainTr, codeTr);
  const word = el('div', 'cword');
  const trace = el('table', 'trace');
  wrap.append(table, word, trace);
  // η στήλη του πίνακα όπου βρίσκεται η σωστή απάντηση
  const answerCol = i => (dec ? steps[i].q - 1 : steps[i].p - 1);
  function draw() {
    word.innerHTML = letters.map((ch, i) => (i === idx ? `<span class="cur">${ch}</span>` : ch)).join('') +
      '<span class="arrow">→</span>' + steps.map((st, i) => (i < idx ? st.out : '_')).join('');
    trace.innerHTML = `<tr><th></th>${letters.map((_, i) => `<th style="text-align:center">${i + 1}η</th>`).join('')}</tr>` +
      `<tr><th>Γράμμα</th>${letters.map((ch, i) => `<td>${i < idx ? ch : ''}</td>`).join('')}</tr>` +
      `<tr><th>μεταβλητή θέση</th>${letters.map((_, i) => `<td>${i < idx ? steps[i].p : ''}</td>`).join('')}</tr>` +
      `<tr><th>θέση ${sign} ${shift}</th>${letters.map((_, i) => `<td>${i < idx ? steps[i].raw + (steps[i].note ? '→' + steps[i].q : '') : ''}</td>`).join('')}</tr>` +
      `<tr><th>${dec ? 'Απλό' : 'Κρυπτογραφημένο'}</th>${letters.map((_, i) => `<td><b>${i < idx ? steps[i].out : ''}</b></td>`).join('')}</tr>`;
  }
  function pick(col) {
    if (idx >= letters.length) return;
    const st = steps[idx];
    if (col !== answerCol(idx)) {
      misses++;
      (dec ? codeBtn : plainBtn)[dec ? st.q - 1 : st.p - 1].classList.add('hint'); // πού βρίσκεται το γράμμα που ψάχνουμε
      return say(`Όχι. Το «${letters[idx]}» είναι στη θέση ${st.p}. ${st.p} ${sign} ${shift} = ${st.raw}${st.note}. Ποιο γράμμα είναι στη θέση ${st.q};`, 'bad');
    }
    for (const b of [...plainBtn, ...codeBtn]) b.classList.remove('hint');
    (dec ? plainBtn : codeBtn)[col].classList.add('done');
    idx++;
    draw();
    if (idx === letters.length) complete(`🎉 Μπράβο! ${act.word} → ${steps.map(x => x.out).join('')}`);
    else say(`✅ ${letters[idx - 1]} → ${st.out}` + (st.note ? ` (${st.p} ${sign} ${shift} = ${st.raw}${st.note})` : ''), 'good');
  }
  draw();
};

// ---- micro:bit: 5×5 λαμπάκια, κουμπιά Α/Β και λογότυπο (Β΄ έκδ. 7.0 μαθ. 8–9)
const MB_ICONS = {

RENDER.microbit = (act, area) => {
  const my = runId;

  if (act.mode === 'forever') {
    // «για πάντα»: εμφανίζει εναλλάξ δύο εικονίδια· πάτημα στο εικονίδιο → άλλο εικονίδιο
    const pick = ['happy', 'sad'];

      card.innerHTML = '🔁 <b>για πάντα</b>';
      pick.forEach((k, i) => {
        const b = el('button', 'secondary', 'εμφάνιση ' + MB_ICONS[k][0]);
        b.onclick = () => { pick[i] = keys[(keys.indexOf(pick[i]) + 1) % keys.length]; draw(); };
        card.appendChild(el('div')).appendChild(b);
      });
    };

    const tick = () => { if (my !== runId) return; show(pick[t++ % 2]); setTimeout(tick, 900); };
    tick();
    return complete('🔁 Η εντολή «για πάντα» επαναλαμβάνει τις εντολές της ασταμάτητα!');
  }
  // γεγονότα: όταν πιεστεί Α / Β / το λογότυπο → εμφάνιση εικονιδίου
  const EV = [['a', 'όταν πιεστεί το κουμπί <b>A</b>', 'scissors'], ['b', 'όταν πιεστεί το κουμπί <b>B</b>', 'paper'], ['logo', 'όταν πατηθεί το <b>λογότυπο</b>', 'rock']];

// ---- Επιφάνεια εργασίας «σαν Windows»: εικονίδια, παράθυρα (— ▢ ✕), γραμμή εργασιών, Έναρξη,
//      σύρσιμο στις άκρες (μεγιστοποίηση / μισή οθόνη), δεξί κλικ → νέος φάκελος / μετονομασία
const norm = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
// πάτημα / διπλό / παρατεταμένο πάτημα / σύρσιμο, με ποντίκι ή δάχτυλο· τα κουμπιά μέσα στο στοιχείο δεν «αρπάζονται»
function press(target, h) {
  target.onpointerdown = e => {
    if (e.button === 2) return;
    const inner = e.target.closest('button, input');
    if (inner && inner !== target && target.contains(inner)) return;
    e.preventDefault();
    e.stopPropagation();
    target.setPointerCapture(e.pointerId);
    const scale = $('stage').getBoundingClientRect().width / 1600;
    const sx = e.clientX, sy = e.clientY;
    let moved = false, long = false;
    const timer = h.onLong && setTimeout(() => { if (!moved) { long = true; h.onLong(e); } }, 650);
    target.onpointermove = ev => {
      const dx = (ev.clientX - sx) / scale, dy = (ev.clientY - sy) / scale;
      if (!moved && Math.abs(dx) + Math.abs(dy) > 8) { moved = true; clearTimeout(timer); if (h.onDragStart) h.onDragStart(ev); }
      if (moved && h.onDrag) h.onDrag(dx, dy, ev);
    };
    target.onpointerup = target.onpointercancel = ev => {
      clearTimeout(timer);
      target.onpointermove = target.onpointerup = target.onpointercancel = null;
      if (long) return;
      if (moved) { if (h.onDragEnd) h.onDragEnd(ev); return; }
      const now = Date.now();
      if (h.onDouble && now - (target._lastTap || 0) < 500) { target._lastTap = 0; h.onDouble(ev); }
      else { target._lastTap = now; if (h.onTap) h.onTap(ev); }
    };
  };
  if (h.onLong) target.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); h.onLong(e); };
}
const PINNED = ['web', 'notepad', 'paint']; // καρφιτσωμένες στη γραμμή εργασιών
