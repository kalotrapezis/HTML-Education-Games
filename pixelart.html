<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Pixel Art</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; user-select: none; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298 50%, #6b2a8a);
    color: #fff;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 18px;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,179,71,0.3);
  }
  header h1 { font-size: 22px; color: #ffb347; margin-right: 10px; }
  .group { display: flex; align-items: center; gap: 6px; }
  .group label { font-size: 13px; opacity: 0.85; }
  button, select, input[type=file]::file-selector-button {
    background: #ffb347; color: #1e1e2e;
    border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 14px; font-weight: bold;
    cursor: pointer; font-family: inherit;
  }
  button:hover, input[type=file]::file-selector-button:hover { background: #ffc870; }
  button.secondary { background: rgba(255,255,255,0.15); color: #fff; }
  button.secondary:hover { background: rgba(255,255,255,0.25); }
  button.active { background: #ffe066; box-shadow: 0 0 0 2px #fff inset; }
  select {
    padding: 6px 10px; background: rgba(255,255,255,0.15); color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  select option { background: #2a2a3e; }
  input[type=range] { width: 110px; accent-color: #ffb347; }
  input[type=file] { display: none; }
  .file-btn { display: inline-block; }
  main {
    flex: 1; display: flex; min-height: 0;
  }
  #palette {
    width: 88px; padding: 14px 10px;
    background: rgba(0,0,0,0.35);
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    align-items: center;
    border-right: 1px solid rgba(255,179,71,0.2);
  }
  .swatch {
    width: 56px; height: 56px;
    border-radius: 10px; cursor: pointer;
    border: 3px solid rgba(255,255,255,0.2);
    transition: transform 0.1s;
    flex-shrink: 0;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.selected {
    border-color: #ffe066;
    box-shadow: 0 0 12px rgba(255,224,102,0.7);
    transform: scale(1.08);
  }
  .swatch.eraser {
    background:
      linear-gradient(45deg, #ccc 25%, transparent 25%) 0 0/14px 14px,
      linear-gradient(-45deg, #ccc 25%, transparent 25%) 0 0/14px 14px,
      linear-gradient(45deg, transparent 75%, #ccc 75%) 0 0/14px 14px,
      linear-gradient(-45deg, transparent 75%, #ccc 75%) 0 0/14px 14px,
      #fff;
    position: relative;
  }
  .swatch.eraser::after {
    content: '✕';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #d32f2f; font-size: 28px; font-weight: bold;
  }
  #canvasWrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 16px; min-width: 0; min-height: 0;
    background:
      linear-gradient(135deg, rgba(0,0,0,0.15), rgba(0,0,0,0.35));
  }
  #stage {
    position: relative;
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    line-height: 0;
  }
  #stage canvas {
    position: absolute; top: 0; left: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #cArt { position: relative !important; cursor: crosshair; }
  #cOverlay { pointer-events: none; }
  #cGrid { pointer-events: none; }
  #cHint { pointer-events: none; }
  .badge {
    font-size: 12px; opacity: 0.7; margin-left: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>🎨 Pixel Art</h1>

  <div class="group">
    <label>Σχήμα:</label>
    <select id="sizeSel">
      <option value="12,12">12 × 12 (τετράγωνο, πολύ εύκολο)</option>
      <option value="16,16" selected>16 × 16 (τετράγωνο, εύκολο)</option>
      <option value="24,24">24 × 24 (τετράγωνο)</option>
      <option value="32,32">32 × 32 (τετράγωνο)</option>
      <option value="48,48">48 × 48 (τετράγωνο, δύσκολο)</option>
      <option value="32,18">32 × 18 (widescreen 16:9)</option>
      <option value="48,27">48 × 27 (widescreen HD)</option>
      <option value="64,36">64 × 36 (widescreen 4K)</option>
      <option value="42,18">42 × 18 (ultrawide 21:9)</option>
      <option value="56,24">56 × 24 (ultrawide HD)</option>
      <option value="84,36">84 × 36 (ultrawide 4K)</option>
      <option value="64,18">64 × 18 (super ultrawide 32:9)</option>
      <option value="96,27">96 × 27 (super ultrawide HD)</option>
      <option value="24,16">24 × 16 (οριζόντιο 3:2)</option>
      <option value="16,24">16 × 24 (κατακόρυφο 2:3)</option>
      <option value="18,32">18 × 32 (κατακόρυφο)</option>
    </select>
  </div>

  <div class="group">
    <label>Παλέτα:</label>
    <select id="paletteSel">
      <option value="kids">Παιδική (8 χρώματα)</option>
      <option value="medium" selected>Μεσαία (16 χρώματα)</option>
      <option value="full">Πλήρης (24 χρώματα)</option>
    </select>
  </div>

  <div class="group">
    <button id="fillBtn" class="secondary">🪣 Γέμισμα</button>
    <button id="pickBtn" class="secondary">💧 Σταγονόμετρο</button>
  </div>

  <div class="group">
    <label class="file-btn">
      <input type="file" id="imgInput" accept="image/*">
      <button onclick="document.getElementById('imgInput').click()">🖼️ Φόρτωσε εικόνα</button>
    </label>
    <select id="presetSel" class="secondary">
      <option value="">📚 Έτοιμα σχέδια…</option>
    </select>
    <button id="savePresetBtn" class="secondary" style="display:none" title="Αποθήκευση τρέχουσας εικόνας ως preset">💾+</button>
    <button id="clearImgBtn" class="secondary" style="display:none">🗑️</button>
  </div>

  <div class="group" id="overlayCtrls" style="display:none">
    <label>Αχνά:</label>
    <input type="range" id="opacitySlider" min="5" max="80" value="30">
    <button id="toggleOverlay" class="secondary">👁️</button>
    <button id="hintBtn" class="secondary" title="Δείξε το σωστό χρώμα κάθε τετραγώνου όταν περνάς από πάνω">💡 Βοήθεια</button>
  </div>

  <div class="group" style="margin-left:auto">
    <button id="undoBtn" class="secondary">↶ Αναίρεση</button>
    <button id="clearBtn" class="secondary">🧹 Καθάρισμα</button>
    <button id="saveBtn">💾 Αποθήκευση PNG</button>
  </div>
</header>

<main>
  <div id="palette"></div>
  <div id="canvasWrap">
    <div id="stage">
      <canvas id="cArt"></canvas>
      <canvas id="cOverlay"></canvas>
      <canvas id="cHint"></canvas>
      <canvas id="cGrid"></canvas>
    </div>
  </div>
</main>

<script src="presets/manifest.js"></script>
<script>
const LS_PRESETS_KEY = 'pixelart_user_presets_v1';

const PALETTES = {
  kids: [
    '#000000','#ffffff','#e63946','#ffb347',
    '#ffe066','#3ec23e','#3a6bff','#9b5de5'
  ],
  medium: [
    '#000000','#4a4a4a','#9a9a9a','#ffffff',
    '#7a1f1f','#e63946','#ff8a8a','#ffb347',
    '#ffe066','#c2a200','#3ec23e','#1a6e1a',
    '#3a6bff','#0d2f7a','#9b5de5','#5d2a8a'
  ],
  full: [
    '#000000','#3a3a3a','#6b6b6b','#9a9a9a','#cfcfcf','#ffffff',
    '#7a1f1f','#e63946','#ff8a8a','#ff5a8a','#c93a8e','#9b5de5',
    '#5d2a8a','#0d2f7a','#3a6bff','#7ab8ff','#1e9eb3','#13c2c2',
    '#1a6e1a','#3ec23e','#9be15d','#ffe066','#ffb347','#c97a1f'
  ]
};

const stage = document.getElementById('stage');
const cArt = document.getElementById('cArt');
const cOverlay = document.getElementById('cOverlay');
const cHint = document.getElementById('cHint');
const cGrid = document.getElementById('cGrid');
const ctxArt = cArt.getContext('2d');
const ctxOverlay = cOverlay.getContext('2d');
const ctxHint = cHint.getContext('2d');
const ctxGrid = cGrid.getContext('2d');

let gridW = 16, gridH = 16;
let cellPx = 32; // internal logical px per cell (fixed)
let pixels = [];
let history = [];
let currentColor = '#000000';
let currentTool = 'brush'; // brush | eraser | fill | pick
let loadedImage = null;
let overlayVisible = true;
let hintMode = false;

function fitStage() {
  const wrap = document.getElementById('canvasWrap');
  const pad = 16;
  const maxW = wrap.clientWidth - pad;
  const maxH = wrap.clientHeight - pad;
  // square cells: scale to the limiting dimension
  const scale = Math.min(maxW / gridW, maxH / gridH);
  const cssCell = Math.floor(scale);
  const displayW = cssCell * gridW;
  const displayH = cssCell * gridH;
  cellPx = 32; // fixed internal resolution per cell — crisp regardless of display size
  const pxW = cellPx * gridW;
  const pxH = cellPx * gridH;
  stage.style.width = displayW + 'px';
  stage.style.height = displayH + 'px';
  for (const c of [cArt, cOverlay, cHint, cGrid]) {
    c.width = pxW; c.height = pxH;
    c.style.width = displayW + 'px';
    c.style.height = displayH + 'px';
  }
  drawArt();
  drawOverlay();
  drawGrid();
  drawHint();
}

function newPixels() {
  pixels = Array.from({length: gridH}, () => Array(gridW).fill(null));
  history = [];
}

function snapshot() {
  history.push(pixels.map(row => row.slice()));
  if (history.length > 50) history.shift();
}

function drawArt() {
  ctxArt.clearRect(0, 0, cArt.width, cArt.height);
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      const c = pixels[y][x];
      if (c) {
        ctxArt.fillStyle = c;
        ctxArt.fillRect(x * cellPx, y * cellPx, cellPx, cellPx);
      }
    }
  }
}

function drawGrid() {
  ctxGrid.clearRect(0, 0, cGrid.width, cGrid.height);
  ctxGrid.strokeStyle = 'rgba(0,0,0,0.35)';
  ctxGrid.lineWidth = 1;
  for (let i = 0; i <= gridW; i++) {
    const p = i * cellPx + 0.5;
    ctxGrid.beginPath();
    ctxGrid.moveTo(p, 0); ctxGrid.lineTo(p, cGrid.height); ctxGrid.stroke();
  }
  for (let i = 0; i <= gridH; i++) {
    const p = i * cellPx + 0.5;
    ctxGrid.beginPath();
    ctxGrid.moveTo(0, p); ctxGrid.lineTo(cGrid.width, p); ctxGrid.stroke();
  }
}

function drawOverlay() {
  ctxOverlay.clearRect(0, 0, cOverlay.width, cOverlay.height);
  if (!loadedImage || !overlayVisible) return;
  const opacity = parseInt(document.getElementById('opacitySlider').value) / 100;
  ctxOverlay.globalAlpha = opacity;
  // fit image inside canvas keeping aspect
  const iw = loadedImage.naturalWidth, ih = loadedImage.naturalHeight;
  const cw = cOverlay.width, ch = cOverlay.height;
  const scale = Math.min(cw / iw, ch / ih);
  const dw = iw * scale, dh = ih * scale;
  const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
  ctxOverlay.imageSmoothingEnabled = true;
  ctxOverlay.drawImage(loadedImage, dx, dy, dw, dh);
  ctxOverlay.globalAlpha = 1;
}

// pixelized "target" — sample the loaded image into grid cells
let targetGrid = null;
function buildTargetGrid() {
  if (!loadedImage) { targetGrid = null; return; }
  const tmp = document.createElement('canvas');
  tmp.width = gridW; tmp.height = gridH;
  const tctx = tmp.getContext('2d');
  const iw = loadedImage.naturalWidth, ih = loadedImage.naturalHeight;
  const scale = Math.min(gridW / iw, gridH / ih);
  const dw = iw * scale, dh = ih * scale;
  const dx = (gridW - dw) / 2, dy = (gridH - dh) / 2;
  tctx.imageSmoothingEnabled = true;
  tctx.fillStyle = '#ffffff';
  tctx.fillRect(0, 0, gridW, gridH);
  tctx.drawImage(loadedImage, dx, dy, dw, dh);
  const data = tctx.getImageData(0, 0, gridW, gridH).data;
  const pal = PALETTES[document.getElementById('paletteSel').value];
  targetGrid = Array.from({length: gridH}, () => Array(gridW).fill(null));
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      const i = (y * gridW + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
      if (a < 30) { targetGrid[y][x] = null; continue; }
      targetGrid[y][x] = nearestPaletteColor(r, g, b, pal);
    }
  }
}

function nearestPaletteColor(r, g, b, pal) {
  let best = pal[0], bestD = Infinity;
  for (const hex of pal) {
    const pr = parseInt(hex.slice(1,3), 16);
    const pg = parseInt(hex.slice(3,5), 16);
    const pb = parseInt(hex.slice(5,7), 16);
    const d = (r-pr)**2 + (g-pg)**2 + (b-pb)**2;
    if (d < bestD) { bestD = d; best = hex; }
  }
  return best;
}

let hoverCell = null;
function drawHint() {
  ctxHint.clearRect(0, 0, cHint.width, cHint.height);
  if (!hintMode || !targetGrid || !hoverCell) return;
  const { x, y } = hoverCell;
  const c = targetGrid[y]?.[x];
  if (!c) return;
  ctxHint.fillStyle = c;
  ctxHint.globalAlpha = 0.6;
  ctxHint.fillRect(x * cellPx, y * cellPx, cellPx, cellPx);
  ctxHint.globalAlpha = 1;
  ctxHint.strokeStyle = '#ffe066';
  ctxHint.lineWidth = 3;
  ctxHint.strokeRect(x * cellPx + 1.5, y * cellPx + 1.5, cellPx - 3, cellPx - 3);
}

function buildPalette() {
  const palWrap = document.getElementById('palette');
  palWrap.innerHTML = '';
  const palName = document.getElementById('paletteSel').value;
  const pal = PALETTES[palName];

  const eraser = document.createElement('div');
  eraser.className = 'swatch eraser';
  eraser.title = 'Γόμα';
  eraser.addEventListener('click', () => {
    currentTool = 'eraser';
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    eraser.classList.add('selected');
    updateToolBtns();
  });
  palWrap.appendChild(eraser);

  pal.forEach((color, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = color;
    sw.title = color;
    if (color === currentColor) sw.classList.add('selected');
    sw.addEventListener('click', () => {
      currentColor = color;
      currentTool = currentTool === 'fill' || currentTool === 'pick' ? currentTool : 'brush';
      if (currentTool === 'eraser') currentTool = 'brush';
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      updateToolBtns();
    });
    palWrap.appendChild(sw);
  });
}

function updateToolBtns() {
  document.getElementById('fillBtn').classList.toggle('active', currentTool === 'fill');
  document.getElementById('pickBtn').classList.toggle('active', currentTool === 'pick');
}

function cellFromEvent(ev) {
  const rect = cArt.getBoundingClientRect();
  const cssCellW = rect.width / gridW;
  const cssCellH = rect.height / gridH;
  const x = Math.floor((ev.clientX - rect.left) / cssCellW);
  const y = Math.floor((ev.clientY - rect.top) / cssCellH);
  if (x < 0 || x >= gridW || y < 0 || y >= gridH) return null;
  return { x, y };
}

function paint(x, y) {
  if (currentTool === 'eraser') pixels[y][x] = null;
  else pixels[y][x] = currentColor;
}

function floodFill(x, y, target) {
  const replace = currentTool === 'eraser' ? null : currentColor;
  if (target === replace) return;
  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cx >= gridW || cy < 0 || cy >= gridH) continue;
    if (pixels[cy][cx] !== target) continue;
    pixels[cy][cx] = replace;
    stack.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
  }
}

let painting = false;
cArt.addEventListener('pointerdown', ev => {
  const c = cellFromEvent(ev); if (!c) return;
  cArt.setPointerCapture(ev.pointerId);

  if (currentTool === 'pick') {
    const v = pixels[c.y][c.x];
    if (v) {
      currentColor = v;
      currentTool = 'brush';
      buildPalette();
      updateToolBtns();
    }
    return;
  }
  if (currentTool === 'fill') {
    snapshot();
    floodFill(c.x, c.y, pixels[c.y][c.x]);
    drawArt();
    return;
  }
  snapshot();
  painting = true;
  paint(c.x, c.y);
  drawArt();
});
cArt.addEventListener('pointermove', ev => {
  const c = cellFromEvent(ev);
  if (hintMode) {
    hoverCell = c;
    drawHint();
  }
  if (!painting || !c) return;
  paint(c.x, c.y);
  drawArt();
});
cArt.addEventListener('pointerup', () => { painting = false; });
cArt.addEventListener('pointerleave', () => { painting = false; if (hintMode) { hoverCell = null; drawHint(); } });

document.getElementById('sizeSel').addEventListener('change', e => {
  const [w, h] = e.target.value.split(',').map(Number);
  gridW = w; gridH = h;
  newPixels();
  buildTargetGrid();
  fitStage();
});
document.getElementById('paletteSel').addEventListener('change', () => {
  buildPalette();
  buildTargetGrid();
  drawHint();
});
document.getElementById('fillBtn').addEventListener('click', () => {
  currentTool = currentTool === 'fill' ? 'brush' : 'fill';
  updateToolBtns();
});
document.getElementById('pickBtn').addEventListener('click', () => {
  currentTool = currentTool === 'pick' ? 'brush' : 'pick';
  updateToolBtns();
});
document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('Να καθαρίσει όλη η ζωγραφιά;')) return;
  snapshot();
  pixels = Array.from({length: gridH}, () => Array(gridW).fill(null));
  drawArt();
});
document.getElementById('undoBtn').addEventListener('click', () => {
  if (history.length === 0) return;
  pixels = history.pop();
  drawArt();
});
document.getElementById('saveBtn').addEventListener('click', () => {
  const exportPx = 16;
  const out = document.createElement('canvas');
  out.width = gridW * exportPx;
  out.height = gridH * exportPx;
  const octx = out.getContext('2d');
  octx.fillStyle = '#ffffff';
  octx.fillRect(0, 0, out.width, out.height);
  for (let y = 0; y < gridH; y++) {
    for (let x = 0; x < gridW; x++) {
      if (pixels[y][x]) {
        octx.fillStyle = pixels[y][x];
        octx.fillRect(x * exportPx, y * exportPx, exportPx, exportPx);
      }
    }
  }
  const a = document.createElement('a');
  a.download = 'pixelart.png';
  a.href = out.toDataURL('image/png');
  a.click();
});

function loadUserPresets() {
  try { return JSON.parse(localStorage.getItem(LS_PRESETS_KEY)) || []; }
  catch { return []; }
}
function saveUserPresets(list) {
  localStorage.setItem(LS_PRESETS_KEY, JSON.stringify(list));
}

const presetSel = document.getElementById('presetSel');
function rebuildPresetDropdown() {
  presetSel.innerHTML = '<option value="">📚 Έτοιμα σχέδια…</option>';
  const bundled = (window.PRESETS_MANIFEST || []);
  if (bundled.length) {
    const og = document.createElement('optgroup');
    og.label = 'Bundled';
    bundled.forEach(p => {
      const opt = document.createElement('option');
      opt.value = 'b:' + p.file;
      opt.textContent = p.name;
      og.appendChild(opt);
    });
    presetSel.appendChild(og);
  }
  const user = loadUserPresets();
  if (user.length) {
    const og = document.createElement('optgroup');
    og.label = 'Δικά μου';
    user.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = 'u:' + i;
      opt.textContent = '⭐ ' + p.name;
      og.appendChild(opt);
    });
    presetSel.appendChild(og);
  }
}
rebuildPresetDropdown();

function loadImageFromSrc(src) {
  const img = new Image();
  img.onload = () => {
    loadedImage = img;
    document.getElementById('overlayCtrls').style.display = 'flex';
    document.getElementById('clearImgBtn').style.display = 'inline-block';
    document.getElementById('savePresetBtn').style.display = 'inline-block';
    buildTargetGrid();
    drawOverlay();
  };
  img.src = src;
}

presetSel.addEventListener('change', e => {
  const v = e.target.value;
  if (!v) return;
  if (v.startsWith('b:')) {
    loadImageFromSrc('presets/' + encodeURIComponent(v.slice(2)));
  } else if (v.startsWith('u:')) {
    const idx = parseInt(v.slice(2));
    const list = loadUserPresets();
    if (list[idx]) loadImageFromSrc(list[idx].data);
  }
  presetSel.value = '';
});

document.getElementById('savePresetBtn').addEventListener('click', () => {
  if (!loadedImage) return;
  const name = prompt('Όνομα για το preset:');
  if (!name) return;
  // store as small JPEG dataURL to save localStorage space
  const tmp = document.createElement('canvas');
  const maxSide = 256;
  const iw = loadedImage.naturalWidth, ih = loadedImage.naturalHeight;
  const scale = Math.min(1, maxSide / Math.max(iw, ih));
  tmp.width = Math.round(iw * scale);
  tmp.height = Math.round(ih * scale);
  tmp.getContext('2d').drawImage(loadedImage, 0, 0, tmp.width, tmp.height);
  const data = tmp.toDataURL('image/png');
  const list = loadUserPresets();
  list.push({ name: name.trim(), data });
  try {
    saveUserPresets(list);
    rebuildPresetDropdown();
    alert('Αποθηκεύτηκε! Θα το βρεις στα «Έτοιμα σχέδια» → Δικά μου.');
  } catch (err) {
    alert('Σφάλμα αποθήκευσης (ίσως γέμισε ο χώρος): ' + err.message);
  }
});

document.getElementById('imgInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  loadImageFromSrc(URL.createObjectURL(f));
});
document.getElementById('clearImgBtn').addEventListener('click', () => {
  loadedImage = null;
  targetGrid = null;
  document.getElementById('overlayCtrls').style.display = 'none';
  document.getElementById('clearImgBtn').style.display = 'none';
  document.getElementById('savePresetBtn').style.display = 'none';
  document.getElementById('imgInput').value = '';
  drawOverlay();
  drawHint();
});
document.getElementById('opacitySlider').addEventListener('input', drawOverlay);
document.getElementById('toggleOverlay').addEventListener('click', () => {
  overlayVisible = !overlayVisible;
  document.getElementById('toggleOverlay').textContent = overlayVisible ? '👁️' : '🚫';
  drawOverlay();
});
document.getElementById('hintBtn').addEventListener('click', () => {
  hintMode = !hintMode;
  document.getElementById('hintBtn').classList.toggle('active', hintMode);
  if (!hintMode) { hoverCell = null; drawHint(); }
});

window.addEventListener('resize', fitStage);

newPixels();
buildPalette();
fitStage();
</script>
</body>
</html>
