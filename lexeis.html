<!DOCTYPE html>
<html lang="el">
<head>
<script src="longpress.js"></script>
<script src="keypick.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Παίζω με τις Λέξεις</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; min-height: 100vh; padding: 64px 16px 30px; user-select: none; -webkit-user-select: none;
    background: linear-gradient(135deg, #1e3c72, #2a5298 50%, #6b2a8a); display: flex; flex-direction: column; align-items: center; -webkit-tap-highlight-color: transparent; }
  .back { position: absolute; top: 14px; left: 14px; z-index: 5; display: flex; gap: 10px; }
  .back a, .back button { color: #fff; text-decoration: none; background: rgba(0,0,0,0.3); padding: 8px 14px; border-radius: 8px; border: 0; font: inherit; cursor: pointer; }
  h1 { font-size: 44px; margin-bottom: 24px; text-align: center; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 1100px; width: 100%; }
  .menu button { background: rgba(0,0,0,0.35); border: 3px solid transparent; border-radius: 18px; color: #fff; padding: 26px 16px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .menu button:hover { border-color: #ffb347; transform: translateY(-3px); }
  .menu .em { font-size: 56px; } .menu .nm { font-size: 24px; font-weight: bold; color: #ffb347; } .menu .ds { font-size: 15px; opacity: .85; text-align: center; }
  .screen { display: none; flex-direction: column; align-items: center; gap: 18px; width: 100%; max-width: 1200px; }
  .screen.on { display: flex; }
  .top { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .chip { background: rgba(0,0,0,.35); border: 2px solid transparent; color: #fff; padding: 8px 16px; border-radius: 20px; font: inherit; font-size: 17px; cursor: pointer; }
  .chip.on { border-color: #ffb347; background: rgba(255,179,71,.25); }
  #stars { font-size: 30px; min-height: 40px; }

  /* --- Συλλαβές: κάρτες σαν πλακάκια --- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; width: 100%; }
  .card { perspective: 800px; height: 190px; cursor: pointer; }
  .card .in { position: relative; width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d; }
  .card.open .in { transform: rotateY(180deg); }
  .card .f, .card .b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px; border: 5px solid #1b1b2f;
    box-shadow: 0 6px 0 rgba(0,0,0,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  .card .f { background: linear-gradient(160deg, var(--c1), var(--c2)); font-size: 70px; font-weight: bold; color: rgba(255,255,255,.9); text-shadow: 0 4px 0 rgba(0,0,0,.2); }
  .card .b { transform: rotateY(180deg); background: linear-gradient(var(--c1), var(--c2)); }
  .card .b .pic { background: #fff; width: 86%; height: 58%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 74px; margin-bottom: 6px; }
  .card .b .w { font-size: 30px; color: #1b1b2f; font-weight: bold; }
  .card.solved .b::after { content: '✓'; position: absolute; top: 6px; right: 8px; background: #4caf50; color: #fff; border-radius: 50%; width: 32px; height: 32px; text-align: center; line-height: 32px; font-size: 20px; }
  .card:hover .in { box-shadow: 0 0 0 4px #ffb347; border-radius: 18px; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal.on { display: flex; }
  .dlg { background: linear-gradient(160deg, #2a5298, #6b2a8a); border: 4px solid #ffb347; border-radius: 24px; padding: 24px; width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .dlg .big { font-size: 120px; line-height: 1.1; }
  .dlg .q { font-size: 26px; }
  .split { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 64px; font-weight: bold; }
  .split .l { padding: 0 2px; }
  .split .gap { width: 30px; height: 80px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #ffd23f; position: relative; }
  .split .gap::before { content: ''; width: 4px; height: 50%; border-radius: 2px; background: rgba(255,255,255,.25); }
  .split .gap:hover::before { background: #ffb347; }
  .split .gap.cut::before { content: '-'; width: auto; height: auto; background: none; font-size: 64px; color: #ffd23f; }
  .split .s0 { color: #ffd23f; } .split .s1 { color: #80ffdb; }
  .split.bad { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }
  .btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .btn { padding: 14px 28px; font-size: 24px; font-weight: bold; border: 0; border-radius: 14px; background: #ff9500; color: #fff; box-shadow: 0 5px 0 #c46c00; cursor: pointer; font-family: inherit; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c46c00; }
  .btn.ghost { background: rgba(0,0,0,.35); box-shadow: none; }
  .msg { font-size: 30px; min-height: 40px; font-weight: bold; }

  /* --- επιλογές με μεγάλα κουμπιά --- */
  .opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; }
  .opts button { min-width: 110px; padding: 16px 24px; font-size: 46px; font-weight: bold; border-radius: 18px; border: 0; background: #ffb347; color: #1e3c72; box-shadow: 0 6px 0 #c47f1c; cursor: pointer; font-family: inherit; }
  .opts button:active { transform: translateY(4px); box-shadow: 0 2px 0 #c47f1c; }
  .opts button.no { background: #888; box-shadow: 0 6px 0 #555; opacity: .5; }
  .opts button.yes { background: #4caf50; color: #fff; box-shadow: 0 6px 0 #2e7d32; }
  .slots { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 90px; }
  .slot { min-width: 70px; height: 84px; padding: 0 10px; border-radius: 14px; border: 3px dashed rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: bold; cursor: pointer; }
  .slot.full { border: 3px solid #ffd23f; background: rgba(255,210,63,.2); }
  .slots.bad { animation: shake .35s; }
  .slots.good .slot { background: #4caf50; border-color: #4caf50; }
  .tiles button.used { visibility: hidden; }
  .word { font-size: 64px; font-weight: bold; letter-spacing: 3px; }
  .word .blank { display: inline-block; min-width: 90px; border-bottom: 6px solid #ffd23f; color: #ffd23f; }

  /* --- Τυφλοπόντικας --- */
  .target { font-size: 34px; font-weight: bold; background: rgba(0,0,0,.4); padding: 8px 24px; border-radius: 16px; }
  .target b { color: #ffd23f; }
  .field { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 30px; width: 100%; max-width: 760px; padding: 20px; border-radius: 26px;
    background: radial-gradient(circle at 50% 30%, #7cb342, #33691e); box-shadow: inset 0 -10px 0 rgba(0,0,0,.2); touch-action: manipulation; }
  .hole { position: relative; height: 150px; overflow: hidden; border-radius: 0 0 50% 50% / 0 0 30% 30%; }
  .hole::after { content: ''; position: absolute; left: 6%; right: 6%; bottom: 0; height: 40px; border-radius: 50%; background: #3e2723; box-shadow: inset 0 8px 10px rgba(0,0,0,.6); z-index: 2; }
  .mole { position: absolute; left: 10%; right: 10%; bottom: -150px; height: 140px; transition: bottom .22s ease-out; cursor: pointer; z-index: 1;
    display: flex; flex-direction: column; align-items: center; }
  .mole.up { bottom: 6px; }
  .mole .face { font-size: 60px; line-height: 1; }
  .mole .sign { background: #fff8e1; color: #1e3c72; font-weight: bold; font-size: 28px; padding: 4px 12px; border-radius: 10px; border: 3px solid #8d6e63; white-space: nowrap; margin-top: -6px; }
  .mole.hit .face { animation: bonk .3s; } .mole.hit .sign { background: #4caf50; color: #fff; }
  .mole.miss .sign { background: #e53935; color: #fff; }
  @keyframes bonk { 50% { transform: scale(1.3, .6); } }
  .bar { display: flex; gap: 20px; font-size: 26px; font-weight: bold; }
  /* ζωντάνια: σφυρί, εφέ, κούνημα, ρολόι που βιάζεται */
  .field { position: relative; }
  .field.playing { cursor: none; }
  .field.shake { animation: fshake .35s; }
  @keyframes fshake { 25% { transform: translateX(-12px) rotate(-.6deg); } 75% { transform: translateX(12px) rotate(.6deg); } }
  .mole { transition: bottom .3s cubic-bezier(.34, 1.56, .64, 1); }
  .mole .face { transition: transform .15s; }
  .mole.up .face { animation: peek 1s ease-in-out infinite alternate; }
  @keyframes peek { to { transform: rotate(8deg) translateY(-3px); } }
  .mole.hit .face, .mole.miss .face { animation: bonk .3s; }
  .hole::before { content: '🌱      🌿'; position: absolute; left: 0; right: 0; bottom: 30px; font-size: 22px; text-align: center; z-index: 3; white-space: pre; pointer-events: none; }
  #hammer { position: fixed; left: 0; top: 0; font-size: 78px; pointer-events: none; z-index: 30; display: none; transform-origin: 75% 75%; }
  #hammer i { display: inline-block; font-style: normal; transform: rotate(-35deg); transform-origin: 75% 75%; }
  #hammer.swing i { animation: swing .2s ease-out; }
  @keyframes swing { 45% { transform: rotate(35deg); } }
  .fx { position: fixed; pointer-events: none; z-index: 29; font-weight: bold; text-shadow: 0 3px 6px rgba(0,0,0,.5); }
  #mTime.low { color: #ff6b6b; animation: tick .5s ease-in-out infinite alternate; }
  @keyframes tick { to { transform: scale(1.25); } }
  #combo { min-height: 40px; font-size: 30px; font-weight: bold; color: #ffd23f; }
</style>
</head>
<body>
<div class="back"><a href="abc.html">← Πίσω</a><button id="toMenu" hidden>☰ Μενού</button></div>

<div id="home" class="screen on">
  <h1>🔤 Παίζω με τις Λέξεις</h1>
  <div class="menu">
    <button data-s="syl"><span class="em">✂️</span><span class="nm">Συλλαβές</span><span class="ds">Άνοιξε μια κάρτα και χώρισε τη λέξη: πα-τά-τα</span></button>
    <button data-s="ana"><span class="em">🔀</span><span class="nm">Ανακατεμένα</span><span class="ds">Βάλε τα γράμματα (ή τις συλλαβές) στη σειρά</span></button>
    <button data-s="miss"><span class="em">🧩</span><span class="nm">Ποιο λείπει;</span><span class="ds">Άκου τη λέξη και βρες το γράμμα ή τη συλλαβή: γ_τα → ά</span></button>
    <button data-s="mole"><span class="em">🔨</span><span class="nm">Τυφλοπόντικας</span><span class="ds">Χτύπα όποιον κρατά το σωστό: γράμμα, συλλαβές ή πράξη</span></button>
  </div>
</div>

<!-- Συλλαβές -->
<div id="syl" class="screen">
  <div class="top">
    <button class="chip on" data-m="split">✂️ Χώρισε σε συλλαβές</button>
    <button class="chip" data-m="count">👏 Πόσες συλλαβές;</button>
    <button class="chip" id="peek">🙈 Κρυφές κάρτες</button>
    <button class="chip" id="newCards">🔄 Νέες κάρτες</button>
  </div>
  <div id="stars"></div>
  <div class="cards" id="cards"></div>
</div>
<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>

<!-- Ανακατεμένα -->
<div id="ana" class="screen">
  <div class="top">
    <button class="chip on" data-a="letters">🔤 Με γράμματα</button>
    <button class="chip" data-a="syl">🧱 Με συλλαβές (πιο εύκολο)</button>
  </div>
  <div class="dlg" style="max-width:1000px">
    <div class="big" id="anaPic"></div>
    <div class="slots" id="anaSlots"></div>
    <div class="opts tiles" id="anaTiles"></div>
    <div class="msg" id="anaMsg"></div>
  </div>
</div>

<!-- Ποιο γράμμα / ποια συλλαβή λείπει -->
<div id="miss" class="screen">
  <div class="top">
    <button class="chip on" data-x="letter">🔤 Γράμμα</button>
    <button class="chip" data-x="syl">🧱 Συλλαβή</button>
    <span id="missCats"></span>
  </div>
  <div class="dlg" style="max-width:1000px">
    <div class="big" id="missPic"></div>
    <div class="word" id="missWord"></div>
    <div class="opts" id="missOpts"></div>
    <div class="msg" id="missMsg"></div>
  </div>
</div>

<!-- Τυφλοπόντικας -->
<div id="mole" class="screen">
  <div class="top">
    <button class="chip on" data-w="letter">🔤 Γράμματα</button>
    <button class="chip" data-w="syl">👏 Συλλαβές</button>
    <button class="chip" data-w="m10">➕ Πράξεις ως 10</button>
    <button class="chip" data-w="mul">✖️ Προπαίδεια</button>
  </div>
  <div class="bar"><span id="mScore">⭐ 0</span><span id="mTime">⏱ 60</span></div>
  <div class="target" id="mTarget"></div>
  <div id="combo"></div>
  <div class="field" id="field"></div>
  <button class="btn" id="mStart">▶ Ξεκίνα</button>
</div>

<script src="lexilogio.js"></script>
<script src="voice.js"></script>
<script src="voices/words/index.js"></script>
<script src="sounds.js"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const snd = k => { try { GameSounds[k](); } catch (e) {} };
const W = PIC_WORDS;
const say = text => Voice.say(text);  // έτοιμη φωνή από voices/words (make-voices.js)
function claps(n) { for (let i = 0; i < n; i++) setTimeout(() => { try { GameSounds.pop(i * 3); } catch (e) {} }, i * 320); }

/* ---------- μενού ---------- */
let stopMole = () => {};
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  $('toMenu').hidden = id === 'home';
  stopMole();
}
document.querySelectorAll('#home [data-s]').forEach(b => b.onclick = () => { snd('unlock'); show(b.dataset.s); INIT[b.dataset.s](); });
$('toMenu').onclick = () => show('home');

/* ---------- Συλλαβές ---------- */
const TILE = [['#ffcf4a', '#f59f00'], ['#fff07a', '#f5c400'], ['#a6ef7e', '#5cc23a'], ['#8de8ff', '#36b8e6'], ['#ff9fe7', '#e04fc2']];
let sylMode = 'split', hidden = true, deck = [], stars = 0;
function dealCards() {
  deck = shuffle(W.filter(w => w.syl.length >= 2 && w.syl.length <= 5).slice()).slice(0, 12);
  stars = 0; $('stars').textContent = '';
  $('cards').innerHTML = deck.map((w, i) => {
    const [c1, c2] = TILE[i % TILE.length];
    return `<div class="card${hidden ? '' : ' open'}" data-i="${i}" style="--c1:${c1};--c2:${c2}"><div class="in">
      <div class="f">${i + 1}</div>
      <div class="b"><div class="pic">${w.em}</div><div class="w">${w.w}</div></div></div></div>`;
  }).join('');
}
$('cards').onclick = e => {
  const c = e.target.closest('.card'); if (!c) return;
  c.classList.add('open');
  setTimeout(() => openWord(+c.dataset.i), hidden ? 550 : 0);
};
document.querySelectorAll('#syl [data-m]').forEach(b => b.onclick = () => {
  sylMode = b.dataset.m; document.querySelectorAll('#syl [data-m]').forEach(x => x.classList.toggle('on', x === b));
});
$('peek').onclick = () => { hidden = !hidden; $('peek').textContent = hidden ? '🙈 Κρυφές κάρτες' : '👀 Φανερές κάρτες'; $('peek').classList.toggle('on', !hidden); dealCards(); };
$('newCards').onclick = dealCards;

function openWord(i) {
  const w = deck[i], d = $('dlg'), letters = [...w.w];
  let tries = 0;
  const done = () => {
    const card = document.querySelector(`.card[data-i="${i}"]`); card.classList.add('solved');
    stars++; $('stars').textContent = '⭐'.repeat(stars);
    d.querySelector('.split').innerHTML = w.syl.map((s, k) => `<span class="s${k % 2}">${s}</span>`).join('<span style="color:#fff">-</span>');
    d.querySelector('.msg').textContent = `🎉 ${w.syl.length} συλλαβές!`;
    d.querySelector('.btns').innerHTML = '<button class="btn" id="closeDlg">Επόμενη κάρτα →</button>';
    $('closeDlg').onclick = () => $('modal').classList.remove('on');
    claps(w.syl.length); say(w.syl.join(' - '));
    if (stars === deck.length) setTimeout(() => snd('bigCorrect'), 1400);
  };
  d.innerHTML = `<div class="big">${w.em}</div>`;
  if (sylMode === 'split') {
    const cuts = new Set(); let k = 0; w.syl.slice(0, -1).forEach(s => cuts.add(k += s.length));
    d.innerHTML += `<div class="q">Πάτα ανάμεσα στα γράμματα για να χωρίσεις τη λέξη σε συλλαβές</div>
      <div class="split">${letters.map((l, j) => (j ? `<span class="gap" data-j="${j}"></span>` : '') + `<span class="l">${l}</span>`).join('')}</div>
      <div class="msg"></div><div class="btns"><button class="btn" id="chk">✓ Έλεγξε</button><button class="btn ghost" id="sayIt">👏 Χτύπα παλαμάκια</button><button class="btn ghost" id="cls">✕</button></div>`;
    d.querySelectorAll('.gap').forEach(g => g.onclick = () => { g.classList.toggle('cut'); try { GameSounds.pop(+g.dataset.j); } catch (e) {} });
    $('chk').onclick = () => {
      const mine = [...d.querySelectorAll('.gap.cut')].map(g => +g.dataset.j);
      if (mine.length === cuts.size && mine.every(j => cuts.has(j))) { snd('correct'); done(); return; }
      tries++; snd('wrong');
      const sp = d.querySelector('.split'); sp.classList.remove('bad'); void sp.offsetWidth; sp.classList.add('bad');
      d.querySelector('.msg').textContent = mine.length < cuts.size ? 'Λείπουν χωρίσματα — δοκίμασε ξανά!' : mine.length > cuts.size ? 'Πολλά χωρίσματα — δοκίμασε ξανά!' : 'Σχεδόν! Άλλαξε κάποιο χώρισμα.';
      if (tries >= 2 && !$('help')) d.querySelector('.btns').insertAdjacentHTML('afterbegin', '<button class="btn ghost" id="help">💡 Δείξε μου</button>'), $('help').onclick = done;
    };
  } else {
    const n = w.syl.length;
    d.innerHTML += `<div class="split">${w.w}</div><div class="q">Πόσες συλλαβές έχει; Χτύπα παλαμάκια!</div>
      <div class="opts">${[1, 2, 3, 4, 5].map(x => `<button data-n="${x}">${x}</button>`).join('')}</div><div class="msg"></div>
      <div class="btns"><button class="btn ghost" id="sayIt">👏 Άκου</button><button class="btn ghost" id="cls">✕</button></div>`;
    d.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
      if (+b.dataset.n === n) { b.classList.add('yes'); snd('correct'); done(); }
      else { b.classList.add('no'); snd('wrong'); }
    });
  }
  const s = $('sayIt'); if (s) s.onclick = () => { say(w.w); };
  const c = $('cls'); if (c) c.onclick = () => $('modal').classList.remove('on');
  $('modal').classList.add('on');
}
$('modal').onclick = e => { if (e.target === $('modal')) $('modal').classList.remove('on'); };

/* ---------- Ανακατεμένα ---------- */
let anaBy = 'letters', anaW, anaParts, anaPicked;
function anaNext() {
  anaW = pick(W.filter(w => anaBy === 'syl' ? w.syl.length >= 2 : w.w.length <= 7));
  anaParts = anaBy === 'syl' ? anaW.syl.slice() : [...anaW.w];
  let order; do { order = shuffle(anaParts.map((_, i) => i)); } while (anaParts.length > 1 && order.every((x, i) => anaParts[x] === anaParts[i]));
  anaPicked = [];
  $('anaPic').textContent = anaW.em; $('anaMsg').textContent = '';
  $('anaTiles').innerHTML = order.map(i => `<button data-i="${i}">${anaParts[i]}</button>`).join('');
  anaPaint();
}
function anaPaint() {
  $('anaSlots').className = 'slots';
  $('anaSlots').innerHTML = anaParts.map((_, k) => `<div class="slot${anaPicked[k] != null ? ' full' : ''}" data-k="${k}">${anaPicked[k] != null ? anaParts[anaPicked[k]] : ''}</div>`).join('');
  $('anaTiles').querySelectorAll('button').forEach(b => b.classList.toggle('used', anaPicked.includes(+b.dataset.i)));
}
$('anaTiles').onclick = e => {
  const b = e.target.closest('button'); if (!b || b.classList.contains('used')) return;
  anaPicked.push(+b.dataset.i); try { GameSounds.pop(anaPicked.length); } catch (er) {}
  anaPaint();
  if (anaPicked.length < anaParts.length) return;
  const got = anaPicked.map(i => anaParts[i]).join('');
  if (got === anaW.w) {  // ίδια γράμματα σε άλλη θέση μετράνε κι αυτά
    $('anaSlots').classList.add('good'); $('anaMsg').textContent = '🎉 Μπράβο!'; snd('correct'); say(anaW.w);
    setTimeout(anaNext, 1600);
  } else {
    snd('wrong'); const s = $('anaSlots'); s.classList.add('bad'); $('anaMsg').textContent = 'Όχι ακόμα — ξαναδοκίμασε!';
    setTimeout(() => { anaPicked = []; anaPaint(); }, 700);
  }
};
$('anaSlots').onclick = e => {  // πάτα ένα γεμάτο κουτάκι: γυρίζει πίσω αυτό και ό,τι ακολουθεί
  const s = e.target.closest('.slot.full'); if (!s) return;
  anaPicked = anaPicked.slice(0, +s.dataset.k); anaPaint();
};
document.querySelectorAll('#ana [data-a]').forEach(b => b.onclick = () => {
  anaBy = b.dataset.a; document.querySelectorAll('#ana [data-a]').forEach(x => x.classList.toggle('on', x === b)); anaNext();
});

/* ---------- Ποιο λείπει: γράμμα ή συλλαβή, ανά κατηγορία · η φωνή λέει τη λέξη ---------- */
const ALL_SYL = [...new Set(W.flatMap(w => w.syl))];
let missBy = 'letter', missCat = '';
// 🗺️ όλες οι κατηγορίες με τη σειρά, TOUR_N λέξεις η καθεμιά (make-voices.js διαβάζει τις φράσεις)
const TOUR = [['Χρώματα', 'Πάμε στα χρώματα!'], ['Ζώα', 'Πάμε στα ζώα!'], ['Φυτά', 'Πάμε στα φυτά!'], ['Σώμα', 'Πάμε στο σώμα μας!'],
  ['Άνθρωποι', 'Πάμε στους ανθρώπους!'], ['Φαγητά', 'Πάμε στα φαγητά!'], ['Φύση', 'Πάμε στη φύση!'], ['Σπίτι', 'Πάμε στο σπίτι!'], ['Μεταφορικά', 'Πάμε στα μεταφορικά!']];
const TOUR_DONE = 'Μπράβο! Πέρασες από όλες τις κατηγορίες!', TOUR_N = 10;  // ως 10 λέξεις ανά κατηγορία (τα χρώματα είναι 10)
let tour = -1, tourN = 0, missDeck = [], missKey = '';
const fits = (w, cat) => (!cat || w.cat === cat) && (missBy === 'letter' ? w.w.length >= 3 : w.syl.length >= 2);
$('missCats').innerHTML = '<button class="chip" data-c="tour">🗺️ Όλες με τη σειρά</button> '
  + ['', ...new Set(W.map(w => w.cat))].map(c => `<button class="chip${c ? '' : ' on'}" data-c="${c}">${c || 'Όλα'}</button>`).join(' ');
document.querySelectorAll('#miss [data-x], #miss [data-c]').forEach(b => b.onclick = () => {
  const k = b.dataset.x ? 'x' : 'c';
  if (k === 'x') missBy = b.dataset.x;
  else { tour = b.dataset.c === 'tour' ? 0 : -1; tourN = 0; missCat = tour < 0 ? b.dataset.c : ''; }
  document.querySelectorAll(`#miss [data-${k}]`).forEach(x => x.classList.toggle('on', x === b)); missNext();
});
function missNext() {
  const intro = [];
  if (tour >= 0) {
    if (tourN >= Math.min(TOUR_N, W.filter(w => fits(w, TOUR[tour][0])).length)) { tourN = 0; tour++; }
    if (tour === TOUR.length) { tour = 0; intro.push(TOUR_DONE); snd('bigCorrect'); }  // τέλος: ξανά από την αρχή
    if (tourN === 0) intro.push(TOUR[tour][1]);
    missCat = TOUR[tour][0]; tourN++;
  }
  // τράπουλα: καμία λέξη δεν ξαναβγαίνει πριν βγουν όλες της κατηγορίας
  if (missKey !== missBy + missCat || !missDeck.length) {
    const pool = W.filter(w => fits(w, missCat));
    missDeck = shuffle(pool.length ? pool : W.filter(w => fits(w, ''))); missKey = missBy + missCat;
  }
  const w = missDeck.pop();
  const parts = missBy === 'letter' ? [...w.w] : w.syl, sep = missBy === 'letter' ? '' : '-';
  const plainAt = parts.map((c, i) => i).filter(i => /^[α-ως]$/.test(parts[i]));  // χωρίς τόνο: ο τόνος θα πρόδιδε τη σωστή απάντηση
  const k = missBy === 'letter' && plainAt.length ? pick(plainAt) : rnd(parts.length), right = parts[k];
  $('missPic').textContent = w.em; $('missMsg').textContent = tour >= 0 ? `🗺️ ${missCat} · ${tourN}/${Math.min(TOUR_N, W.filter(w => fits(w, missCat)).length)}` : '';
  $('missWord').innerHTML = parts.map((s, i) => i === k ? '<span class="blank">&nbsp;</span>' : s).join(sep);
  Voice.say([...intro, w.w]);
  const opts = new Set([right]);
  while (opts.size < 4) opts.add(missBy === 'letter' ? pick([...'αβγδεζηθικλμνξοπρστυφχψω']) : pick(ALL_SYL));
  $('missOpts').innerHTML = shuffle([...opts]).map(s => `<button>${s}</button>`).join('');
  $('missOpts').querySelectorAll('button').forEach(b => b.onclick = () => {
    if (b.textContent === right) {
      b.classList.add('yes'); $('missWord').innerHTML = parts.map((s, i) => i === k ? `<span style="color:#7CFC00">${s}</span>` : s).join(sep);
      $('missMsg').textContent = '🎉 ' + w.w; snd('correct'); say(w.w); setTimeout(missNext, 1500);
    } else { b.classList.add('no'); snd('wrong'); }
  });
}

/* ---------- Τυφλοπόντικας ---------- */
const UP = 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ', LOW = 'αβγδεζηθικλμνξοπρστυφχψω';
const plain = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
let moleWhat = 'letter';
function moleTarget() {
  if (moleWhat === 'letter') {
    const i = rnd(24); return { html: `Χτύπα το <b>${UP[i]} ${LOW[i]}</b>`, make: ok => { const j = ok ? i : (i + 1 + rnd(23)) % 24; return { t: Math.random() < .5 ? UP[j] : LOW[j], ok }; } };
  }
  if (moleWhat === 'syl') {
    const n = 2 + rnd(3), yes = W.filter(w => w.syl.length === n), no = W.filter(w => w.syl.length !== n);
    return { html: `Χτύπα λέξεις με <b>${n} συλλαβές</b> 👏`, make: ok => ({ t: pick(ok ? yes : no).w, ok }) };
  }
  const gen = () => { if (moleWhat === 'mul') { const a = 1 + rnd(9), b = 1 + rnd(9); return [`${a}×${b}`, a * b]; } const a = rnd(11), b = rnd(11 - a); return Math.random() < .5 ? [`${a}+${b}`, a + b] : [`${a + b}−${b}`, a]; };
  let n; do { n = gen()[1]; } while (n < 3);
  return { html: `Χτύπα ό,τι κάνει <b>${n}</b>`, make: ok => { for (let k = 0; k < 300; k++) { const [t, v] = gen(); if ((v === n) === ok) return { t, ok }; } return { t: String(n), ok: true }; } };
}
document.querySelectorAll('#mole [data-w]').forEach(b => b.onclick = () => {
  moleWhat = b.dataset.w; document.querySelectorAll('#mole [data-w]').forEach(x => x.classList.toggle('on', x === b));
  stopMole(); moleIdle();
});
const ANIMALS = ['🐹', '🐭', '🐰', '🦔', '🐻', '🐸'];
function moleIdle() {
  $('field').innerHTML = Array.from({ length: 9 }, () => '<div class="hole"><div class="mole"><div class="face">🐹</div><div class="sign"></div></div></div>').join('');
  $('field').classList.remove('playing');
  $('mTarget').innerHTML = moleTarget().html.replace(/<b>.*<\/b>/, '<b>…</b>');
  $('mStart').hidden = false; $('mScore').textContent = '⭐ 0'; $('mTime').textContent = '⏱ 60'; $('mTime').classList.remove('low'); $('combo').textContent = '';
}
// εφέ σε σημείο της οθόνης: κείμενο που ανεβαίνει ή σπίθες που πετάγονται
function fxText(x, y, txt, color, size = 40) {
  const f = document.createElement('div'); f.className = 'fx'; f.textContent = txt; f.style.color = color; f.style.fontSize = size + 'px';
  f.style.left = x + 'px'; f.style.top = y + 'px'; document.body.appendChild(f);
  f.animate([{ transform: 'translate(-50%,-50%) scale(.6)', opacity: 1 }, { transform: 'translate(-50%,-140%) scale(1.2)', opacity: 0 }], { duration: 800, easing: 'ease-out' }).onfinish = () => f.remove();
}
function fxBurst(x, y, chars, n = 8, dist = 90) {
  for (let i = 0; i < n; i++) {
    const f = document.createElement('div'); f.className = 'fx'; f.textContent = pick(chars); f.style.fontSize = (20 + rnd(20)) + 'px';
    f.style.left = x + 'px'; f.style.top = y + 'px'; document.body.appendChild(f);
    const a = Math.PI * 2 * i / n + Math.random() * .5, r = dist * (.6 + Math.random() * .6);
    f.animate([{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r}px)) scale(1.1) rotate(${rnd(360)}deg)`, opacity: 0 }], { duration: 650 + rnd(300), easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => f.remove();
  }
}
const hammer = document.createElement('div'); hammer.id = 'hammer'; hammer.innerHTML = '<i>🔨</i>'; document.body.appendChild(hammer);
function hammerAt(x, y, swing) {
  hammer.style.display = 'block'; hammer.style.transform = `translate(${x - 30}px, ${y - 60}px)`;
  if (swing) { hammer.classList.remove('swing'); void hammer.offsetWidth; hammer.classList.add('swing'); }
}
$('field').addEventListener('pointermove', e => { if ($('field').classList.contains('playing') && e.pointerType === 'mouse') hammerAt(e.clientX, e.clientY); });
$('field').addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hammer.style.display = 'none'; });
$('field').addEventListener('pointerdown', e => { if ($('field').classList.contains('playing')) hammerAt(e.clientX, e.clientY, true); });

$('mStart').onclick = () => {
  snd('unlock'); $('mStart').hidden = true; $('mStart').textContent = '▶ Ξεκίνα';
  let score = 0, left = 60, target = moleTarget(), hits = 0, streak = 0, best = 0;
  $('mTarget').innerHTML = target.html; $('combo').textContent = '';
  $('field').classList.add('playing');
  const moles = [...document.querySelectorAll('.mole')];
  const up = () => {  // ένας τυφλοπόντικας βγαίνει από άδεια τρύπα
    const free = moles.filter(m => !m.classList.contains('up')); if (!free.length) return;
    const m = pick(free), d = target.make(Math.random() < .45);
    m._d = d; m.className = 'mole up'; m.querySelector('.sign').textContent = d.t; m.querySelector('.face').textContent = pick(ANIMALS);
    clearTimeout(m._t);
    m._t = setTimeout(() => {  // ξέφυγε: αν ήταν σωστός, χάνεται το σερί
      if (m._d.ok && !m.classList.contains('hit')) { streak = 0; $('combo').textContent = ''; }
      m.classList.remove('up');
    }, 1800 - Math.min(800, score * 25));
  };
  moles.forEach(m => m.onpointerdown = e => {
    if (!m.classList.contains('up') || m.classList.contains('hit') || m.classList.contains('miss')) return;
    const r = m.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 3;
    if (!e.clientX) hammerAt(x, y, true);  // από το πληκτρολόγιο: το σφυρί πάει μόνο του
    if (m._d.ok) {
      score++; hits++; streak++; best = Math.max(best, streak);
      m.classList.add('hit'); m.querySelector('.face').textContent = '😵';
      fxText(x, y - 20, '+1', '#7CFC00'); fxBurst(x, y, ['⭐', '✨', '💫'], 9);
      try { GameSounds.pop(streak); GameSounds.correct(); } catch (er) {}
      if (streak >= 3) {
        $('combo').textContent = `🔥 Σερί ×${streak}!`;
        $('combo').animate([{ transform: 'scale(1.5)' }, { transform: 'scale(1)' }], 300);
      }
    } else {
      score = Math.max(0, score - 1); streak = 0; $('combo').textContent = '';
      m.classList.add('miss'); m.querySelector('.face').textContent = '😜';
      fxText(x, y - 20, '−1', '#ff5252'); fxBurst(x, y, ['💢', '❌'], 4, 50);
      $('field').classList.remove('shake'); void $('field').offsetWidth; $('field').classList.add('shake');
      snd('wrong');
    }
    $('mScore').textContent = '⭐ ' + score;
    $('mScore').animate([{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }], 250);
    clearTimeout(m._t); m._t = setTimeout(() => m.className = 'mole', 420);
    if (hits && hits % 6 === 0 && m._d.ok) {  // νέος στόχος
      target = moleTarget(); $('mTarget').innerHTML = target.html;
      $('mTarget').animate([{ transform: 'scale(1.3) rotate(-3deg)', background: '#ffb347' }, { transform: 'scale(1)' }], 500);
    }
  });
  // όσο περνάει η ώρα, βγαίνουν πιο γρήγορα
  let spawnT;
  const spawnLoop = () => { up(); spawnT = setTimeout(spawnLoop, 950 - (60 - left) * 7); };
  spawnLoop();
  const clock = setInterval(() => {
    left--;
    $('mTime').textContent = '⏱ ' + left;
    $('mTime').classList.toggle('low', left <= 10);
    if (left <= 5 && left > 0) try { GameSounds.pop(12 + left); } catch (er) {}
    if (left <= 0) {
      stopMole();
      $('mTarget').innerHTML = `🎉 Τέλος! <b>⭐ ${score}</b>` + (best >= 3 ? ` · 🔥 καλύτερο σερί ${best}` : '');
      const fr = $('field').getBoundingClientRect();
      for (let k = 0; k < 5; k++) setTimeout(() => fxBurst(fr.left + Math.random() * fr.width, fr.top + Math.random() * fr.height, ['🎉', '🎊', '⭐', '🏆'], 10, 140), k * 200);
      snd('bigCorrect'); $('mStart').hidden = false; $('mStart').textContent = '▶ Ξανά';
    }
  }, 1000);
  stopMole = () => {
    clearTimeout(spawnT); clearInterval(clock); hammer.style.display = 'none';
    $('field').classList.remove('playing'); $('mTime').classList.remove('low');
    moles.forEach(m => { clearTimeout(m._t); m.className = 'mole'; }); stopMole = () => {};
  };
};

const INIT = { syl: dealCards, ana: anaNext, miss: missNext, mole: moleIdle };
/* ---------- πληκτρολόγιο ---------- */
// επιλογές, γράμματα/συλλαβές στα Ανακατεμένα και ο αριθμός της κάρτας (όταν δεν είναι ανοιχτή καμία)
KeyPick.watch('.opts button');
KeyPick.watch('.card', el => $('modal').classList.contains('on') ? '' : el.querySelector('.f').textContent);
const NUMPAD = { 7: 0, 8: 1, 9: 2, 4: 3, 5: 4, 6: 5, 1: 6, 2: 7, 3: 8 };  // οι τρύπες όπως στο αριθμητικό πληκτρολόγιο
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if ($('modal').classList.contains('on')) {
    if (e.key === 'Escape') $('modal').classList.remove('on');
    if (e.key === 'Enter') { const b = $('chk') || $('closeDlg'); if (b) { b.click(); e.preventDefault(); } }
    return;
  }
  if ($('mole').classList.contains('on')) {
    if (e.key === 'Enter' && !$('mStart').hidden) { $('mStart').click(); return; }
    const d = (e.code.match(/^(?:Digit|Numpad)([1-9])$/) || [])[1];
    if (d) { const m = document.querySelectorAll('.mole')[NUMPAD[d]]; if (m) m.dispatchEvent(new PointerEvent('pointerdown')); e.preventDefault(); }
    return;
  }
  if ($('ana').classList.contains('on') && e.key === 'Backspace' && anaPicked.length) { anaPicked.pop(); anaPaint(); e.preventDefault(); }
});
</script>
